  <script>
 
  var MANIFEST // holds the parsed Rezdy data
  var TheBoardManifest // used for displaying manifest data (Don't think we're actually using this yet)
  var style = "compact" //("compact","verbose") // global style (for BookingSprite at the moment) 
  
  // --------------------------------- OnLoad --------------------------------------------------
  // (Moved to INIT)
  
  // --------------------------------- Load TripCodes ----------------------------------------------
  function loadTripCodes(){
    google.script.run.withSuccessHandler(onTripCodeLoad)
    .loadTripCodes();
  }
  function onTripCodeLoad(data){
    gya.trips = data
  }

  // ************************************************************************************
  // This should be moved out of index.html *********************************************
  // ************************************************************************************
  
  
  // --------------------------------- Load Rezdy ----------------------------------------------
  function loadRezdy(requestedDate){

    if (!!requestedDate){
      requestedDate = requestedDate
    } else {
      requestedDate = dates.getNZ($("#datepicker").datepicker('getDate'))
    }
    $(".Manifest_Container .Manifest").css("background-color","#ccc")
    google.script.run.withSuccessHandler(onRezdyLoad)
    .loadRezdy( requestedDate );
  }
  // ----------------------------------------------------------------------------------------------------------
  //
  //----------------------------------- Receive Rezdy ( onRezdyLoad ) -----------------------------------------
  //
  // ---------------------------------- Show Manifest ---------------------------------------------------------
  //
  function onRezdyLoad(json) {
    utility.alert("Rezdy Loaded","#ManifestMessages")
    $(".Manifest_Container .Manifest").css("background-color","#68a167")
    // Remove all old booking objects (need to clear the board and theBoard array as well) ********************************
    $('.BookingSprite').remove()
    

    let data = JSON.parse(json)
    console.log( "JSON Loaded: %o",data )
    // -----------------------
    // Parse Rezdy Data
    //------------------------
    MANIFEST = rezdy.parseData(data)
    //
    // Sort bookings by trip time
    //
    MANIFEST.sort(function(a, b) {
      return a.time.localeCompare(b.time) // localCompare is a Javascript function
    })
    console.log("Manifest: %o",MANIFEST)
    $( "#MANIFEST" ).empty() // clear the old manifest list
    // ---------------------
    // Show Manifest
    // ---------------------
    display.showManifest(MANIFEST,style) // style is a global variable ("compact","verbose")
    
}

  </script>

<script>

  function msgbox(text,buttontext,title) {
    buttontext = buttontext || "OK"
    title = title || ""
    $( "<div>" + text + "</div>" ).dialog({
      dialogClass: "no-close",
      title: title,
      position: { my: "left top", at: "left top", of: this },
      show: {
      effect: "blind", 
      duration: 300
      },
      buttons: [
        {
          text: buttontext,
          click: function() {
            window.top.close()           
            $( this ).dialog( "close" );
            $( this ).remove();
          }
        }
      ]
    });
  }
  </script>
