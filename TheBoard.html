        Rezdy.load()
      },

      //
      // Autogen boards
      //
      newRow: function ($table, cols) {
        $row = $("<tr/>")
        for (i = 0; i < cols.length; i++) {
          $col = $("<td/>").append(cols[i])
          $row.append($col)
        }
        $table.append($row)
      },
      makeTable: function () {
        let anchor = "root"
        let addRow = []
        let numCols = 5
        let numRows = 12

        let table = $("#" + anchor).append("<table class='BoardTable' id='MYTable' />")

        table.append('<div><input class="Nav datepicker" type="text" size="8" id="MyDatePicker" />DatePicker</div>')
        // ----------------------
        // Header Row
        // ----------------------
        let headerRow = []
        headerRow.push($('<td class="PickupAllCell" id="PH">&#9951;</td>'))
        headerRow.push($('<td class="Label Row_0 Col_0" id="0_0">Time</td>'))
        //
        for (let i = 1; i <= numCols; i++) {
          let id = "0" + "_" + i
          let col = $("<td />", {
            class: "PlaneCell Row_0 Col_" + i,
            id: id,
            text: id,
          })
          headerRow.push(col)
        }
        this.newRow(table, headerRow)
        //
        // Plotting Board
        //
        for (let r = 1; r <= numRows; r++) {
          // After the header row, we'll loop over the row maker function
          let thisRow = r
          let thisHour = time.getHourByRow(thisRow, 2)
          let myRow = []
          //
          // Pickup Column
          //
          myRow.push($('<td class="PickupCell" id="Row_' + thisRow + '"><span style="color: white;">00</span></td>'))
          //
          // Time column
          //
          let timeTD =
            '<td class="TimeCell Row_' +
            thisRow +
            ' Col_0" id="' +
            thisRow +
            '_0">' +
            '<span class="HourSchedule"><span class="hour">' +
            thisHour +
            '</span>:<span class="minute">00</span></span>' +
            '<div class="HalfHourSchedule">(' +
            thisHour +
            ":30)</div></td>"
          myRow.push($(timeTD))
          //
          // TableCells
          //
          for (let c = 1; c <= numCols; c++) {
            let TD = $("<td />", {
              class: "TableCell Row_" + r + " Col_" + c,
              id: r + "_" + c,
              text: r + "_" + c,
            })
            myRow.push(TD)
          }
          this.newRow(table, myRow)
        }
        //
        // Initialize this board
        //
        //
        // DatePicker
        //
        $("#" + anchor + " .datepicker").datepicker({
          dateFormat: "dd/mm/yy",
          firstDay: 1,
          onSelect: function (dateText) {
            console.log("Date Selected")
            TheBoard.next(0, true)
            $(this).blur() // Removes focus
          },
        })
        $("#" + anchor + " .datepicker").datepicker("setDate", "today")
      },
    }
    jQuery(document).ready(function () {})
  </script>
  <button type="button" onclick="TheBoard.makeTable()">makeTable</button>
