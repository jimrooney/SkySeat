<script>
  class BookingDiv {
    constructor($root) {
      this.$root = $root // save a reference to the jQuery object
      // Access this object through $([Board Selector]).data('root')
    }
    write(booking) {
      console.log("Write BookingDiv")
      console.log("booking %o", booking)

      let $container = this.$root.append("<span class='tooltip' />")

      if (!!booking.orderNumber) {
        let masterkey = booking.orderNumber.split("-")[0]
        // "2FCF" coded sprite
        let span =
          '<div class="BookingSprite Manifest" id="' +
          booking.orderNumber +
          '" style="float:left;font-weight:bold;background-color:' +
          colors.getByBooking(booking) +
          '">' +
          booking.seats +
          " " +
          booking.product +
          "</div>"
          $container.append(span)
      }
    }
  }
</script>
