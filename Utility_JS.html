<script>
  function msgbox(text, buttontext, title) {
    buttontext = buttontext || "OK"
    title = title || ""
    $("<div>" + text + "</div>").dialog({
      dialogClass: "no-close",
      title: title,
      position: { my: "left top", at: "left top", of: this },
      show: {
        effect: "blind",
        duration: 300,
      },
      buttons: [
        {
          text: buttontext,
          click: function () {
            window.top.close()
            $(this).dialog("close")
            $(this).remove()
          },
        },
      ],
    })
  }

  function createArry() {
    createArray(3, 5)
  }

  function createArray(d1, d2) {
    let x = new Array(d1)

    for (let i = 0; i < x.length; i++) {
      x[i] = new Array(d2)
    }
    return x
  }
  var utility = {
    getTable(tableData) {
      const table = document.createElement("table")
      table.style.textAlign = 'right';
      const tableBody = document.createElement("tbody")
      tableData.forEach(function (rowData) {
        const row = document.createElement("tr")
        rowData.forEach(function (cellData) {
          const cell = document.createElement("td")
          cell.appendChild(document.createTextNode(cellData))
          row.appendChild(cell)
        })
        tableBody.appendChild(row)
      })
      table.appendChild(tableBody)
      return table
    },
    //
    // Transpose
    // swap array rows for columns
    //
    transpose(matrix) {
      let [row] = matrix
      return row.map((value, column) => matrix.map((row) => row[column]))
    },
    round(num, decimalPlaces) {
      let factor = 100
      if (decimalPlaces > -1) {
        factor = Math.pow(10, decimalPlaces)
      }
      num = Number(num)
      return Math.round((num + Number.EPSILON) * factor) / factor
    },
    // ========================================== Get Pax ==========================================
    // Takes JSON booking
    // Returns pax object
    //    adult: ret[0],
    //    child: ret[1],
    //    infant: ret[2],
    //    seats: seats,
    //    code: code,
    //    ACI: ACI,
    // -----------------------------------------------------------------------------
    // Get passenger numbers. If quantities are by product and not pax, return false
    // -----------------------------------------------------------------------------
    getPax: function (json) {
      let byPax = false
      let ret = new Array(2)
      if (json.quantities) {
        // -----------------------------------------------------------------------------
        // Check for ACI... if not, return false
        // -----------------------------------------------------------------------------
        let q = json.quantities
        if (q) {
          for (let i in q) {
            if (q[i].optionLabel.match(/Adult/gi)) {
              byPax = true
            }
            if (q[i].optionLabel.match(/Child/gi)) {
              byPax = true
            }
            if (q[i].optionLabel.match(/Infant/gi)) {
              byPax = true
            }
          }
        }

        let A = typeof q[0] !== "undefined" ? parseInt(q[0].value) || 0 : 0
        let C = typeof q[1] !== "undefined" ? parseInt(q[1].value) || 0 : 0
        let I = typeof q[2] !== "undefined" ? parseInt(q[2].value) || 0 : 0

        let Adult = parseInt(ret[0]) || 0
        let Child = parseInt(ret[1]) || 0
        let Infant = parseInt(ret[2]) || 0

        ret[0] = Adult + A
        ret[1] = Child + C
        ret[2] = Infant + I

        let ACI = ret

        let code = ""
        ret[0] > 0 ? (code += ret[0] + "A") : code
        ret[1] > 0 ? (code += ret[1] + "C") : code
        ret[2] > 0 ? (code += ret[2] + "I") : code
        let seats = ret[0] + ret[1]

        let pax = {
          adult: ret[0],
          child: ret[1],
          infant: ret[2],
          seats: seats,
          code: code,
          ACI: ACI,
        }
      }
      if (byPax) {
        return pax
      } else {
        return false
      }
    },
    getACI: function (booking) {
      let ret = booking.pax
      return ret.length
    },
    // Stringify Adult/Child/Infant for display (2A3C1I)
    ACI: function (array) {
      let ret = ""
      for (a in array) {
        let A = parseInt(array[a])

        if (A > 0) {
          a = parseInt(a)
          switch (a) {
            case 0:
              ret = ret + array[a] + "A"
              break
            case 1:
              ret = ret + array[a] + "C"
              break
            case 2:
              ret = ret + array[a] + "I"
              break
          }
        }
      }
      return ret
    },
    // Takes either a PlaneCell and a booking or a TableCell and a booking
    // Returns Two cell coordinates, the IN cell and the OUT cell
    getTarget: function (cell, booking) {
      let offset = gya.getOffset(booking.product)
      let row = null
      let col = null

      if (cell.attr("class").search("PlaneCell") >= 0) {
        row = parseInt(root.time.getRow(booking.time))
        col = parseInt(cell.prop("id").match(/\d+/g)) // Get PlaneCell id digits (which equal the column)
      } else {
        //console.log("Parent Row: %o",cell.parent().prop('id'))
        row = parseInt(cell.parent().prop("id").match(/\d+/g)) // Get Cell Parent id digits (which equal the column)
        col = parseInt(cell.prop("id").slice(-1))
      }
      let IN = [row, col]
      let outRow = row + offset
      let OUT = [outRow, col]
      let isout = false
      if (booking.product && booking.product.toUpperCase().includes("CCF")) {
        isout = true
      }
      if (booking.product && booking.product.toUpperCase().includes("OUTS")) {
        isout = true
      }
      if (booking.product && booking.product.toUpperCase().includes("ONFB")) {
        isout = true
      }
      if (booking.product && booking.product.includes("SR-Aspiring")) {
        isout = true
      }
      if (
        cell.data("type") &&
        cell.data("type").toUpperCase().includes("OUTS")
      ) {
        isout = true
      }

      if (isout) {
        OUT = [row, col]
        IN = []
      }
      return [IN, OUT, offset]
    },
    pushKey: function (obj, key, val) {
      let newVal = JSON.parse(JSON.stringify(val))
      if (key) {
        if (typeof obj[key] != "undefined") {
          obj[key].push(newVal)
        } else {
          obj[key] = [newVal]
        }
      }
    },
    getTimes: function (bookings, target) {
      let col = target.prop("id").match(/\d+/g) //get only digits
      let match = false
      let returnTripTarget = ""
      //
      // Each Booking
      //
      for (b in bookings) {
        let booking = bookings[b]
        let t = time.getHour(booking.time)
        //
        // Array of all TimeCells
        //
        let all = $(".TimeCell")
          .map(function () {
            return this.id
          })
          .get()
        //
        // Each Timecell
        //
        for (id in all) {
          let row = $("#" + all[id])
            .parent()
            .prop("id")
            .match(/\d+/g) // Get Time Row#

          let cellTime = $("#" + all[id]).text()
          let timeCellID = $("#" + all[id]).prop("id")

          let timeCell = $("#" + row + col)
          let offset = gya.getOffset(booking.product)
          let outRow = parseInt(row) + parseInt(offset) // pull from data
          returnTripTarget = $("#" + outRow + col)

          if (cellTime == t) {
            target = timeCell
            match = true
            break
          }
        }
      }
      if (!match) {
        // Invalid Drop (reject or it will plot on the Plane Cell)
        return null
      }
      return [target, returnTripTarget]
    },
    close: function () {
      //google.script.run()
      google.script.host.close()
    },
    error: function (message, object) {
      object = object || ""
      message = "<BR>" + message
      $('<div class="error">Error: ' + message + "</div>")
        .insertAfter("#Error")
        .delay(3000)
        .fadeOut(function () {
          $(this).remove()
        })
    },
    alert: function (message, targetObject) {
      targetObject = targetObject || "#Alert"
      $('<div class="alert">' + message + "</div>")
        .insertAfter(targetObject)
        .css("z-index", 10)
        .delay(3000)
        .fadeOut(function () {
          $(this).remove()
        })
    },
    // Get a list of products in a list of bookings
    // Eventually maybe even list the # of pax per product **********
    getProducts: function (bookings) {
      let ret = {}
      for (b in bookings) {
        let B = bookings[b]
        let product = B.product
        if (!ret[product]) {
          // can probably just assign this regardless of if it exists.
          ret[product] = product
        }
      }
      return ret
    },

    printDiv: function (_this) {
      let printMe = getElementChildrenAndStyles($("#TheBoard"))
      if (_this) {
        printMe = getElementChildrenAndStyles(_this)
      }
      let style =
        "<style> .inMarker{float:right; display: block;} .outMarker{float:right;display: block;} </style>"
      // -webkit-print-color-adjust to keep colors for the printing version
      let keepColors =
        "<style>body {-webkit-print-color-adjust: exact !important; }</style>"
      let newWin = window.open("", "Print-Window")
      newWin.document.open()
      newWin.document.write(
        "<html><head>" +
          keepColors +
          " " +
          style +
          '</head><body onload="window.print()">' +
          printMe +
          "</body></html>"
      )
      newWin.document.close()
      setTimeout(function () {
        newWin.close()
      }, 10)
    },
    printPickup: function () {
      //utility.printDiv($("#PickupList"))
      $("#PickupList").focus()
      window.print()
    },
    convertHex: function (hex, opacity) {
      hex = hex.replace("#", "")
      r = parseInt(hex.substring(0, 2), 16)
      g = parseInt(hex.substring(2, 4), 16)
      b = parseInt(hex.substring(4, 6), 16)
      result = "rgba(" + r + "," + g + "," + b + "," + opacity / 100 + ")"
      return result
    },
    hexToRgbA: function (hex, alpha = 1) {
      let c
      if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
        c = hex.substring(1).split("")
        if (c.length == 3) {
          c = [c[0], c[0], c[1], c[1], c[2], c[2]]
        }
        c = "0x" + c.join("")
        return (
          "rgba(" +
          [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(",") +
          `,${alpha})`
        )
      }
      throw new Error("Bad Hex")
    },
  }
  root.utility = utility

  var arrays = {
    average: function (ary) {
      let sum = 0
      for (let i = 0; i < ary.length; i++) {
        sum += parseInt(ary[i], 10) //don't forget to add the base
      }
      let avg = sum / ary.length
      return avg
    },
    sum: function (ary, maxCol) {
      let col = ary.length
      if (typeof maxCol !== "undefined") {
        col = maxCol
      }
      let sum = 0
      for (let i = 0; i < col; i++) {
        sum += parseInt(ary[i], 10) //don't forget to add the base
      }
      return sum
    },
    colSum: function (a, b) {
      let matrix = [a, b]
      let colSum = matrix.reduce((a, b) => a.map((x, i) => x + b[i]))
      return colSum
    },
    sumArray: function (arry) {
      return arry.reduce((a, b) => a + b, 0)
    },
    sortFunction: function (a, b) {
      if (a[0] === b[0]) {
        return 0
      } else {
        return a[0] < b[0] ? -1 : 1
      }
    },
    reverseSortFunction: function (a, b) {
      if (a[0] === b[0]) {
        return 0
      } else {
        return a[0] > b[0] ? -1 : 1
      }
    },
    merge(a, b) {
      return a.concat(b.filter((item) => a.indexOf(item) < 0))
    },
  }
  root.arrays = arrays
</script>
