<script>
  class BookingSprite {
    constructor($root) {
      this.$root = $root // save a reference to the jQuery object
      // Access this object through $([Board Selector]).data('root')
    }
    write(booking) {
      console.log("Write BookingSprites")
      let $details = $("<span class='tooltip' />")
      if (!!booking.orderNumber) {
        let masterkey = booking.orderNumber.split("-")[0]
        // "2FCF" coded sprite
        $details.addClass("BookingSprite")
        $details.prop("id", booking.orderNumber)
        $details.css("background-color", colors.getByTime(booking))
        $details.text(booking.flight.seats + " " + booking.product)
      }
      this.$root.append($details)
    }
  }
</script>
