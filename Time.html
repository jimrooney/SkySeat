<script>
  var time = {
    //
    // We can make getTime pseudo-polymorphic by examining what's passed in and replying accordingly.
    // So if we pass in a in12hr boolean, we give it back in AM/PM
    //
    decimalToHours: (time) => {
      time = time + "" // force string
      time = time.split(".")
      time[1] = time[1].substring(0, 1)
      time[1] = Math.floor(time[1] * 6)
      time[1] = time[1] < 10 ? `0${time[1]}` : time[1]
      return time
    },
    getTime: function (string, in12hr) {
      let date = new Date(string)
      let hours = date.getHours()
      let minutes = date.getMinutes()
      if (minutes == 0) {
        minutes = "00"
      }
      return hours + ":" + minutes
    },
    getHour: function (string) {
      //time: "2019-10-03 15:15:00"
      let date = new Date(string)
      let hour = date.getHours()
      if (hour > 12) {
        hour = hour - 12
      }
      if (hour > 6 && hour < 10) {
        hour = "" + 0 + hour
      }
      hour = hour + ":00"
      return hour
    },
    getHourByRow: function (row, numDigits) {
      let hour = row + 6 // Assumes row 0 is a header row and the day starts at 7am
      if (hour > 12) {
        hour = hour - 12
      }
      if (!!numDigits && numDigits > 1 && hour < 10) {
        hour = "0" + "" + hour
      }
      return hour
    },
    getRowByHour(hour) {
      return this.getRow(hour)
    },
    getRow: function (h) {
      let hour = parseInt(h)
      if (hour > 12) {
        hour = hour - 12
      }
      /*                 **********************************************
                              This is a hack!
                              This is to make the 11:30 bookings plot at 12
                          *********************************************
      */
      if (hour == 11){
        hour = 12
      }
      // Array of all TimeCells
      let all = $(".TimeCell")
        .map(function () {
          return this.id
        })
        .get()
      // Match Time to Timecell

      if (hour > 0) {
        for (id in all) {
          let row = $("#" + all[id])
          let rHour = parseInt(row.data("hour"))
          if (hour == rHour) {
            return row
          }
        }
      }

      return null
    },
  }
  root.time = time
</script>
