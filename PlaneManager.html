<script>

//
// onLoad() hours from spreadsheet
//
  function onPlaneDataLoad(data){
    let planes = {}
    for (let a in data[0]){
      planes[data[0][a]] = data[0][a]
    }
    //
    //console.log("data %o",data)
    //
    for (let row in data){
      for(let col in data[row]){
        if (data[row][col]){
          planes[data[0][col]] = data[row][col]
        }
      }
    }
    $(".PlaneCell").each(function(){
      $('> #hours', this).remove()
      let PCF = $(this).data('PCF')
      let id = PCF[0]
      
      let hours = planes[id]
      
      let span = "<div id='hours' style='font-size:small;'>[hrs: <B>" + hours + "</B>]</div>"
      $(this).prepend(span)
    })
    
    console.log("planes %o",planes)
    
  }
  
  

$(function () {
    $('#planeDetailsClose').click(function(){
        $('.planeDetails').hide()
    })
})
var pilotManager={
  loadPilots:function(data){
    if (data){
      pilots.matrix = data
    }
  },
}
var planeData={
//  "JRR": [1084.7,1.3392,1452.653,"#d66956"],
//  "ORC": [1067.92,1.3096,1398.61,"#568bd6"],
//  "LOR": [1066.9,1.36203,1453.151,"#56d687"],
//  "ZEA": [1098.6,1.3397,1471.79442,"#f2eb61"],
  
  // "JTK"
}

//REG	Weight	ARM	Moment	MAUW	MaxCG	Type	Burn	TAS
//JTK				1719		C206	80	145
//JRR	1084.7	1.3392	1452.653	1905	1.626	GA8	60	105
//ZEA	1098.6	1.3397	1471.79442	1905	1.626	GA8	60	105
//ZEA-POD	1128.1	1.3563	1530.053	1905	1.626	GA8	60	105
//LOR	1066.9	1.36203	1453.151	1905	1.626	GA8	60	105
//ORC	1067.92	1.3096	1398.61	1905	1.626	GA8	60	105

//
// An array of plane objects... could rather be a key'd object array of plane key'd by reg though ****************
//
var planes = {
  reg:[],
  getPlane: function(registration){
    for (let r in this.reg){
      if (this.reg[r].reg == registration){
        return this.reg[r]
      }
    }
    return null
  }
}
var planeManager={
  //
  // Load in plane hours from spreadsheet
  //
  loadHours:function(){
    google.script.run.withSuccessHandler(onPlaneDataLoad)
    .loadPlaneData();  
  },
  loadPlanes:function(data){
    //
    // Parse loaded two dimensional array into planes object
    //
    let count = 0
    for (let row in data){
      let parsed = {}
      for (let col in data[row]){
        parsed[data[0][col]]=data[row][col] // transforms array to object
      }
      //
      // Skipping JTK for now *****************************************************
      //
      if (parsed.REG!="REG" && parsed.REG!="JTK"){
        planes.reg.push(new GA8(parsed))
        
        let num = count +1
        let planeCell = $( "#ac" + num)
        // Standard Load
        $( "#ac" + num).data('PCF',[parsed.REG,[pilots.matrix[0],null],150]) // Plane-Crew-Fuel default // pilots.matrix[1] for co-pilot *************
        planeManager.updateCell(planeCell) // this.updateCell? *********
        count++
      }
      if (parsed.REG!="REG" && parsed.REG=="JTK"){
        planes.reg.push(new C206(parsed))
        
        let num = count +1
        let planeCell = $( "#ac" + num)
        // Standard Load
        $( "#ac" + num).data('PCF',[parsed.REG,[pilots.matrix[0],null],150]) // Plane-Crew-Fuel default // pilots.matrix[1] for co-pilot *************
        planeManager.updateCell(planeCell) // this.updateCell? *********
        count++
      }
    }
    //
    // Load current day
    //
    rezdy.load()
    theBoard.load()
  },
  planePopup:function(_this){
      let container = $("#planeDetails")
      //
      let PCF = _this.data('PCF')
      this.dropmenu(_this)
      //
      container.show()
    },
  //
  // Drop Menu
  //
  dropmenu:function(_this) {
    this.dropPlane(_this)
    this.dropPilot(_this)
    this.dropCoPilot(_this)
    this.dropFuel(_this)
  },
  updateCell:function(_this){
    let PCF = _this.data('PCF')    
    display.update()
    //_this.html(PCF[0] + "<br>" + PCF[1][0][0] + "<br>" + PCF[2] + "L")
  },
  dropPlane:function(_this){
    let _drop = '<span class="dropdown"><button id="PlaneDrop" class="dropbtn">Plane</button>' + 
    '<div id="myPlaneDropdown" class="dropdown-content"></div></span>'
    
    let box = $("#pd_Plane")
    box.empty() // clear the old contents
    box.append(_drop)
    $("#PlaneDrop").click(function() {
      for (let p in planes.reg){
          let selected = planes.reg[p].reg
          
          let menu_row = "<div class='changePlane' id='" + selected + "'>" + selected + "</div>"
          box.append(menu_row)
            $("#"+selected).click( function(){
            
                let PCF = _this.data('PCF')
                PCF[0] = selected
                
                planeManager.updateCell(_this)
                box.empty()
          })
        }
    })
  },
  dropPilot:function(_this){
    let _drop = '<span class="dropdown"><button id="PilotDrop" class="dropbtn">Pilot</button>' + 
    '<div id="myDropdown" class="dropdown-content"></div></span>'
    
    let box = $("#pd_Pilot")
    box.empty() // clear the old contents
    box.append(_drop)
    $("#PilotDrop").click(function() {
      for (let p in pilots.matrix){
          let selected_pilot = pilots.matrix[p]
          
          let menu_row = "<div class='changePilot' id='" + selected_pilot[0] + "'>" + selected_pilot[0] + "</div>"
          box.append(menu_row)
            $("#"+selected_pilot[0]).click( function(){
            
                let PCF = _this.data('PCF')
                PCF[1][0] = selected_pilot
                
                planeManager.updateCell(_this)
                box.empty()
          })
        }
    })
  },
  dropCoPilot:function(_this){
    let _drop = '<span class="dropdown"><button id="CoPilotDrop" class="dropbtn">CoPilot</button>' + 
    '<div id="myDropdown" class="dropdown-content"></div></span>'
    
    let box = $("#pd_CoPilot")
    box.empty() // clear the old contents
    box.append(_drop)
    $("#CoPilotDrop").click(function() {      
      for (let p in pilots.matrix){
          let selected_pilot = pilots.matrix[p]
          let menu_row = "<div class='changeCoPilot' id='Co" + selected_pilot[0] + "'>" + selected_pilot[0] + "</div>"
          box.append(menu_row)
            $("#Co"+selected_pilot[0]).click( function(){
            
                let PCF = _this.data('PCF')
                PCF[1][1] = selected_pilot
                if (selected_pilot[0] == "Standard"){
                  delete PCF[1][1]
                }
                
                planeManager.updateCell(_this)
                box.empty()
          })
        }
    })
  },
// ******************** could probably wrap these three functions into one ****************************
  dropFuel:function(_this){
    let _drop = '<span class="dropdown"><button id="FuelDrop" class="dropbtn">Fuel</button>' + 
    '<div id="myFuelDrop" class="dropdown-content"></div></span>'
    
    let box = $("#pd_Fuel")
    box.empty() // clear the old contents
    box.append(_drop)
    $("#FuelDrop").click(function() {      
      for (let i = 0 ; i <= 32 ; i++){
          let f = i*10
          let selected = f
          let menu_row = "<div class='changeFuel' id='" + selected + "'>" + selected + "L</div>"
          box.append(menu_row)
            $("#"+selected).click( function(){
            
                _this.data('PCF')[2] = selected
                
                planeManager.updateCell(_this)
                box.empty()
          })
        }
    })
  },
}

</script>
<style>
.dropbtn {
  background-color: #3498DB;
  color: white;
  padding: 4px;
  font-size: 10px;
  border: none;
  cursor: pointer;
}

.dropbtn:hover, .dropbtn:focus {
  background-color: #2980B9;
}

.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f1f1f1;
  min-width: 160px;
  overflow: auto;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: black;
  padding: 6px 8px;
  text-decoration: none;
  display: block;
}

.dropdown a:hover {background-color: #ddd;}

.show {display: block;}
</style>



<script>


// Close the dropdown if the user clicks outside of it
window.onclick = function(event) {
  if (!event.target.matches('.dropbtn')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    var i;
    for (i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) {
        openDropdown.classList.remove('show');
      }
    }
  }
}
</script>
