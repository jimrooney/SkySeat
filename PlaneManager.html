<script>
  var planes = {
    rawData: [],
    data: [],
    getPlane: function (registration) {
      for (let r in this.data) {
        if (this.data[r].reg == registration) {
          return this.data[r]
        }
      }
      return null
    },
  }
  root.planes = planes
  var PlaneManager = {
    planes: planes, // quick cheat to externalize planes object to root {planes}
    //
    // Load in plane hours from spreadsheet
    //
    loadHours: function () {
      return
    },
    loadPlanes: function (data) {
      //
      // Parse loaded two dimensional array into root planes object
      //
      //
      // Because this gets called from a Success Handler (Google), "this" is the Window Object, so we'll make our own "_this"
      //
      let _this = PlaneManager
      let _rawData = planes.rawData // Everything loaded from the spreadsheet
      let _planeData = planes.data // Excludes non-plane data like "NoJTK"
      //
      // Convert [[]] to [{}]
      // Objects key'd by header row labels (lowercased) *** maybe clean more than just lowercasing ***
      //
      data.forEach((row, i) => {
        let rowPlane = {}
        if ((i > 0)&&(data[i][0].length>0)) { // skip the header row & blank rows --
          row.forEach((element, pos) => {
            rowPlane[data[0][pos].toLowerCase()] = element // use header row element as variable name for element value
          })
          _rawData.push(rowPlane)
        }
      })
      // ----------------------------
      // Creates a list of dynamically created {Airplane} objects
      // ----------------------------
      //
      // Convert [{}] object list to [{Class}] Classed objects based on "type" attribute (206/208/GA8)
      //
      _rawData.forEach((plane) => {
        if (!!plane.type && !plane.legacy) { // filter out legacy planes
          let dynamic_class = eval(plane.type)
          let instance = new dynamic_class(plane)
          _planeData.push(instance)
        }
      })
    },
    planePopup: function (_this) {
      let container = $("#planeDetails")
      //
      let PCF = _this.data("PCF")
      this.dropmenu(_this)
      //
      container.show()
    },
    //
    // Drop Menu
    //
    dropmenu: function (_this) {
      this.dropPlane(_this)
      this.dropPilot(_this)
      this.dropCoPilot(_this)
      this.dropFuel(_this)
    },
    updateCell: function (_this) {
      let PCF = _this.data("PCF")
      //display.update()
      //_this.html(PCF[0] + "<br>" + PCF[1][0][0] + "<br>" + PCF[2] + "L")
    },
    // *********************************************************************************************************
    // Updating all plane cells for now... this can change to update specific boards rather than the whole class
    // *********************************************************************************************************
    updatePlaneCells: function () {
      //
      // Each PlaneCell
      //
      $(".PlaneCell").each(function () {
        let PCF = $(this).data("PCF")
        $(this).empty() // Just remove everything for now *****************
        if (PCF) {
          let _content = "<span id='content'>" + PCF[0] + "<br>" + PCF[1][0][0] + "<br>" + PCF[2] + "L" + "</span>"
          $(this).append(_content)
          if (PCF[1][1]) {
            _content = "<br><span style='font-size:small;'>" + PCF[1][1][0] + "</span><br>"
            $(this).append(_content)
          }
          let _plane = PlaneManager.planes.getPlane(PCF[0])
          if (_plane) {
            let c = _plane.regColor
            let bkg = "linear-gradient(180deg, " + c + " -20%, #fff 50%)"
            $(this).css("background-image", bkg)

            // $(this).css("opacity", 0.75)
          }
        }
      })
    },
    // ******************** could probably wrap these dropmenu functions into one ****************************
    //
    // Plane Dropmenu
    //
    dropPlane: function (_this) {
      let _drop =
        '<span class="dropdown"><button id="PlaneDrop" class="dropbtn">Plane</button>' +
        '<div id="myPlaneDropdown" class="dropdown-content"></div></span>'

      let box = $("#pd_Plane")
      box.empty() // clear the old contents
      box.append(_drop)
      $("#PlaneDrop").click(function () {
        for (let p in PlaneManager.planes.list) {
          let selected = PlaneManager.planes.list[p].reg

          let menu_row = "<div class='changePlane' id='" + selected + "'>" + selected + "</div>"
          box.append(menu_row)
          $("#" + selected).click(function () {
            let PCF = _this.data("PCF")
            PCF[0] = selected

            PlaneManager.updateCell(_this) // this.updateCell ? *******************
            box.empty()
          })
        }
      })
    },
    //
    // Pilot Dropmenu
    //
    dropPilot: function (_this) {
      let _drop =
        '<span class="dropdown"><button id="PilotDrop" class="dropbtn">Pilot</button>' +
        '<div id="myDropdown" class="dropdown-content"></div></span>'

      let box = $("#pd_Pilot")
      box.empty() // clear the old contents
      box.append(_drop)
      $("#PilotDrop").click(function () {
        for (let p in pilots.matrix) {
          let selected_pilot = pilots.matrix[p]

          let menu_row = "<div class='changePilot' id='" + selected_pilot[0] + "'>" + selected_pilot[0] + "</div>"
          box.append(menu_row)
          $("#" + selected_pilot[0]).click(function () {
            let PCF = _this.data("PCF")
            PCF[1][0] = selected_pilot

            PlaneManager.updateCell(_this)
            box.empty()
          })
        }
      })
    },
    //
    // CoPilot Dropmenu
    //
    dropCoPilot: function (_this) {
      let _drop =
        '<span class="dropdown"><button id="CoPilotDrop" class="dropbtn">CoPilot</button>' +
        '<div id="myDropdown" class="dropdown-content"></div></span>'

      let box = $("#pd_CoPilot")
      box.empty() // clear the old contents
      box.append(_drop)
      $("#CoPilotDrop").click(function () {
        for (let p in pilots.matrix) {
          let selected_pilot = pilots.matrix[p]
          let menu_row = "<div class='changeCoPilot' id='Co" + selected_pilot[0] + "'>" + selected_pilot[0] + "</div>"
          box.append(menu_row)
          $("#Co" + selected_pilot[0]).click(function () {
            let PCF = _this.data("PCF")
            PCF[1][1] = selected_pilot
            if (selected_pilot[0] == "Standard") {
              delete PCF[1][1]
            }

            PlaneManager.updateCell(_this)
            box.empty()
          })
        }
      })
    },
    //
    // Fuel Dropmenu
    //
    dropFuel: function (_this) {
      let _drop =
        '<span class="dropdown"><button id="FuelDrop" class="dropbtn">Fuel</button>' +
        '<div id="myFuelDrop" class="dropdown-content"></div></span>'

      let box = $("#pd_Fuel")
      box.empty() // clear the old contents
      box.append(_drop)
      $("#FuelDrop").click(function () {
        for (let i = 0; i <= 32; i++) {
          let f = i * 10
          let selected = f
          let menu_row = "<div class='changeFuel' id='" + selected + "'>" + selected + "L</div>"
          box.append(menu_row)
          $("#" + selected).click(function () {
            _this.data("PCF")[2] = selected

            PlaneManager.updateCell(_this)
            box.empty()
          })
        }
      })
    },
  }
</script>
<style>
  .dropbtn {
    background-color: #3498db;
    color: white;
    padding: 4px;
    font-size: 10px;
    border: none;
    cursor: pointer;
  }

  .dropbtn:hover,
  .dropbtn:focus {
    background-color: #2980b9;
  }

  .dropdown {
    position: relative;
    display: inline-block;
  }

  .dropdown-content {
    display: none;
    position: absolute;
    background-color: #f1f1f1;
    min-width: 160px;
    overflow: auto;
    box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
    z-index: 1;
  }

  .dropdown-content a {
    color: black;
    padding: 6px 8px;
    text-decoration: none;
    display: block;
  }

  .dropdown a:hover {
    background-color: #ddd;
  }

  .show {
    display: block;
  }
</style>

<script>
  // Close the dropdown if the user clicks outside of it
  window.onclick = function (event) {
    if (!event.target.matches(".dropbtn")) {
      let dropdowns = document.getElementsByClassName("dropdown-content")
      let i
      for (i = 0; i < dropdowns.length; i++) {
        let openDropdown = dropdowns[i]
        if (openDropdown.classList.contains("show")) {
          openDropdown.classList.remove("show")
        }
      }
    }
  }
</script>
