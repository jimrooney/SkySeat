<script>
  // Mobile Events (could use a rethink) ***********************************
  // mouse is in Global
  function _mouseOverEvent(event, ui) {
    if (isMobile) {
      mouse.setOver(event.pageX, event.pageY)
    }
  }
  function _mouseOutEvent(event, ui) {
    if (isMobile) {
      let click = mouse.isClick(event.pageX, event.pageY)
      if (click) {
        if ($(this).hasClass("TableCell")) {
          $(this).click()
        }
        if ($(this).hasClass("popupCloseButton")) {
          $("#Details").hide()
        }
        if ($(this).hasClass("popupCloseButtonSmall")) {
          $("#PickupList").hide()
        }
        if ($(this).hasClass("Print")) {
          root.loadsheet.show($("#Details").data("root")._TableCell)
        }
        if ($(this).is("a, a *")) {
          window.open($(this).attr("href"), "_blank")
        }
      }
    }
  }
  // On jQuery load...
  $(document).ready(function () {
    // For Mobile Click
    Events.init()
  })
  // -----------------------------------------------------------------------------------------------------------------------

      $(".MobileButton").mouseenter(_mouseOverEvent).mouseleave(_mouseOutEvent)
    },
