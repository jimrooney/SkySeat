<script>
  /*
    Will need to go back to Init.html and change all the other drop event handlers (and other event handlers too I guess)

    Maybe make Events.drop polymorphic?

*/
  var Events = {
    drop: function (event, ui) {
      // $(this) : The cell dropped onto (same as event.target)
      let $root = $(this).closest(".root") // jQuery root
      let root = $root.data("root") // JavaScript root
      let dragged = ui.draggable // ui.draggable : The dropped sprite

      console.log("Drop ID: %o", $(this).prop("id"))
      console.log("Dragged: %o", dragged)
      console.log("Dragged ID: %o", dragged.prop("id"))
      console.log("Dragged Classname: %o", dragged.attr("class"))
      console.log("Dragged Booking: %o", Bookings.getBooking(dragged.prop("id")))

      $(".TableCell").css("background","blue")
      //ui.draggable.empty()// clears manifest icon
      $(this).addClass("ui-state-highlight")
      //
      // Save State
      //
      root.data.add($(this), dragged)
      console.log("State: %", root.data.state)
    },
  }
</script>
