<script>
  /*
    Will need to go back to Init.html and change all the other drop event handlers (and other event handlers too I guess)

    Maybe make Events.drop polymorphic?

*/
  var Events = {
    drop: function (event, ui) {
      // $(this) : The cell dropped onto (same as event.target)
      let $root = $(this).closest(".root") // jQuery root
      let root = $root.data("root") // JavaScript root
      let dragged = ui.draggable // ui.draggable : The dropped sprite

      console.log("Drop ID: %o", $(this).prop("id"))
      console.log("Dragged: %o", dragged)
      console.log("Dragged ID: %o", dragged.prop("id"))
      console.log("Dragged Classname: %o", dragged.attr("class"))

      //$(".TableCell").css("background", "blue")
      //ui.draggable.empty()// clears manifest icon
      //$(this).addClass("ui-state-highlight")

      //
      // Save State
      //
      root.data.add($(this), dragged) // This is the magic //
      console.log("State: %", root.data.state)
      Events.update($(this))
    },
    update: function (tableCell) {
      let $root = tableCell.closest(".root") // Board jQuery root
      let root = $root.data("root") // Board JavaScript root (lives in the jQuery.data("root"))
      let bookingData = root.data.get(tableCell) // Get the cell's data ([Board].data[row][col])

      // Temp
      let inOut = "in"
      // *****************************************************************
      let orderNumber = bookingData // just one order for now... will be more later, possibly an object... at least an array.
      // *****************************************************************
      let c = "yellow" // colors.getByRow(_bookings[bk].IN)
      let clrs = {
        bkin: "#E5E7E9",
        bkout: "#CCD1D1",
      }

      //if (type == "in") {
      tableCell.addClass("inCell")
      let bkg = "linear-gradient(-110deg, " + c + " 20%, " + clrs.bkin + " 20%)"
      tableCell.css("background-image", bkg)
      let direction = "<span class='inMarker'><div>" + inOut + "</div><div>&#8595;</div></span> " // IN
      //}
      // tmp
      let seats = 5
      seats =
        '<span style="font-weight:bold; float: left; display: block;padding-right:5px;padding-left:2px"> ' +
        seats +
        "</span>"
      let orderSpan = '<span style="float: left;display: block;">' + orderNumber + "</span>"

      let htmlString = direction + seats + orderSpan
      tableCell.html(htmlString)


    },
  }
</script>
