  var Events = {
    highlight: function (Selector) {
      Selector.addClass("highlight")
    },
    lowlight: function (Selector) {
      Selector.removeClass("highlight")
    },
    drop: function (event, ui) {
      // $(this) : The cell dropped onto (same as event.target)
      // console.log ("Booking: %o",booking)
      // console.log("Drop ID: %o", $(this).prop("id"))
      // console.log("Dragged: %o", dragged)
      // console.log("Dragged ID: %o", dragged.prop("id"))
      // console.log("Dragged Classname: %o", dragged.attr("class"))

      // ***********************************************************************************
      // We'll need to handle drops from other boards here
      // ***********************************************************************************
      //
      // First thing's first: is it a legal drop (in/out)
      // Other than that, I don't know that there's much that needs to happen on a drop... probably check the outcell too maybe? *******************
      //

      let $Board = $(this).closest(".root") // jQuery root
      let board = $Board.data("root") // JavaScript root
      let dragged = ui.draggable // ui.draggable : The dropped sprite

      let manifest = board.manifest
      // get a reference to the Booking from this board's Manifest
      let booking = manifest.getBooking(dragged.prop("id"))

      // -------------------------------------------------------------------
      // Record Drop
      // -------------------------------------------------------------------
      board.data.add($(this), dragged) // This is the magic // This adds the data to the State object (two dimensional array that mirrors the Board)
      console.log("State: %", board.data.state)
      Events.update($(this))
    },
    // ---------------------------
    // Updates a single Table Cell
    // ---------------------------
    update: function (tableCell) {
      let $Board = tableCell.closest(".root") // Board jQuery root
      let board = $Board.data("root") // Board JavaScript root (lives in the jQuery.data("root"))
      let bookingList = board.data.get(tableCell) // Get the cell's data ([Board].data[row][col])

      console.log("Booking Data: %o", bookingList)

      // ***** Wrap this into a function that figures out what the cell's contents should be *****
      // Object for the TableCell's contents to be setup by looping over all the bookings and figuring things out.
      let content = {
        color: {
          marker: "#E5E7E9",
          main: "#CCD1D1",
        },
        direction: {
          label: "in",
          class: "inCell",
        },
        seats: 0,
        PAXOB: 0,
        infants: 0,
        text: "Text",
      }

      // ************************* We'll need to total all the product information, not just the product code ****************************
      let productCode = {}
      for (let b in bookingList) {
        let booking = board.manifest.getBooking(bookingList[b])
        console.log("Booking: %o", booking)
        let c = booking.productCode.GYACode || "NoCode"
        productCode[c]=c
        switch (booking.flight.trip.direction) {
          case "out":
            content.direction.lable = "out"
            content.direction.class = "outCell"
            break
        }
        content.seats += booking.seats
      }
      // Stack multiple products
      let keys = Object.keys(productCode)
      let divList = keys.map(item => $("<div />").append(item))
      content.text = $("<div />").append(divList)


      
      // *****************************************************************
      let orderNumber = bookingList // just one order for now... will be more later, possibly an object... at least an array.
      // *****************************************************************
      tableCell.empty()
      tableCell.html(content.text)
      tableCell.css("background", content.color.main)
      tableCell.css("position", "relative")
      // diagonal tag
      // This floats obove the cell (picture frame style)
      let $span = $("<span/>")
        .addClass(content.direction.class)
        .css("--background-color", "transparent")
        .css("--chevron-color", content.color.marker)
      $span.append($("<span style='float:right;'/>").text(content.direction.label))
      tableCell.append($span)
