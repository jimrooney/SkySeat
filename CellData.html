<script>
  class CellData {
    constructor(cellID) {
      this.cellID = cellID
      this.bookingOrders = []
    }
    add(booking) {
      // Perhaps an object instead of key (more flexible for later)
      // console.log("[CellData].add(%o)",booking)
      let orderNumber = booking.orderNumber
      let product = booking.item.productCode
      let key = orderNumber + "_" + product
      if (!!key && !this.bookingOrders.includes(key)){
        this.bookingOrders.push(key)
      }
    }
  }
</script>
