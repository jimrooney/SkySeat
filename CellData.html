      this.bookingOrders = []

    addOrder(booking) {
      console.log("CellData addOrder: %o",booking)
      let orderNumber = booking.orderNumber
      let product = booking.itemNumber
      let key = orderNumber + "_" + product
      if (!!key && !this.bookingOrders.includes(key)){
        this.bookingOrders.push(key)
      }
      return true
    }
    removeOrder(booking){

      leg: "A"
      */

      // return the remaining length of the bookingOrders array... for now, it's 0 cuz we've cleared it.
      return this.bookingOrders.length
    }
  }
</script>
