<script>
  /*
The bookings object holds all the bookings loaded in from rezdy (or other booking service)
We keep them in a master array, bookings, and have accessors to manipulate them in place.

This object can handle all of the error checking (like null checking)
*/
  var Bookings = {
    list: [],
    add: function (list) {
      this.list = $.merge(list, this.list)
    },
    getManifest: function (date) {
      console.log("Bookings.getManifest(%o)",date)
      let manifest = {}
      if (!!date && date.match(/\d\d.\d\d.*/gi)) {
        // Checkvalve... date is sane
      } else {
        console.log("Booking.getManifest() error... bad date: %o", date)
        // ***************************************************************
        // if no date, maybe assume the date from the "today" date picker?
        // for now, we'll just return
        return
      }
      for (let a in this.list) {
        if (!!this.list[a] && this.list[a].flight) {
          if (this.list[a].flight.date == date) {
            manifest[this.list[a].orderNumber] = this.list[a]
          }
        }
      }
      return manifest
    },
    getBooking: function (orderNumber) {
      if (!!orderNumber) {
        for (let a in this.list) {
          if (this.list[a].orderNumber == orderNumber) {
            return this.list[a]
          }
        }
      }
      return null
    },
    getBookings: function (date) {
      let b = []
      //
      // If a date was passed in
      //
      if (!!date && date.match(/\d\d.\d\d.*/gi)) {
        for (let a in this.list) {
          if (this.list[a].orderNumber == orderNumber) {
            return this.list[a]
          }
        }
      }
      return b
    },
  }
</script>
