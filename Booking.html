    get leg() {

    getDirection() {
      let type = this.product.FlightType
      return type.match(/^B/i) ? "B" : "A"
    }
    isOut() {
      return this.getDirection() == "B" ? true : false

    getTripTimes(TableCell) {

    }

    // -----------

    getSprite() {
      let $sprite = $("<div class='BookingSprite' />")
      .addClass(this.orderNumber)

      $sprite.data("this", this) // Self Reference (for click)
      $sprite.data("script", this)
      $sprite.data("_script", this)
      $sprite.prop("id", this.orderNumber)
      //
      // Attach this object to the sprite
      //
      let hue = colors.getByTime(this.getStartHour())
      let cHue = "hsl(" + hue + ", 50%, 75%)"

      $sprite.css("background-color", cHue)
      const xmlLink = "<span class='Dev'><A href='https://api.rezdy.com/v1/bookings/"  + this.orderNumber + "?apiKey=4a02ae91ede241fd80324ec8b2ac57cb" + "' target='_blank'>(xml)</A></span>"
      const link = `<A class="${this.orderNumber} ManifestLink" href="https://app.rezdy.com/orders/edit/${this.orderNumber}" target="_blank"> ${this.orderNumber}</a>`

      $sprite.append($(`<div>${this.passengers.length}X ${this.product.GYACode} ${this.order.customer.firstName} ${this.order.customer.lastName} ${xmlLink} ${link}</div>`))


      //$sprite.text(this.getSeats() + " " + this.product.GYACode)
      //
      // Click
      //
      $sprite.click(function () {
        $(".FloatingBox").remove()
        let _this = $sprite.data("this")
        _this.show() // inherited function from Plottable
        const $FBox = $("<div />", {
            class: "FloatingBox",
          })
          const paxList = _this.getPax()
          let orderNumber = ""
          if (!!paxList) {
            const _acc = []
            paxList.forEach((pax) => {
              _acc.push(`${pax.fullName} (${pax.weight.declared})`)
              $("." + pax.orderNumber).addClass("highlight")
              orderNumber = pax.orderNumber
            })
            $FBox.html(_acc.join("<br>"))
            $FBox.prepend("<A id='" + orderNumber + "_rezdyLink' href='https://app.rezdy.com/orders/edit/"+orderNumber+"' target='_blank'>"+orderNumber+"</a><br>")
            _this.board.manifest.$this.append($FBox)
          }
          
      })
      $sprite.hover(
        // On
        function () {
          let _this = $sprite.data("this")
          let $row = time.getRowByHour(_this.getStartHour())
          if ($row) {
            $(".Row_" + $row.data("row")).addClass("highlight")
          }
        },
        // Off
        function () {
          let _this = $sprite.data("this")
          let $row = time.getRowByHour(_this.getStartHour())
          if ($row) {
            $(".Row_" + $row.data("row")).removeClass("highlight")
            $sprite.removeClass("highlight")
          }
        }
      )
      return $sprite
    }
