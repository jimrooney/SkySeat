<script>
  class Booking {
    constructor(RezdyOrder, count) {
      //
      this.order = RezdyOrder // keep a reference to the Rezdy Data. The Rezdy Order contains all the Bookings when there's multiple bookings per client.
      this.booking = this.order.items[count] // Rezdy "Items" are a list of Bookings. We split them, so we keep a reference to which array index this one is.
      this.productCode = gya.getCode(this.booking.productCode)
      this.orderNumber = this.order.orderNumber
      this.flight = {
        trip: {
          ETD: this.booking.startTimeLocal,
          ETA: "",
          ETE: "",
          direction: this.getDirection(),
        },
        people: {
          POB: this.getPOB(),
          PAX: this.getPax(),
          crew: this.getCrew(),
        },
        seats: this.getSeats(),
        color: this.getColor(),
      }
    }
    getDirection() {
      let type = this.productCode["FlightType"].toUpperCase() || null
      if (!!type){
        return type.match(/^B/) ? "out" : "in"
      }
      return null
    }
    getETD() {
      // Time when the plane leaves
      this.booking.startTime
      return this.booking.startTimeLocal
    }
    getColor() {
      return colors.getByTime(time.getHour(this.getETD()))
    }
    getCrew() {}
    getPax() {
      // Eventually, this will sort out participants vs ACI vs Quantities and figure out the actual pax. *****************************
      // Probably want to return an object with pax data
      return this.booking.quantities.length
    }
    getSeats() {
      // return a raw number of seats this booking will occupy ***********************************
      return this.booking.quantities.length
    }
    getPOB() {
      // Number of souls on board (includes crew and infants) **************************************
      return this.booking.quantities.length
    }
    getPaxOB() {
      // Number of sould on board excluding staff (includes infants)
    }
    getProductCode() {
      return gya.getCode(this.booking.productCode) // row from TripCodes spreadsheet ***** GYA object *****
    }
    getSprite() {
      // Constructs and returns a booking sprite
      let $details = $("<span class='tooltip' />")
      if (!!this.orderNumber) {
        let masterkey = this.orderNumber.split("-")[0]
        // "2FCF" coded sprite
        $details.addClass("BookingSprite")
        $details.prop("id", this.orderNumber)
        $details.css("background-color", this.flight.color)
        $details.text(this.flight.seats + " " + this.productCode.GYACode)
      }
      return $details
    }
  }
</script>
