  getManifest: function(row){
    //
    // Get the row's manifest. If no row is passed in, return a full day manifest
    //
      let manifest = {
        trip:{
          time:  null,
        },
        pax:{
          total:0,
          bookings:[],
        },
        onGround:{
          // List of product codes that we're tracking people on the ground .. needs a better system ***********
          products:[
            "PR115C",
            "P03UKW",
            "PX31V0",
            "PYML6Y",
            "P3BW7J",
            "PWHCSM"
          ],
          Milford:[],
          MtCook:[],
          bootsOnGround: function(code){
            for (let c in manifest.onGround.products){
              if (manifest.onGround.products[c] == code){
                return true
              }
            }
            return false
          },
        },
        pickups:{
          total:0,
          stops:[],
        },
        nonPickups:{
          SelfDrive:[],
          GlenorchyAirstrip:[],
        },
      }
    if(!!row){
      //
      manifest.trip.time = $(".TimeCell."+row).text()
      //
      // Each column in the row
      //
      $("."+row).each(function(){
            let JSON = $(this).data('json')
            if ( !jQuery.isEmptyObject(JSON) ){
              //
              // Each booking in the column
              //
              for(let b in JSON){
                let booking = JSON[b]
                let pickup = true
                let pickupLocation = ""
                //
                if (booking.pickupLocation){
                  if (booking.pickupLocation.locationName){
                    pickupLocation = booking.pickupLocation.locationName
                    //
                    if (booking.product && booking.product.match(/out/ig)){
                      pickupLocation = "Outs"
                    }
                    if(pickupLocation.match(/self drive/ig)){
                      manifest.nonPickups["SelfDrive"].push(booking)
                      pickup = false
                    }
                    else if(pickupLocation.match(/Glenorchy Airstrip/ig)){
                      manifest.nonPickups["GlenorchyAirstrip"].push(booking)
                      pickup = false
                    }
                  }
                  else {
                    pickupLocation = "Unspecified"
                  }
                  if (pickup){
                    manifest.pickups.stops.push(booking)
                    manifest.pickups.total += booking.pax.length
                  }
                  //
                  // Boots on ground
                  //
                  let code = booking.productCode[1]
                  if (manifest.onGround.bootsOnGround(code)){
                    manifest.onGround.Milford.push(booking)
                  }
                  //
                  // totals
                  //
                  manifest.pax.total += booking.pax.length
                  manifest.pax.bookings.push(booking)
                }
              }
            }
        }
      )
      return manifest
    } else {
      console.log("No Row, return full manifest")
      let ret = []
      $(".PickupCell").each(function(){
        let _o = theBoard.getManifest($(this).prop('id'))
        ret.push(_o)
      })
      return ret
    }

  save: function(){
    $("#SaveButton").css({"background": "green",})
    setTimeout(function(){ $("#SaveButton").css({"background": "blue",}) }, 2000)
    let data = {}
    //
    // Loop over all the table cells
    //
    $(".TableCell").each(function(index) {
        let json = $(this).data('json')
        if (typeof json != "undefined" && !jQuery.isEmptyObject(json)) {
             for (let j in json){
               for (let key in json[j]){
                 if (key == "pickupLocation"){
                   if (json[j][key].pickupInstructions){
                     delete json[j][key].pickupInstructions
                   }
                   if (json[j][key].address){
                     delete json[j][key].address
                   }
                 }
                 if(key == "internalNotes"){
                   delete json[j][key]
                 }
                 if(key == "pickupInstructions"){
                   delete json[j][key]
                 }
                 if(key == "pax"){
                   for (let p in json[j][key]){
                     let pax = json[j][key][p]
                     if (pax.pickupLocation && pax.pickupLocation.address){
                       delete pax.pickupLocation.address
                     }
                     if (pax.pickupLocation && pax.pickupLocation.pickupInstructions){
                       delete pax.pickupLocation.pickupInstructions
                     }
                   }
                 }
               }
             }
            // push each booking into data hash
            if (!jQuery.isEmptyObject(json)){
              data[$(this).attr("id")] = json
            }
        }
    });
    $(".PlaneCell").each(function(index) {
        let json = $(this).data('PCF')
        if (typeof json != "undefined" && !jQuery.isEmptyObject(json)) {
            // push each booking into data hash
            if (!jQuery.isEmptyObject(json)){
              data[$(this).attr("id")] = json
            }
        }
    });
    //
    // Save
    //
    let dataArry = []
    
    let s1 = {}
    let s2 = {}
    let s3 = {}
    let s4 = {}
    let count = 0
    for (let a in data){
      if (count<10){
        s1[a] = data[a]
        count++
      } else {
        if (count<15){
          s2[a] = data[a]
                  count++
        } else {
          if (count<20){
            s3[a] = data[a]
                    count++
          } else {
            s4[a] = data[a]
                    count++
          }
        }
      }
    }
    let date = Dates.getNZ($("#datepicker").datepicker('getDate'))
    //
    // Split data up so as not to overload Google's 50K cell limit ***************** 
    //
    dataArry.push(date)
    dataArry.push(JSON.stringify(s1))
    dataArry.push(JSON.stringify(s2))
    dataArry.push(JSON.stringify(s3))
    dataArry.push(JSON.stringify(s4))
    google.script.run.withSuccessHandler(theBoard.timeStamp.saveLocal).saveBoard( dataArry )
  },

    let num = 1

    let dd = $picker.datepicker('getDate')
    dd=dd.addDays(num)
    let newDate = Dates.getNZ(dd)
    //
    // Load Board
    //
    this.load(newDate,$picker)
    //
    // Reload Manifest
    //
    if(rzdy){Rezdy.load(newDate)}
    //
    // Update Picker
    //
    $picker.datepicker('setDate', dd)

  //
  // Get the row by class
  // if getClass = true, return row class
  //
  getRow:function(_this,getClass){
    let classes = _this.prop("classList")
    let row
    let rowClass
    for(let c in classes){
      let isString = (typeof classes[c] == 'string') ? true:false
      if (isString){
          let r = classes[c].match(/Row_\d.*/)
          if(!!r&&!!r[0]){
            rowClass = r[0]
            row = r[0].split("_")[1]
            break // Because Classes also list all the classes as a single string... which will match()
        }
      }
    }
    if(getClass){row=rowClass}
    return row
  },
  getColumn:function(id){
    // placeholder function for this workaround *************************************
    let _array = id.split('')
    let col=_array[1]
    if (id.length>2){
      col = _array[0] +""+ _array[1]
    }
    return col
  },
  getCol:function(_this,getClass){
    let classes = _this.prop("classList")
    let col
    let colClass
    for(let c in classes){
      let isString = (typeof classes[c] == 'string') ? true:false
      if (isString){
          let r = classes[c].match(/Col_\d.*/)
          if(!!r&&!!r[0]){
          colClass = r[0]
          col = r[0].split("_")[1]
          break // Because Classes also list all the classes as a single string... which will match()
        }
      }
    }
    if(getClass){col=colClass}
    return col
  },
  highlightFerryLegs:function(){
    let last = ""
    //
    // Clear old Ferry Leg text
    //
    $(".TableCell").each(function() {
      if ($(this).html().match(/ferry/ig)){
        $(this).html("")
      }
    })
    // Each Row in Each Column (use PlaneCell array to loop over columns)
    //
    // Each Column
    //
    $(".PlaneCell").each(function(_col) {
    //
    // Each Row
    //
      $(".Col_"+_col).each(function(_row){
        if( _row == 0) {
          last = "out" // Reset the top of every Column to "out" by default (so it always assumes the plane starts in QT)
        }
        let _type = $(this).data("type")
        if (_type){
          if (_type == "in" && last == "in"){
              let ferryRowNum = _row -2
              let ferryRow = $("#" + ferryRowNum + _col)
              
              if ( ferryRow.data("type") == null ){
                ferryRow.html("<span style='color:#c9735d;'>Ferry Out</span>")
              }
              
          }
          if (_type == "out" && last != "in"){
              let ferryRowNum = _row -2
              let ferryRow = $("#" + ferryRowNum + _col)
              
              if ( ferryRow.data("type") == null ){
                ferryRow.html("<span style='color:#c9735d;'>Ferry In</span>")
              }
            }
          last = _type
        }
      })
    })
  }

}
</script>
