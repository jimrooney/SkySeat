<script>
  class Pax {
    constructor(data) {
      if (!!data.fields) {
        this.fields = data.fields || ""
      } else {
        this.fields = data
      }
      this.fullName = this.firstName + " " + this.lastName
      this.actualWeight = false
    }
    //
    // Getter/Setter Utility functions
    //
    setLabel(label, value) {
      const rgxp = new RegExp(label, "i")
      let result = this.fields.find((x) => x.label.match(rgxp))
      if (!!result) {
        result.value = value
      } else {
        this.fields.push({ label: label, value: value })
      }
    }
    // better naming for getValue... using wrapper so as not to break it getValue
    getValue(label) {
      return this.getLabel(label)
    }
    getLabel(label) {
      const rgxp = new RegExp(label, "i")
      const result = this.fields.find((x) => x.label.match(rgxp))
      if (!!result && !!result.value) {
        return result.value
      }
      return
    }
    removeValue(label) {
      const rgxp = new RegExp(label, "i")
      const result = this.fields.findIndex((x) => x.label.match(rgxp))
      if (!!result) {
        delete this.fields[result]
      }
    }
    // ==============================================
    // Getters/Setters
    // ==============================================
    get item() {
      return root.getItem(this.barcode)
    }
    set item(value) {
      this.item = value // Placeholder
    }
    get seat() {
      return this.getValue("seat")
    }
    set seat(seatNum) {
      this.setLabel("seat", seatNum)
      //
      // also change the field here? ************************
      //
    }
    get firstName() {
      return this.getValue("First Name")
    }
    set firstName(name) {
      this.setLabel("First Name", name)
    }
    get lastName() {
      return this.getValue("Last Name")
    }
    set lastName(name) {
      this.setLabel("Last Name", name)
    }
    get barcode() {
      let code = this.getValue("Barcode")
      if (!code) {
        code = `${this.orderNumber || ""}*${this.firstName}_${this.lastName}`
        this.fields.push({ label: "Barcode", value: code })
      }
      return code
    }
    set barcode(Barcode) {
      if (!this.barcode) {
        this.fields.push({ label: "Barcode", value: Barcode })
        return
      }
      this.setLabel("Barcode", Barcode)
    }
    get orderNumber() {
      return this.getValue("orderNumber")
    }
    set orderNumber(orderNumber) {
      this.setLabel("orderNumber", orderNumber)
    }
    get weight() {
      //
      // Maybe a good place to add standard weights and standard weight addition (4kg)
      //
      const actualWeight = this.getValue("Actual Weight")
      let result = this.getValue("Passenger weight")
      // Always return KG...
      // Removes KG LBS etc
      if (!!result) {
        result = wb.getKilos(result)
      }
      // Child standard weight
      const regex = /Child/g
      let standard = 0
      const childAge = this.fields.reduce((accumulator, field) => {
        let age = 0
        if (field.label.match(regex)) {
          if (field.value.match(/m/gi)) {
            age = 0.1
          } else {
            age = parseInt(field.value)
          }
        }
        return accumulator + age
      }, 0)
      if (!!childAge && childAge > .1) {
        standard = root.standard.weight.child
      } else {
        standard = root.standard.weight.adult
      }
      // If infant, add standard infant weight to adult
      if (!!childAge && childAge === 0.1) {
        standard = root.standard.weight.adult + root.standard.weight.infant
      }
      //
      result = parseInt(result) || "tbc"
      return { declared: result, actual: actualWeight, standard: standard }
    }
    set weight(weight) {
      if (!!weight.actual) {
        this.setLabel("Actual Weight", weight.actual)
      } else {
        this.setLabel("Passenger weight", weight)
      }
    }
    get times() {
      const time = {
        start: {
          string: this.item.startTimeLocal,
          hour: root.time.getHour(this.item.startTimeLocal),
          time: this.item.startTime,
        },
        stop: {
          string: this.item.endTimeLocal,
          hour: root.time.getHour(this.item.endTimeLocal),
          time: this.item.endTime,
        },
        get duration() {
          const a = new Date(this.start.time)
          const b = new Date(this.stop.time)
          const diff = new Date(b - a)
          const d = Math.floor((b - a) / 36e5) // 36e5 scientific notation for 3600000
          let ret

          if (d < 1) {
            ret = 0
          }
          if (d == 1) {
            ret = 1
          }
          if (d > 1) {
            ret = d - 1
          }

          return ret
        },
        set duration(value) {
          // placeholder
          this.duration = value
        },
      }
      return time
    }
    set times(value) {
      this.times = value // placeholder
    }
    getGroupColor() {
      Color.getByBooking()
    }
    removeSeat() {
      this.fields = this.fields.filter((x) => x.label != "seat")
      return this
    }
    setSeat(number) {
      this.removeSeat()
      const thisSeat = {
        label: "seat",
        value: number,
      }
      this.fields.push(thisSeat)
      return this
    }
  }
</script>
