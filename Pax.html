<script>
  class Pax {
    constructor(data) {
      // console.log("New Pax: %o",data)
      if (!!data.fields) {
        this.fields = data.fields || ""
      } else {
        this.fields = data
      }
      this.seat = data.seat || null
      this.barcode = this.getBarcode()
      this.orderNumber = this.getOrderNumber()
    }
    setSeat(number) {}
    getOrderNumber() {
      let ret = this.barcode || ""
      ret = ret.split("*")[0]
      return ret
    }
    getBarcode() {
      let ret = this.fields[2].value || ""
      return ret
    }
    getName() {
      let _name = ""
      let FN = this.fields[0].value || ""
      let LN = this.fields[1].value || ""
      _name = FN + " " + LN
      return _name
    }
    getFirstName() {
      // let _name = ""
      // if (!!this.fields[0]) {
      //   _name = this.fields[0].value
      // }

      let ret = this.fields.find((x) => x.label.match(/First\ Name/i))
      
      return ret.value
    }
    getWeight() {
      //
      // Maybe a good place to add standard weights and standard weight addition (4kg)
      //
      let ret = this.fields.find((x) => x.label.match(/weight/i))
      // Always return KG...
      // Removes KG LBS etc
      ret = wb.getKilos(ret.value)

      return ret
    }
    getAge() {
      let ret = this.fields[3].value || -1
      return ret
    }
    getGroupColor() {
      Color.getByBooking()
    }
  }
</script>
