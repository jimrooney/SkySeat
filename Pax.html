<script>
  class Pax {
    constructor(data) {
      if (!!data.fields) {
        this.fields = data.fields || ""
      } else {
        this.fields = data
      }
      this.fullName = this.firstName + " " + this.lastName
    }
    //
    // Getter/Setter Utility functions
    //
    setValue(label, value) {
      const rgxp = new RegExp(label, "i")
      let result = this.fields.find((x) => x.label.match(rgxp))
      result.value = value
    }
    getValue(label) {
      const rgxp = new RegExp(label, "i")
      const result = this.fields.find((x) => x.label.match(rgxp))
      if (!!result && !!result.value) {
        return result.value
      }
      return
    }
    //
    // Getters/Setters
    //
    get item() {
      return root.getItem(this.barcode)
    }
    set item(value) {
      this.item = value // Placeholder
    }
    get seat() {
      return this.getValue("seat")
    }
    set seat(seatNum) {
      this.setValue("seat", seatNum)
    }
    get firstName() {
      return this.getValue("First Name")
    }
    set firstName(name) {
      this.setValue("First Name", name)
    }
    get lastName() {
      return this.getValue("Last Name")
    }
    set lastName(name) {
      this.setValue("Last Name", name)
    }
    get barcode() {
      let code = this.getValue("Barcode")
      if (!code){
        code = this.orderNumber + "*" + this.firstName + "_" + this.lastName
        this.fields.push({label:"Barcode", value: code})
      }
      return code
    }
    set barcode(Barcode) {
      this.setValue("Barcode", Barcode)
    }
    get orderNumber() {
      return this.getValue("orderNumber")
    }
    set orderNumber(orderNumber) {
      this.setValue("orderNumber", orderNumber)
    }
    get weight() {
      //
      // Maybe a good place to add standard weights and standard weight addition (4kg)
      //
      let result = this.getValue("weight")
      // Always return KG...
      // Removes KG LBS etc
      if (!!result && !!result.value) {
        result = wb.getKilos(result.value)
      }
      result = parseInt(result)
      return result
    }
    set weight(weight) {
      this.setValue("weight", weight)
    }
    get times() {
      const time = {
        start: {
          string: this.item.startTimeLocal,
          hour: root.time.getHour(this.item.startTimeLocal),
          time: this.item.startTime,
        },
        stop: {
          string: this.item.endTimeLocal,
          hour: root.time.getHour(this.item.endTimeLocal),
          time: this.item.endTime,
        },
        get duration() {
          const a = new Date(this.start.time)
          const b = new Date(this.stop.time)
          const diff = new Date(b - a)
          const d = Math.floor((b - a) / 36e5) // 36e5 scientific notation for 3600000
          let ret

          if ( d < 1){
            ret = 0
          }
          if (d == 1){
            ret = 1
          }
          if (d > 1){
            ret = d - 1
          }

          return ret 
        },
        set duration(value) {
          // placeholder
          this.duration = value
        },
      }
      return time
    }
    set times(value) {
      this.times = value // placeholder
    }
    getGroupColor() {
      Color.getByBooking()
    }
  }
</script>
