<script>
  class Pax {
    constructor(data) {
      if (!!data.fields) {
        this.fields = data.fields || ""
      } else {
        this.fields = data
      }
      this.seat = data.seat || null
      this.barcode = this.getValue("Barcode")
      this.orderNumber = this.getValue("orderNumber")
    }
    getValue(label){
      const rgxp = new RegExp(label, "i");
      return this.fields.find((x) => x.label.match(label)).value
    }
    getWeight() {
      //
      // Maybe a good place to add standard weights and standard weight addition (4kg)
      //
      let ret = this.fields.find((x) => x.label.match(/weight/i))
      // Always return KG...
      // Removes KG LBS etc
      ret = wb.getKilos(ret.value)

      return ret
    }
    getGroupColor() {
      Color.getByBooking()
    }
  }
</script>
