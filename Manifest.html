<script>
  class Manifest {
    constructor(Board) {
      let _this = this
      this.board = Board
      this.$board = Board.$board // Keep a link to the board jQuery object
      this.json // Placeholder for Rezdy Parsed Data
      this.$bookings // Placeholder
      this.$this // Placeholder
      this.bookings = [] // Placeholder
      //this.$Bookings = this.$board.find(".Bookings") // get the root jQuery object to put all the Booking Divs into
    }
    getDate() {
      return this.board.$datepicker.datepicker("getDate")
    }
    setDate(date) {
      this.board.$datepicker.datepicker("setDate", new Date(date))
      this.showTitle()
    }
    write() {
      //
      // Manifest Div
      //
      let _this = this // _this instead of this because this is the calling button right now.

      this.$this = $(`<div class="Manifest_Container NoPrint">
        <div>
          <div id="Header" class="Header">
          <div id="Title">Loading...</div>
          <span class="total" style="float:left;display: inline-block;"></span>
          <span style="float:right;display: inline-block;"><button id="rr">(R)</button></span>
          <span style="float:right;display: inline-block;"><button id="reload">&#10226;</button></span>
          <span style="float:right;display: inline-block;"><button id="debug">(M)</button></span>
          ${_this.board.$board.prop("id")} Manifest </div>
          <div id="Totals" />
          <div class="Bookings"></div>
          </div>
          <div class="Roster" >Roster</div>
      </div>
      `)
        .droppable({
          accept: ".BookingSprite, .TableCell",
          drop: this.handleDrop,
          //delay: 100, // Might not need this now *******************
        })
        .data("_script", _this) // Backreference to JS from jQuery object

      // this.$roster = $(``)
      // this.$board.append(this.$roster)
      this.$roster = this.$this.find(".Roster")

      this.$board.append(this.$this)
      this.$bookings = this.$this.find(".Bookings")
      //
      // Manifest Reload Button
      //
      this.$this.find("#rr").click(function () {
        _this.loadRoster()
      })
      this.$this.find("#reload").click(function () {
        _this.load()
      })
      this.$this.find("#debug").click(function () {
        debug.log(_this)
      })

      //
      // Show State Button
      //
      let _board = this.board

      const $_save = $("<button class='Dark Debug' />").html("Save")
      this.$this.prepend($_save)
      $_save.on("click", function () {
        _board.state.save()
      })
      const $_load = $("<button class='Dark Debug' />").html("Load")
      this.$this.prepend($_load)
      $_load.on("click", function () {
        _board.state.load()
      })

      let $_s = $("<button class='Dark Debug'>").text("State")
      this.$this.prepend($_s)
      $_s.on("click", function () {
        console.log("{state}.getState(): %o", _board.state.getState())
      })

      let $_r = $("<button class='Dark Debug'>").append("<BR>").text("R")
      this.$this.prepend($_r)
      $_r.on("click", function () {
        $(".Roster").toggle()
      })
      let $_msg = $("<div class='FloatingBox' />")
      $_msg.on("click", function () {
        //
      })
    }
    //
    // Handlers for removing bookings/pax (used to be the Trash object)
    //
    handleDrop(event, ui) {
      const _this = $(this).data("_script") // This JS Object
      // ignore blank drops
      const pax = ui.draggable.data("_script").getPax()
      if (!!pax) {
        // Plottable
        _this.removePax(pax)
        _this.board.update()
      }
    }
    removePax(pax) {
      root.boards.forEach((board) => {
        board.state.clearoutPax(pax)
      })
    }
    showTitle() {
      this.$this
        .find("#Title")
        .html(this.getDate().toLocaleString("en-us", { weekday: "long" }))
    }
    loadRoster() {
      const $roster = this.$roster
      $roster.empty()
      $roster.append("<div>Loading</div>")
      const d = this.getDate("getDate")
      const date = d.toString()
      google.script.run
        .withSuccessHandler(this.handleRosterLoad)
        .withUserObject(this)
        .loadRoster(date)
    }
    handleRosterLoad(args, manifest) {
      const $roster = manifest.$this.find(".Roster")
      $roster.empty()
      if (!!args) {
        let labels = args.values.map((row) => row[0])
        let results = args.values.map((row) => row[args.ci])
        let keyVal = args.values.map((row, ri) => {
          const key = row[0]
          const val = row[args.ci]
          const color = args.colors[ri][args.ci]
          return [key, val, color]
        })
        const rosterRows = keyVal.map(
          (row) =>
            `<div><span style="background-color:${row[2]}">${row[0]} ${row[1]}</span></div>`
        )
        const $rosterContent = $("<div />")
        $rosterContent.append(rosterRows.join(""))
        $roster.append($rosterContent)
      }
    }
    // Call the Google Rezdy loading script, passing this object so the results can be returned into it
    load() {
      Rezdy.load(this)
    }
    onLoad(json) {
      this.data = JSON.parse(json) // parse json String data into a json object
      // to Rezdy, a "booking" is a "booking order" (cuz they couldn't decide which name they preferred)
      this.orders = this.processOrders(this.data.bookings) // [{Booking},{Booking},{Booking}] An array of booking objects
      this.$bookings.empty()
      this.show()
      this.loadRoster() // auto load the roster too.
      $(".Roster").hide()
    }
    processOrders(orders){
      // Copy down some Rezdy data to Pax fields (location isn't attached to Pax for example)
      orders.map((o) => {
        const orderNumber = o.orderNumber
        o.items = o.items.map((item, index) => {
          item.index = index
          const pickupLocation = item.pickupLocation
          item.participants = item.participants.map((pax, i) => {
            const groupKey = `${orderNumber}_${index}`
            const paxKey = `${groupKey}_${i}`
            pax.fields.push({ label: "itemIndex", value: index })
            pax.fields.push({ label: "orderNumber", value: orderNumber })
            pax.fields.push({ label: "paxIndex", value: i })
            pax.fields.push({ label: "groupID", value: groupKey })
            pax.fields.push({ label: "productCode", value: item.productCode })
            pax.fields.push({ label: "key", value: paxKey })
            pax.fields.push({ label: "pickupLocation", value: pickupLocation })
            return pax
          })
          return item
        })
        return o
      })
      return orders
    }
    //
    // Get Manifest
    //
    getManifest(date = this.getDate()) {
      let orders = this.orders
      // Filter by Status
      orders = orders.filter(
        (order) =>
          order.status == "CONFIRMED" ||
          order.status == "PENDING_SUPPLIER" ||
          order.status == "ON_HOLD" ||
          order.status == "PENDING_CUSTOMER"
      )
      return this.filterByDate(orders, date) // Filter by Date
    }
    // ---------------------------------------------------------
    // Show Manifest
    // ---------------------------------------------------------
    show(date) {
      let filteredManifest = this.getManifest(date)
      //
      // Create Booking Objects
      //
      let bookings = []
      filteredManifest.forEach((order) => {
        order.items.forEach((item, i) => {
          bookings.push(new Booking(this, order, item, i))
        })
      })
      //
      // Sort Bookings by Start Time
      //
      bookings.sort((a, b) =>
        time.getHour(a.item.startTimeLocal) >
        time.getHour(b.item.startTimeLocal)
          ? 1
          : -1
      )
      //
      // Totals
      //
      let dayParticipants = bookings.reduce((total, booking) => {
        return total + booking.item.participants.length
      }, 0)

      let dayPax = this.countPax(bookings)

      // -------------------------------------------------------------------------------------------
      this.$this
        .find("#Totals")
        .text("Manifest Pax(" + dayParticipants + ")(" + dayPax + ") ")
      // -------------------------------------------------------------------------------------------
      //
      // Print Sprites
      //
      bookings.forEach((booking) => this.$bookings.append(booking.getSprite()))
      //
      // Update the board
      //
      this.board.state.load() // load saved data
      this.board.update()
      //
      console.log("Bookings: ", bookings)
      const pickupList = this.getPickupList({ bookings: bookings })
      console.log("pickupList: ", pickupList)
      this.bookings = bookings
    }
    //
    // Need to split out via pickup time (and dropoff) ***
    // Need to filter GY Airstrip
    //
    getPickupList({ bookings, date, row }) {
      bookings = !!bookings ? bookings : this.bookings
      const pickupList = {
        totalPax: 0,
        pickups: [],
        selfDrives: [],
        locations: [],
        bookings: [],
      }
      let _row
      if (!!row) {
        _row = this.board.state.getRow(row)
      }
      _row?.forEach((cellData) => {
        cellData.passengers?.forEach((pax) => {
          const Pickup = pax.fields.find(
            (field) => field.label === "pickupLocation"
          )
          if (!!Pickup) {
            // pilots don't have pickup locations
            // Outs don't always have pickup locationNames
            const selfDrive =
              Pickup.value?.locationName.match(/Self Drive/) ||
              Pickup.value?.locationName.match(/Glenorchy/)
            if (!!selfDrive) {
              pickupList.selfDrives.push(pax)
            } else {
              pickupList.pickups.push(pax)
              pickupList.locations.push(Pickup.value)
              pickupList.locations = [...new Set(pickupList.locations)]
              pickupList.totalPax++
            }
          }
        })
      })

      // bookings.forEach((booking) => {
      //   let _row = time.getRowByTime(booking.item.startTimeLocal) // Change this to look at the State
      //   _row = _row.data("row")
      //   if (_row == row) {
      //     const selfDrive =
      //       booking.item.pickupLocation?.locationName.match(/Self Drive/)
      //     if (!!selfDrive) {
      //       pickupList.selfDrives.push(booking.item.participants)
      //     } else {
      //       pickupList.pickups.push(booking.item.participants)
      //       pickupList.locations.push(booking.item.pickupLocation)
      //       pickupList.totalPax += booking.item.participants.length
      //     }
      //   }
      // })
      return pickupList
    }
    countPax(arr) {
      return arr.reduce((total, booking) => {
        let s1 = booking.item.participants.length
        let s2 = booking.item.quantities.reduce((total, q) => {
          let hasACI
          !!q.optionLabel.match(/^Adult/)
            ? (hasACI = true)
            : !!q.optionLabel.match(/^Child/)
            ? (hasACI = true)
            : !!q.optionLabel.match(/^Infant/)
            ? (hasACI = true)
            : (hasACI = false)
          if (hasACI) {
            return total + parseInt(q.value)
          }
          return total
        }, 0)
        let ret = s1
        if (s1 < s2) {
          ret = s2
        }
        return total + ret
      }, 0)
    }
    countTripCost(arr) {
      return arr.reduce((total, order) => {
        return total + parseInt(order.totalAmount)
      }, 0)
    }
    // ------------
    // filter
    // ------------
    filterByDate(orders, date) {
      let _date = date
      return orders
        .filter((element) => {
          if (element.items) {
            return element.items.some((subElement) => {
              return (
                new Date(subElement.startTimeLocal).toDateString() ==
                _date.toDateString()
              )
            })
          }
        })
        .map((element) => {
          let newElt = Object.assign({}, element) // copies element
          newElt.items = newElt.items.filter((subElement) => {
            return (
              new Date(subElement.startTimeLocal).toDateString() ==
              _date.toDateString()
            )
          })
          return newElt
        })
    }
    filterByMonth(orders, date) {
      let month = date.getMonth()
      return orders
        .filter((element) =>
          element.items.some(
            (subElement) =>
              new Date(subElement.startTimeLocal).getMonth() == month
          )
        )
        .map((element) => {
          let newElt = Object.assign({}, element) // copies element
          newElt.items = newElt.items.filter(
            (subElement) =>
              new Date(subElement.startTimeLocal).getMonth() == month
          )
          return newElt
        })
    }
    // ------------
    // Get Orders
    // ------------
    //
    // Takes a list of booking numbers {GYA000881: "GYA000881", GYA000839: "GYA000839"}
    // And returns an array of Rezdy Orders (complete Order objects)
    //
    /*
      This will likely need some magic to handle split bookings ***********
    */
    getOrders(data) {
      //
      // returns an array of (rezdy) order objects
      //
      debug.log("Manifest.getOrders() data: %o", data) // array of order numbers
      // [ Recursive ]
      // If it's a CellData object, re-run with just the CellData.orders[] array
      if (!!data && typeof data == "object" && !!data.orders) {
        return this.getOrders(data.orders)
      }
      //
      // return the matching order objects
      //
      let Orders = []
      if (!!data && Array.isArray(data)) {
        // Loop over the orders and return the matching manifest object
        for (let b in data) {
          let _oNum = data[b].split("_")[0]
          Orders.push(this.orders.find((x) => x.orderNumber === _oNum))
        }
        return Orders
      }
      return
    }
    getBooking(pax) {
      //
      // return the matching booking (accepts Pax Object or an array of pax fields)
      //
      if (typeof pax != "object") {
        // if fields are passed in instead of {Pax}, convert to {Pax}
        pax = new Pax(pax)
      }
      return this.orders.filter((order) => order.orderNumber == pax.orderNumber)
    }
    getPax(barcode) {
      let ret
      if (!!this.orders) {
        this.orders.forEach((order) => {
          order.items.find((item) => {
            let found = item.participants.find((part) => {
              const px = new Pax(part.fields)
              if (px.barcode === barcode) {
                return part
              }
            })
            if (!!found) {
              ret = found
            }
          })
        })
      }
      return ret
    }
    getItem(barcode) {
      let ret
      if (!!this.orders) {
        this.orders.forEach((order) => {
          let found = order.items.find((item) =>
            item.participants.find((part) =>
              part.fields.find(
                (field) => field.label == "Barcode" && field.value == barcode
              )
            )
          )
          if (!!found) {
            ret = found
          }
        })
      }
      return ret
    }
    getOrder(orderNumber) {
      //
      // return the matching order objects
      //
      return this.orders.find((order) => order.orderNumber == orderNumber)
    }
    //
    // return total number of filled seats
    //
    getTotalPax() {
      let seats = 0
      $("#" + this.root.prop("id") + " .Manifest").each(function () {
        let json = $(this).data("json")
        for (let booking in json) {
          if (json[booking].orderNumber) {
            let book = json[booking].orderNumber.split("_")[0]
            if (json[booking].seats) {
              seats += json[booking].seats
            }
          }
        }
      })
      return seats
    }
  }
</script>
