<script>
  class Manifest {
    constructor(parent) {
      let _this = this
      this.board = parent
      this.$board = parent.$board // Keep a link to the board jQuery object
      this.json // Placeholder for Rezdy Parsed Data
      this.$bookings // Placeholder
      this.$this // Placeholder
      //this.$Bookings = this.$board.find(".Bookings") // get the root jQuery object to put all the Booking Divs into
    }
    getDate() {
      return this.board.$datepicker.datepicker("getDate")
    }
    write() {
      //
      // Manifest Div
      //
      let _this = this // _this instead of this because this is the calling button right now.

      this.$this = $(`<div class="Manifest_Container">
          <div id="Header" class="Header">
          <span class="total" style="float:left;display: inline-block;"></span>
          <span style="float:right;display: inline-block;"><button id="reload">&#10226;</button></span>
          <span style="float:right;display: inline-block;"><button id="debug">&#937;</button></span>
           Manifest </div>
          <div id="Totals" />
          <div class="Bookings" style="float:left;display: inline-block;"></div>
      </div>`)
      this.$board.append(this.$this)
      this.$bookings = this.$this.find(".Bookings")
      //
      // Manifest Reload Button
      //
      this.$this.find("button").off("click") // ? **********************************
      this.$this.find("#reload").click(function () {
        _this.load()
      })
      this.$this.find("#debug").click(function () {
        console.log(_this)
      })
    }
    // Call the Google Rezdy loading script, passing this object so the results can be returned into it
    load() {
      Rezdy.load(this)
    }
    onLoad(json) {
      console.log("Manifest onLoad()")
      this.data = JSON.parse(json) // parse json String data into a json object
      // to Rezdy, a "booking" is a "booking order" (cuz they couldn't decide which name they preferred)
      this.orders = this.data.bookings // [{Booking},{Booking},{Booking}] An array of booking objects
      this.$bookings.empty()
      this.show()
    }
    // ---------------------------------------------------------
    // Show Manifest
    // ---------------------------------------------------------
    show(date) {
      console.log("Manifest.show()")
      console.log("Requested Date: %o", date)
      console.log("JSON: (this.data) %o", this.data)
      if (!date) {
        date = this.getDate()
      }
      console.log("Date used: %o", date)
      //
      // Filter by CONFIRMED
      //
      let orders = this.orders.filter((order) => order.status == "CONFIRMED")
      console.log("All Confirmed Orders Returned From Rezdy\n%o", orders) // [{Booking},{Booking},{Booking}]

      // ------------------
      // Tag each passenger
      // ------------------
      //
      // This pulls down the OrderNumber and Array numbers 
      // so we can find the pax again in the Rezdy data structure from just the pax data
      //
      orders = orders.map((o) => {
        const orderNumber = o.orderNumber
        o.items = o.items.map((item, index) => {
          item.index = index
          item.participants = item.participants.map((pax,i) => {
            pax.fields.push({ label: "itemIndex", value: index })
            pax.fields.push({ label: "orderNumber", value: orderNumber })
            pax.fields.push({ label: "paxIndex", value: i })
            pax.fields.push({ label: "groupID", value: orderNumber + "_" + index })
            pax.fields.push({ label: "productCode", value: item.productCode })
            return pax
          })
          return item
        })
        return o
      })
      //
      // Filter by Date
      //
      let filteredManifest = this.filterByDate(orders, date)
      console.log("filteredManifest: %o", filteredManifest)
      //
      // Create Booking Objects
      //
      let bookings = []
      filteredManifest.forEach((order) => {
        order.items.forEach((item, i) => {
          bookings.push(new Booking(this, order, item, i))
        })
      })
      //
      // Sort Bookings by Start Time
      //
      bookings.sort((a, b) => (time.getHour(a.item.startTimeLocal) > time.getHour(b.item.startTimeLocal) ? 1 : -1))
      console.log("Sorted Bookings: %o", bookings)
      //
      // Totals
      //
      let dayParticipants = bookings.reduce((total, booking) => {
        return total + booking.item.participants.length
      }, 0)

      let dayPax = this.countPax(bookings)

      // -------------------------------------------------------------------------------------------
      // console.log("Month Total $%o", monthCost)
      this.$this.find("#Totals").text(
        "Manifest Pax(" + dayParticipants + ")(" + dayPax + ") "
        //"month(P" + monthParticipants + ")(X" + monthPax + ")"
      )
      // -------------------------------------------------------------------------------------------
      //
      // Print Sprites
      //
      bookings.forEach((booking) => this.$bookings.append(booking.getSprite()))
      //
      // Update the board
      //
      this.board.update()
    }
    countPax(arr) {
      return arr.reduce((total, booking) => {
        let s1 = booking.item.participants.length
        let s2 = booking.item.quantities.reduce((total, q) => {
          let hasACI
          !!q.optionLabel.match(/^Adult/)
            ? (hasACI = true)
            : !!q.optionLabel.match(/^Child/)
            ? (hasACI = true)
            : !!q.optionLabel.match(/^Infant/)
            ? (hasACI = true)
            : (hasACI = false)
          if (hasACI) {
            return total + parseInt(q.value)
          }
          return total
        }, 0)
        let ret = s1
        if (s1 < s2) {
          ret = s2
        }
        return total + ret
      }, 0)
    }
    countTripCost(arr) {
      return arr.reduce((total, order) => {
        return total + parseInt(order.totalAmount)
      }, 0)
    }
    // ------------
    // filter
    // ------------
    filterByDate(orders, date) {
      let _date = date
      return orders
        .filter((element) =>
          element.items.some((subElement) => {
            return new Date(subElement.startTimeLocal).toDateString() == _date.toDateString()
          })
        )
        .map((element) => {
          let newElt = Object.assign({}, element) // copies element
          newElt.items = newElt.items.filter((subElement) => {
            return new Date(subElement.startTimeLocal).toDateString() == _date.toDateString()
          })
          return newElt
        })
    }
    filterByMonth(orders, date) {
      let month = date.getMonth()
      return orders
        .filter((element) =>
          element.items.some((subElement) => new Date(subElement.startTimeLocal).getMonth() == month)
        )
        .map((element) => {
          let newElt = Object.assign({}, element) // copies element
          newElt.items = newElt.items.filter((subElement) => new Date(subElement.startTimeLocal).getMonth() == month)
          return newElt
        })
    }
    // ------------
    // Get Orders
    // ------------
    //
    // Takes a list of booking numbers {GYA000881: "GYA000881", GYA000839: "GYA000839"}
    // And returns an array of Rezdy Orders (complete Order objects)
    //
    /*
      This will likely need some magic to handle split bookings ***********
    */
    getOrders(data) {
      //
      // returns an array of (rezdy) order objects
      //
      console.log("Manifest.getOrders() data: %o", data) // array of order numbers
      // [ Recursive ]
      // If it's a CellData object, re-run with just the CellData.orders[] array
      if (!!data && typeof data == "object" && !!data.orders) {
        return this.getOrders(data.orders)
      }
      //
      // return the matching order objects
      //
      let Orders = []
      if (!!data && Array.isArray(data)) {
        // Loop over the orders and return the matching manifest object
        for (let b in data) {
          let _oNum = data[b].split("_")[0]
          Orders.push(this.orders.find((x) => x.orderNumber === _oNum))
        }
        return Orders
      }
      return
    }
    getOrder(orderNumber, productNumber) {
      //
      // return the matching order objects
      //
      let data = this.data.bookings
      let Orders = []
      if (!!data && Array.isArray(data)) {
        // Loop over the orders and return the matching manifest object
        for (let b in data) {
          let _oNum = data[b].split("_")[0]
          Orders.push(this.orders.find((x) => x.orderNumber === _oNum))
        }
        return Orders
      }
      return
    }
    //
    // return total number of filled seats
    //
    getTotalPax() {
      let seats = 0
      $("#" + this.root.prop("id") + " .Manifest").each(function () {
        let json = $(this).data("json")
        for (let booking in json) {
          if (json[booking].orderNumber) {
            let book = json[booking].orderNumber.split("_")[0]
            if (json[booking].seats) {
              seats += json[booking].seats
            }
          }
        }
      })
      return seats
    }
  }
</script>
