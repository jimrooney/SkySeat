<script>
  class Manifest {
    constructor($parent) {
      let _this = this
      this.json // Placeholder for Rezdy Parsed Data

      // **************************************
      // I think this is this.data.bookings now
      // **************************************
      this.bookings // Placeholder... List of Bookings... hash key'd (by orderNumber) from Rezdy load

      this.$bookings // Placeholder
      this.$parent = $parent // Keep a link to the parent jQuery object
      //this.$Bookings = this.$parent.find(".Bookings") // get the root jQuery object to put all the Booking Divs into
    }
    getDate() {
      let date = this.parent.$datepicker.datepicker("getDate")
      date = Dates.getNZ(date)
      return date
    }
    write() {
      //
      // Manifest Div
      //
      let _this = this // _this instead of this because this is the calling button right now.
      let _span = this.$parent.append(`<div class="Manifest_Container">
          <div class="Header">
          <span style="float:left;display: inline-block;"></span>
          <span style="float:right;display: inline-block;"><button id="reload">&#10226;</button></span>
          <span style="float:right;display: inline-block;"><button id="debug">&#937;</button></span>
           Manifest </div>
          <div class="Bookings" style="float:left;display: inline-block;"></div>
      </div>`)
      this.$bookings = this.$parent.find(".Bookings")
      //
      // Manifest Reload Button
      //
      _span.find("button").off("click")
      _span.find("#reload").click(function () {
        _this.load()
      })
      _span.find("#debug").click(function () {
        console.log(_this)
      })
    }
    // Call the Google Rezdy loading script, passing this object so the results can be returned into it
    load() {
      Rezdy.load(this)
    }
    onLoad(XML) {
      console.log("Manifest onLoad()")
      this.$parent.data.state
      this.data = JSON.parse(XML) // Store the Rezdy object so we can write them later.
      this.orders = this.data.bookings
      this.$bookings.empty()
      this.show()
    }
    show(date) {
      debug.log("Manifest.show(date)", date)
      if (!date) {
        date = this.getDate()
      }
      /* 

      Rezdy's list of "bookings" is actually a list of orders (each with an orderNumber).
      What Rezdy calls an "Item" (in the items array) is what is actually a booking (it's an order for a product)

      */
      // Need to filter by date as well **********************************
      let orders = this.orders.filter((order) => order.status == "CONFIRMED")
      console.log("orders %o", orders)
      //
      // Loop over bookings (Items) and print each booking div
      //
      for (let o in orders) {
        let orderNumber = orders[o].orderNumber
        for (let i in orders[o].items) {
          let booking = new Booking(orders[o].items[i], orderNumber)
          this.$bookings.append(booking.getSprite()) // Passing in the orderNumber.. this can be extracted from the barcode or all the items can be passed in... this is just for now ***********************
        }
      }

      init() // This should change *************** not be root variable, not be such a hatchet **********
    }
    // ------------
    // Get Orders
    // ------------
    //
    // Takes a list of booking numbers {GYA000881: "GYA000881", GYA000839: "GYA000839"}
    // And returns an array of Rezdy Orders (complete Order objects)
    //
    /* 
      This will likely need some magic to handle split bookings ***********
    */
    getOrders(data) {
      //
      // returns an array of (rezdy) order objects
      //
      console.log("Manifest.getOrders() data: %o", data) // array of order numbers
      // [ Recursive ]
      // If it's a CellData object, re-run with just the CellData.orders[] array
      if (!!data && typeof data == "object" && !!data.orders) {
        return this.getOrders(data.orders)
      }
      //
      // return the matching order objects
      //
      let Orders = []
      if (!!data && Array.isArray(data)) {
        // Loop over the orders and return the matching manifest object
        for (let b in data) {
          let _oNum = data[b].split("_")[0]
          Orders.push(this.orders.find((x) => x.orderNumber === _oNum))
        }
        return Orders
      }
      return
    }
    getOrder(orderNumber, productNumber) {
      //
      // return the matching order objects
      //
      let data = this.bookings
      let Orders = []
      if (!!data && Array.isArray(data)) {
        // Loop over the orders and return the matching manifest object
        for (let b in data) {
          let _oNum = data[b].split("_")[0]
          Orders.push(this.orders.find((x) => x.orderNumber === _oNum))
        }
        return Orders
      }
      return
    }
    //
    // Loop over each booking for a match
    //
    getBooking(orderNumber, productCode) {
      //
      // Add filterCodes (for things like status codes)? **********************************
      //
      // Search orders for a matching orderNumber and productCode
      //
      const result = this.data.bookings.find((order) => {
        let match = order.orderNumber === orderNumber
        if (match) {
          match = order.items.find( ({productCode}) => productCode === productCode )
        }
        return match
      })
      return result
    }
    //
    // return total number of filled seats
    //
    getTotalPax() {
      let seats = 0
      $("#" + this.root.prop("id") + " .Manifest").each(function () {
        let json = $(this).data("json")
        for (let booking in json) {
          if (json[booking].orderNumber) {
            let book = json[booking].orderNumber.split("_")[0]
            if (json[booking].seats) {
              seats += json[booking].seats
            }
          }
        }
      })
      return seats
    }
  }
</script>
