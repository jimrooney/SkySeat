<script>
  class Manifest {
    constructor($parent) {
      let _this = this
      this.json // Placeholder for Rezdy Parsed Data
      this.bookings // Placeholder... List of Bookings... hash key'd (by orderNumber) from Rezdy load
      this.$bookings // Placeholder
      this.$parent = $parent // Keep a link to the parent jQuery object
      //this.$Bookings = this.$parent.find(".Bookings") // get the root jQuery object to put all the Booking Divs into
    }
    getDate() {
      let date = this.parent.$datepicker.datepicker("getDate")
      date = Dates.getNZ(date)
      return date
    }
    write() {
      //
      // Manifest Div
      //
      let _span = this.$parent.append(`<div class="Manifest_Container">
          <div class="Header">
          <span style="float:left;display: inline-block;"></span>
          <span style="float:right;display: inline-block;"><button>&#10226;</button></span> Manifest </div>
          <div class="Bookings" style="float:left;display: inline-block;"></div>
      </div>`)
      this.$bookings = this.$parent.find(".Bookings")
      //
      // Manifest Reload Button
      //
      _span.find("button").off("click")
      _span.find("button").click(function () {
        // _this instead of this because this is the calling button right now.
        _this.load()
      })
    }
    // Call the Google Rezdy loading script, passing this object so the results can be returned into it
    load() {
      Rezdy.load(this)
    }
    onLoad(XML) {
      console.log("Manifest onLoad()")
      this.$parent.data.state
      this.data = JSON.parse(XML) // Store the Rezdy object so we can write them later.
      this.orders = this.data.bookings
      this.$bookings.empty()
      this.show()
    }
    show(date) {
      console.log("Manifest.show(%o)", date)
      if (!date) {
        date = this.getDate()
      }

      console.log("this.data %o", this.data)
      // Need to filter by date as well **********************************
      /* 

      Rezdy's list of "bookings" is actually a list of orders (each with an orderNumber).
      What Rezdy calls an "Item" (in the items array) is what is actually a booking (it's an order for a product)

      */
      let orders = this.orders.filter((order) => order.status == "CONFIRMED")
      console.log("orders %o", orders)

      //
      // Loop over bookings (Items) and print each booking div
      //
      for (let o in orders) {
        let orderNumber = orders[o].orderNumber
        for (let i in orders[o].items) {
          this.$bookings.append(this.getSprite(orders[o].items[i], orderNumber)) // Passing in the orderNumber.. this can be extracted from the barcode or all the items can be passed in... this is just for now ***********************
        }
      }

      init() // This should change *************** not be root variable, not be such a hatchet **********
    }

    getSprite(booking, orderNumber) {
      console.log("GetSprite: %o %o", booking, orderNumber)
      // Constructs and returns a booking sprite
      let $sprite = $("<span class='tooltip' />")
      if (!!orderNumber) {
        //
        $sprite.data("this", booking) // Self Reference (for click)
        //
        let masterkey = orderNumber
        // "2FCF" coded sprite
        $sprite.addClass("BookingSprite")
        $sprite.prop("id", orderNumber)
        // $sprite.css("background-color", booking.flight.color)
        // $sprite.text(booking.flight.seats + " " + booking.productCode.GYACode)
        $sprite.text(orderNumber)
        $sprite.click(function () {
          let _this = $(this).data("this")
          console.log("BookingSprite: %o", _this)
        })
      }
      return $sprite
    }

    // ------------
    // Get Bookings
    // ------------
    //
    // [[ Overloaded Function ]]
    // if we pass it an array of booking references, pass back the matching booking objects
    //
    // if we pass it a data, pass back an object of matching bookings hash key'd by orderNumber ***** Check that we're actually using this
    getBookings(data) {
      // if we pass in a list of booking references, return the matching booking objects
      let _manifest = {}
      if (!!data && Array.isArray(data)) {
        for (let b in data) {
          _manifest[data[b]] = this.bookings[data[b]]
        }
        return _manifest
      }
      let date = data
      // If a date object is passed in, make it a string
      if (!!date && typeof date == "object") {
        date = Dates.getNZ(date)
      }
      console.log("[Manifest].getBookings(%o)", date)
      console.log("This %o", this)

      // Do we even want to be able to pass in strings? (if not, the check above changes) *******************
      if (!!date && date.match(/\d\d.\d\d.*/gi)) {
        // Checkvalve... date is sane
      } else {
        date = this.getDate() // this or _this? ***************
        return
      }

      console.log("Date %o", date)
      console.log("Bookings.list: %o", Bookings.list)
      //
      // Filter list (date and status)
      //
      for (let a in Bookings.list) {
        if (!!Bookings.list[a] && Bookings.list[a].flight) {
          if (Bookings.list[a].flight.date == date) {
            _manifest[Bookings.list[a].orderNumber] = Bookings.list[a]
          }
        }
      }
      return _manifest
    }
    //
    // Loop over each booking for a match
    //
    getBooking(orderNumber) {
      if (!!this.bookings[orderNumber]) {
        console.log("Booking ", orderNumber)
        return this.bookings[orderNumber]
      }
      return
    }
    //
    // return total number of filled seats
    //
    getTotalPax() {
      let seats = 0
      $("#" + this.root.prop("id") + " .Manifest").each(function () {
        let json = $(this).data("json")
        for (let booking in json) {
          if (json[booking].orderNumber) {
            let book = json[booking].orderNumber.split("_")[0]
            if (json[booking].seats) {
              seats += json[booking].seats
            }
          }
        }
      })
      return seats
    }
  }
</script>
