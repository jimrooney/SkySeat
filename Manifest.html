<script>
  class Manifest {
    constructor($parent) {
      let _this = this
      this.json // Placeholder
      this.bookings // Placeholder... List of Bookings... hash key'd (by orderNumber) from Rezdy load
      this.$bookings // Placeholder
      this.$parent = $parent // Keep a link to the parent jQuery object
    }
    getDate() {
      let date = this.parent.$datepicker.datepicker("getDate")
      date = Dates.getNZ(date)
      return date
    }
    write() {
      //
      // Manifest Div
      //
      let _span = this.$parent
        .append(`<div class="Manifest_Container">
          <div class="Header">
          <span style="float:left;display: inline-block;"></span>
          <span style="float:right;display: inline-block;"><button>&#10226;</button></span> Manifest </div><div class="Manifest"></div>
          <div class="Bookings" style="float:left;display: inline-block;"></div>
      </div>`)
      this.$bookings = this.$parent.find(".Bookings")
      //
      // Manifest Reload Button
      //
      _span.find("button").off("click")
      _span.find("button").click(function () {
        // _this instead of this because this is the calling button right now.
        _this.load()
      })
    }
    show(date) {
      console.log("Manifest.show(%o)", date)
      if (!date) {
        date = this.getDate()
      }
      let bookings = this.bookings
      let $Bookings = this.$parent.find(".Bookings") // get the root jQuery object to put all the Booking Divs into
      console.log("bookings %o", bookings)
      //
      // Loop over bookings next and print each booking div
      //
      for (let b in bookings) {
        let div = new BookingDiv($Bookings) // Pass in the $Bookings div as the root jQuery object
        div.write(bookings[b]) // BookingDiv's print their own HTML
      }

      init() // This should change *************** not be root variable, not be such a hatchet **********
    }

    // Call the Google Rezdy loading script, passing this object so the results can be returned into it
    load() {
      Rezdy.load(this)
    }
    onLoad(XML) {
      console.log("Manifest onLoad()")

      let data = JSON.parse(XML)
      this.bookings = Rezdy.parseData(data) // Hash key'd by booking orderNumber
      let json = data.bookings // We don't need to keep the response code meta-data

      console.log("JSON Loaded: %o", data)
      console.log("Parsed Bookings: %o", this.bookings)
      console.log("Manifest.json: %o", json)

      console.log("This %o", this)
      this.$bookings.empty()
      this.show()
    }
    // ------------
    // Get Bookings
    // ------------
    // Returns an object hash key'd by orderNumber
    getBookings(date) {
      let _manifest = {}

      // If a date object is passed in, make it a string
      if (!!date && typeof date == "object") {
        date = Dates.getNZ(date)
      }
      console.log("[Manifest].getBookings(%o)", date)
      console.log("This %o", this)

      // Do we even want to be able to pass in strings? (if not, the check above changes) *******************
      if (!!date && date.match(/\d\d.\d\d.*/gi)) {
        // Checkvalve... date is sane
      } else {
        date = this.getDate() // this or _this? ***************
        return
      }

      console.log("Date %o", date)
      console.log("Bookings.list: %o", Bookings.list)

      for (let a in Bookings.list) {
        if (!!Bookings.list[a] && Bookings.list[a].flight) {
          if (Bookings.list[a].flight.date == date) {
            _manifest[Bookings.list[a].orderNumber] = Bookings.list[a]
          }
        }
      }
      return _manifest
    }
    //
    // Loop over each booking for a match
    //
    getBooking(orderNumber) {
      if (!!this.bookings[orderNumber]) {
        console.log("Booking ", orderNumber)
        return this.bookings[orderNumber]
      }
      return
    }
    //
    // return total number of filled seats
    //
    getTotalPax() {
      let seats = 0
      $("#" + this.root.prop("id") + " .Manifest").each(function () {
        let json = $(this).data("json")
        for (let booking in json) {
          if (json[booking].orderNumber) {
            let book = json[booking].orderNumber.split("_")[0]
            if (json[booking].seats) {
              seats += json[booking].seats
            }
          }
        }
      })
      return seats
    }
    //
    // Booking Div (Booking Sprite)
    //
    // ***************** "style" can probably be removed ****************************
    getBookingDiv(booking, style) {
      let vis = style == "compact" ? false : true
      vis = false
      let container = ""
      let ret = "<span class='tooltip'>"
      if (booking.orderNumber) {
        let masterkey = booking.orderNumber.split("-")[0]
        ret =
          ret +
          // "2FCF" coded sprite
          '<span style="float:left"><div class="BookingSprite Manifest" id="' +
          booking.orderNumber +
          '"' +
          "> " +
          '<span style="font-weight:bold;background-color:' +
          colors.getByBooking(booking) +
          '">' +
          booking.seats +
          " " +
          booking.product +
          "</span>" +
          "</div></span>"
        // verbose section
        ret += '<span class="tooltiptext">'
        ret +=
          "<A href='https://app.rezdy.com/orders/edit/" +
          masterkey +
          "' target='_blank' style='color: lightgrey;'>" +
          booking.orderNumber +
          "</a><br>"

        for (let p in booking.pax) {
          let firstName = booking.pax[p].firstName || ""
          let lastName = booking.pax[p].lastName || ""
          let weight = booking.pax[p].weight || ""
          //
          // Display LBS as KG
          //
          let inKG = weight
          if (!!inKG && inKG.match(/lb/gi)) {
            let w = inKG.toLowerCase().split("lb")[0]
            inKG = Math.round(parseInt(w) / 2.2)
            inKG = " [ " + inKG + " kg] "
          }
          if (!!inKG && inKG.match(/pound/gi)) {
            let w = inKG.toLowerCase().split("pound")[0]
            inKG = Math.round(parseInt(w) / 2.2)
            inKG = " [ " + inKG + " kg] "
          }

          if (vis) {
            ret +=
              '<div class="BookingSprite Manifest Individual" id="' +
              booking.orderNumber +
              '"> ' +
              "<span style='font-size: x-small' >" +
              time.getHour(booking.time) +
              "</span> " +
              "(" +
              utility.ACI(booking.ACI) +
              ") " +
              "(" +
              inKG +
              ")" +
              "</div><br>"
          } else {
            ret += firstName + lastName + " ( " + inKG + " ) " + "<br>"
          }
        }
        if (booking.pickupLocation) {
          if (booking.pickupLocation.locationName) {
            ret += "<br><span>" + booking.pickupLocation.locationName + "</span>"
          }
        }
        ret = ret + "<P><span>" + booking.internalNotes + "</span>"
        ret = ret + "</span>"
      }
      container = container + ret + "</span>"
      return container
    }
  }
</script>
