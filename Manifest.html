    countPax(arr) {
      return arr.reduce((total, booking) => {
        let s1 = booking.item.participants.length
        let s2 = booking.item.quantities.reduce((total, q) => {
          let hasACI
          !!q.optionLabel.match(/^Adult/)
            ? (hasACI = true)
            : !!q.optionLabel.match(/^Child/)
            ? (hasACI = true)
            : !!q.optionLabel.match(/^Infant/)
            ? (hasACI = true)
            : (hasACI = false)
          if (hasACI) {
            return total + parseInt(q.value)
          }
          return total
        }, 0)
        let ret = s1
        if (s1 < s2) {
          ret = s2
        }
        return total + ret
      }, 0)
    }
    countTripCost(arr) {

    // ------------
    // filter

    filterByDate(orders, date) {
      let _date = date
      return orders
        .filter((element) => element.items.some((subElement) => {
          return new Date(subElement.startTimeLocal).toDateString() == _date.toDateString()
        }))
        .map((element) => {
          let newElt = Object.assign({}, element) // copies element
          newElt.items = newElt.items.filter((subElement) => {
            return new Date(subElement.startTimeLocal).toDateString() == _date.toDateString()
            })
          return newElt
        })
    }
    filterByMonth(orders, date) {
      let month = date.getMonth()
      return orders
        .filter((element) =>
          element.items.some((subElement) => new Date(subElement.startTimeLocal).getMonth() == month)
        )
        .map((element) => {
          let newElt = Object.assign({}, element) // copies element
          newElt.items = newElt.items.filter((subElement) => new Date(subElement.startTimeLocal).getMonth() == month)
          return newElt
        })
    }

    getOrders(data) {

      // [ Recursive ]

      if (!!data && typeof data == "object" && !!data.orders) {
        return this.getOrders(data.orders)
      }
      //
      // return the matching order objects
      //
      let Orders = []
      if (!!data && Array.isArray(data)) {
        // Loop over the orders and return the matching manifest object
        for (let b in data) {
          let _oNum = data[b].split("_")[0]
          Orders.push(this.orders.find((x) => x.orderNumber === _oNum))
        }
        return Orders
      }
      return

    }
