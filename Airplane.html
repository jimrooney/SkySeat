<script>
  class Station {
    constructor(data) {
      this.type = data.type || ""
      this.weight = data.weight || 0
      this.arm = data.arm || 0
      this.moment = this.weight * this.arm
    }
  }

  class Airplane {
    constructor(data) {
      // data.REG data.Weight,data.ARM,data.Moment,data.Type,data.RegColor]
      //
      // Could probably dynamically build type by processing data.Type... would need more defaults like seats and arms passed in.
      //
      this.reg = data.REG
      this.wam = [data.Weight, data.ARM, data.Moment]
      this.stations = [] // Station object for each weight and balance item
      this.regColor = data.RegColor
      this.Burn = data.Burn
    }
    getSeats() {
      let ret = []
      for (let i in this.stations) {
        if (this.stations[i].type == "seat") {
          ret.push(this.stations[i])
        }
      }
      return ret
    }
    getStations(type) {
      let ret = []
      let regex = new RegExp(type, "g")
      for (let i in this.stations) {
        if (this.stations[i].type.match(regex)) {
          ret.push(this.stations[i])
        }
      }
      return ret
    }
    // -----------------------------------
    // Get Weight and Balance
    // -----------------------------------
    /*
        We'll need to pass the loading data into a plane as there is only one plane object.
        We can still use the top cell data (fuel pilot), but we can also override it here.
        
    */
    getWB(data) {
      console.log("GET WB: %o",this.reg)
    }
    // -----------------------------------
    // Load the plane
    // -----------------------------------
    load(PCF, POB) {
      // POB[0,1] 0=weight 1=paxObject ... includes crew
      this.fuel = PCF[2]
      this.seats = POB
      this.seatWeights = []
      // Probably build WAM instead of a seats array? ****************************************************************************************************
      // Or maybe build it off the POB array
      for (let a in POB) {
        this.seatWeights.push(POB[a][0])
      }
    }
  }
