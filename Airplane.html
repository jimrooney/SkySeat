    getFuelWeight() {

      // if no id exists, get one.
      let legal = false
      if (this.isLegal(load)) {
        load.id = this.getNextLoadId()

    isLegal(load) {

    }

    }
    getWB() {
      //---------------------------------------
      // calculate CG based on load (simple WAM)
      // returns {wb} Object
      // --------------------------------------
      //
      // Calculate all moments
      //
      this.stations.forEach((station) => {
        station.moment = station.weight * station.arm
      })
      //
      // Since our airplane data moments inexplicably don't equal weight*arm, we need a seperate Station object for them.
      //
      let station = new Station({
        type: ["airplane"],
        weight: this.weight,
        arm: this.arm,
      })
      station.moment = this.moment
      this.stations.push(station)
      //
      // Sum all Weights and Moments
      //
      const ZFW = this.stations.filter((station) => !station.type.includes("fuel")) // Everything but fuel
      const fuel = this.stations.filter((station) => station.type.includes("fuel"))
      const POB = this.stations.filter((station) => station.type.includes("seat") && station.weight > 0) // only occupied seats
      const CREW = POB.filter((station) =>
        station.pax.find(
          (pax) => pax.label == "Role" // only return pax with Roles (crew)
        )
      )
      //
      // Find the PIC (Flies Left Seat, so find works, but could also search by matching seat number) ****
      //
      const PIC = CREW.find((station) =>
        station.pax.find(
          (pax) => pax.label == "Role" && pax.value == "PIC"
        )
      )
      const PAX = POB.filter((x) => !CREW.includes(x)) // Filter out Crew
      const POB_Weight = POB.reduce((total, station) => total + parseFloat(station.weight), 0)
      const CREW_Weight = CREW.reduce((total, station) => total + parseFloat(station.weight), 0)
      const PAX_Weight = POB_Weight - CREW_Weight
      const ZFW_Weight = ZFW.reduce((total, station) => total + parseFloat(station.weight), 0)
      const totalWeight = this.stations.reduce((total, station) => total + parseFloat(station.weight), 0)
      const totalMoment = this.stations.reduce((total, station) => total + parseFloat(station.moment), 0)
      const CG = totalMoment / totalWeight
      const rCG = Math.round((CG + Number.EPSILON) * 1000) / 1000
      const rAUW = Math.round((totalWeight + Number.EPSILON) * 100) / 100
      //
      // Build {wb} Object
      //
      const wb = {
        stations: this.stations,
        crew: {
          stations: CREW,
          pic: PIC,
          },
        TotalWeight: totalWeight,
        TotalMoment: totalMoment,
        CG: CG,
        weights: {
          crew: CREW_Weight,
          pob: POB_Weight,
          pax: PAX_Weight,
          zfw: ZFW_Weight,
          auw: totalWeight,
          fuel: totalWeight - ZFW_Weight,
        },
        fuel: {
          liters: 0,
          kg: 0,
        },
        rounded: {
          AUW: rAUW,
          CG: rCG,
        },
      }
      return wb
    }
    getNextLoadId() {
      // return highest ID in current load + 1
      let count = 0
      this.load.forEach((element) => {
        if (element.id >= count) {
          count = element.id + 1
        }
      })
      return count
    }
  }
