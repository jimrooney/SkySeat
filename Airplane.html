<script>
  class Airplane {
    constructor(data, state, stations) {
      console.log("New Airplane: %o \n %o \n %o", data, state, stations)
      // data.REG data.Weight,data.ARM,data.Moment,data.Type,data.RegColor] *** update with new signature ***
      this.reg = data.reg
      this.regcolor = data.regcolor
      this.weight = data.weight
      this.arm = data.arm
      this.moment = data.moment
      this.type = data.type // this.constructor.name
      this.standardFuel = data.standardfuel || 0

      // this.burn = {
      //   // climb:
      //   // cruise:
      //   // descent:
      // }
      this.limit = {
        // cg: [forard,aft]
        // weight: [TO,LND,Ramp]
        // fuel: (capacity)
      }
      this.stations = [
        // {
        // accepts: ["crew","pax","cargo","seat","fuel","other"(controls/pods)] // perhaps more "others" details? *************
        // type: (any of the accepts)
        // weight:
        // arm:
        // limit:
        // }
      ]
      this.load = [
        // {
        //   id: // this.getNextLoadId() ... simple counter.
        //   station:
        //   type:
        //   weight:
        // },
        // {},
        // {}
      ]
      this.state = state // *** (maybe fixed with new {WB} object) breaks things if not set last (maybe because getFuelWeight() depends on it?)
      if(!!stations){
        this.updateStations(stations)
      }
    }
    updateStations(stations){
      console.log("Stations: ", stations)
    }
    /* ***
    Are these backwards?
    Should we not be getting fuel weight when we ask for the fuel object?    
    */
    get fuel() {
      if (!this._fuel) {
        return {
          capacity: 0,
          type: "100LL",
          factor: 0.72,
          weight: this.getFuelWeight(),
          burnRate: 60,
        }
      }
      return this._fuel
    }
    set fuel(fuel) {
      //
      // Accepts any {} data, but assumes any string is a quantity (in liters)
      //
      if (typeof fuel == "string") {
        const fuelStation = this.stations.find((station) =>
          station.type.includes("fuel")
        ) // get the station
        fuelStation.liters = fuel // modify the station
        fuel = { liters: fuel } // build the object to modify the fuel object (spread into)
/*



*/
        // HERE ***
       //console.log("GetFuelWeight: ", this.getFuelWeight())
/*







*/
      }
      this._fuel = { ...this._fuel, ...fuel } // merge the new values via spread
    }
    getLoadedPlane(CellData) {
      this.getFuelWeight(CellData) // Load fuel weight based on {state} if no CellData fuel is specified
      CellData.passengers.forEach((pax) => this.seatPax(pax))
      return this
    }

    getSeats() {
      return this.stations((item) => item.type.includes("seat"))
    }
    loadFuelWeightFromSate() {
      // crude linear function to force loading of the fuel data from state
      this.getFuelWeight()
    }
    // ***
    // Maybe set the fuel upon fuel changes or loaded states rather than setting it when asking for Fuel Weight.
    // ***
    /*
        Check CellData for fuel in PCF. If not there, then look to the plane cell. ***
      */
    setFuel(CellData) {
      if (!!this.state) {
        const fuelStations = this.stations.find((station) =>
          station.type.includes("fuel")
        )
        // Check CellData for fuel
        if (!!CellData && !!CellData.PCF) {
          this.fuel.liters = CellData.PCF.fuel
        }
      }
    }
    getFuelWeight(CellData) {
      //
      this.setFuel(CellData) // set the fuel before calculating things ***
      //
      // Find the first fuel station // Will ignore any other fuel stations
      // calculate and set it's weight and endurance
      // set the {airplane} fuel.endurance
      //
      if (!!this.state) {
        const fuelStations = this.stations.find((station) =>
          station.type.includes("fuel")
        ) // assumes just one fuel station
        fuelStations.weight = this.fuel.liters * this.fuel.factor || 0
        fuelStations.endurance = this.fuel.liters / this.fuel.burnRate || 0
        this.fuel.endurance = this.fuel.liters / this.fuel.burnRate || 0 // *** sets value outside this scope
        return fuelStations
      }
      return null
    }
    seatPax(pax) {
      pax = new Pax(pax) // Convert any JSON pax to {Pax}
      if (!!pax.seat) {
        const stations = this.stations.find(
          (station) => station.type.includes("seat") && station.id == pax.seat
        )
        if (!!stations) {
          stations.weight = pax.weight
          stations.px = pax // pukes if you call stations.px stations.pax
        }
      }
    }
    convertToSAD(pob, SAD) {
      // takes a list of passenger stations and converts their weights based on SAD
      let POB
      const _SAD = !!SAD ? SAD : root.details.SAD
      switch (_SAD.SAD) {
        case "Actual":
          POB = pob.map((station) => {
            // Straight Copy, calculate arms
            const w = station.weight.actual
            station.weight = !!w ? w : 0
            station.moment = station.weight * station.arm || "NaN"
            return station
          })
          break
        case "Standard":
          POB = pob.map((station) => {
            station.weight = root.standard.weight.adult // Everyone's an adult for now ******
            // Eventually, maybe pull down the ACI data when processing the initial Manifest load?
            station.moment = station.weight * station.arm
            return station
          })
          break
        // Assume Declared
        default:
          POB = pob.map((station) => {
            const w = Number(station.weight.declared) + 4
            station.weight = !!w ? w : 0
            station.moment = station.weight * station.arm
            return station
          })
      }
      return POB // return new list of stations
    }
    // -----------------------------------------------------------------------------------------------
    // Get Weight and Balance
    // -----------------------------------------------------------------------------------------------
    //
      //---------------------------------------
      // calculate CG based on load (WAM)
      // returns {wb} Object
      // --------------------------------------
      //
    // Given a load ({passengers, fuel}), return a WB object
    // If not given, load from {state}
    //
    getWB(ARGS) {
      let data = ARGS

      // *** Add parameters to the passed in object to allow for passing in pax and fuel
      // Data is currently passed in like this:
      // {txt: 'Declared Weights', SAD: 'Declared', class: 'declaredWeights'}
      //
      // so like this (to override {state} pax):
      // 
      /*

        {
          sad: {txt: 'Declared Weights', SAD: 'Declared', class: 'declaredWeights'}
          passengers: [{Pax},{Pax},{Pax}]
          fuel: {quantity: x, weight x,}
        }
      */

      if (!ARGS.SAD){
        data = {
          sad: ARGS, // legacy support, assume SAD is passed in if ARGS isn't {data}
        }
      }
      const SAD = data.SAD // legacy support... plan to remove and replace with {data}.sad
      //
      if (!!data.passengers){
        data.passengers = this.state.data[this.cell.cellID]?.passengers
      }

      //
      //
      // [Here] is where we load in passengers... swap this to either load (if passed in)...
      //  or look to the cell data if nothing's passed in.
      //

      // if (!data.SAD) {
      //   // spread passed in ARGS over data rather than explicitely setting them ***
      //   data = {
      //     sad: ARGS, // legacy support, assume SAD is passed in if ARGS isn't {data}
      //     passengers: this.state.data[this.cell.cellID]?.passengers,
      //   }
      // }





// ***
// not sure we need nor want this... {Airplane} should get pax seat data when it does the calculation
        // shouldn't need to "seat" them, but rather grab their seat data

        /*

        So what we're doing currently is loading the .passengers data into the plane's stations.
        Be better to build the WB out of the passenger data based on the plane's stations rather than modifying the plane's station data.

        So, abstract the calculations below to read from a data set rather than the plane's stations.
        Then change the loading to load .passenger into that abstract

        (see below, you've already set this up... things are copied into the local passengers variable)
        */


      if (!!ARGS.passengers) {
        // Override this plane's loading with passed in load
        data.passengers = ARGS.passengers
      } else {
        this.state.data[this.cell.cellID]?.passengers?.forEach((pax) => {
          this.seatPax(pax)
        })
      }

      // This should be able to be reworked (it shouldn't need to be called)
      // -- Load Fuel --
      this.loadFuelWeightFromSate()





/*
      Change this... *** 
      Copy the .stations before loading them and then calculate the moments.

*/

      // this.stations.forEach((station) => {
      //   station.moment = station.weight * station.arm
      // })

      // *** change this... have calculatePlaneMoment() return a station rather than altering this plane's .stations
      
      
      // -- Override plane moment calculation. --
      // ***
      // pull all the calcualtePlaneMoment code back into this function.
      // All it's really doing is putting this.moment into a plane station if it isn't already there.

//---      //this.calculatePlaneMoment() // Plane moments inexplicably don't equal W*M for GY Air


      //
      // copy so we don't change the original data
      //
      let stations = Array.from(this.stations)
      // calculate moments *** could be a getter/setter in station instead so it's automagic
      // would need to be overridden by code below for the airplane moment (cuz NZ)
      stations.forEach((station) => {
        station.moment = station.weight * station.arm
      })
      // override the plane's moment
      // *** I don't think there's ever a plane station, so this gets called every time.
      const planeStation = stations.filter((station) =>
        station.type.includes("airplane")
      )
      // if no plane station, make one
      if (planeStation.length <= 0) {
        //
        // Since our airplane data moments inexplicably don't equal weight*arm, we need a seperate Station object for them.
        //
        let station = new Station({
          type: ["airplane"],
          weight: this.weight,
          arm: this.arm,
        })
        station.moment = this.moment
        stations.push(station)
      }
/*


      Most of the calculation code below shouldn't specifically need to change (yet?)
      since it's all working on a copy of the .stations already :)







*/

      //
      // Sum all Weights and Moments
      //
      let pob = stations.filter(
        (station) => station.type.includes("seat") && !!station.weight
      ) // only occupied seats
      const cargo = stations.filter(
        (station) => station.type.includes("cargo") && station.weight > 0
      )

      pob = this.convertToSAD(pob, SAD)

      const ZFW = stations.filter((station) => !station.type.includes("fuel")) // Everything but fuel
      const fuel = stations.filter((station) => station.type.includes("fuel"))
      const fuelQuantity = fuel.reduce((acc, station) => station.quantity, 0)
      const fuelEndurance = fuelQuantity / this.fuel.burnRate

      const CREW = pob.filter((station) => {
        if (!!station.pax) {
          station.pax.find((pax) => !!pax && pax.label == "Role") // only return pax with Roles (crew)
        }
      })
      //
      // Find the PIC (Flies Left Seat, so find works, but could also search by matching seat number) ****
      //
      const PIC = CREW.find((station) =>
        station.pax.find((pax) => pax.label == "Role" && pax.value == "PIC")
      )
      const PAX = pob.filter((x) => !CREW.includes(x)) // Filter out Crew

      const POB_Weight = pob.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      const CREW_Weight = CREW.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )

      const PAX_Weight = POB_Weight - CREW_Weight
      const ZFW_Weight = ZFW.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )

      const totalWeight = stations.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      const totalMoment = stations.reduce(
        (total, station) => total + parseFloat(station.moment),
        0
      )

      //
      const CG = totalMoment / totalWeight
      const roundCG = Math.round((CG + Number.EPSILON) * 1000) / 1000
      const roundAUW = Math.round((totalWeight + Number.EPSILON) * 100) / 100
      let isBalanced = this.isBalanced(totalWeight, CG)
      //
      // Build {wb} Object
      //
      const wb = {
        SAD: SAD,
        stations: this.stations,
        POB: pob,
        crew: {
          stations: CREW,
          pic: PIC,
        },
        TotalWeight: totalWeight,
        TotalMoment: totalMoment,
        CG: CG,
        cg: {
          position: CG,
          balanced: isBalanced,
          fwdLimit: this.getForwardCGLimit(
            totalWeight,
            this.limits.CG.bounds[0]
          ),
          imperial: {
            TotalWeight: totalWeight * 2.2,
            CG: CG * 39.3701,
            fuelWeight: (totalWeight - ZFW_Weight) * 2.2,
          },
        },
        weights: {
          crew: CREW_Weight,
          pob: POB_Weight,
          pax: PAX_Weight,
          zfw: ZFW_Weight,
          auw: totalWeight,
          fuel: totalWeight - ZFW_Weight,
        },
        fuel: {
          liters: fuelQuantity,
          kg: 0,
          endurance: fuelEndurance,
        },
        rounded: {
          AUW: roundAUW,
          CG: roundCG,
        },
      }
      return wb
    }

    getNextLoadId() {
      // return highest ID in current load + 1
      let count = 0
      this.load.forEach((element) => {
        if (element.id >= count) {
          count = element.id + 1
        }
      })
      return count
    }

    getForwardCGLimit(weight, bounds) {
      //
      // Need parseInt and check weight is valid before anything
      //
      // bounds [limit,weight] (coordinates on the plotted WB chart)
      //
      if (!bounds) {
        return
      }
      const fwd1 = bounds.fwd1[0] //|| 1219
      const fwd2 = bounds.fwd2[0] // 1422
      const weight1 = bounds.fwd1[1] // 1089
      const weight2 = bounds.fwd2[1] // 1814

      const a = fwd2 - fwd1
      const o = weight2 - weight1
      const rad = Math.atan(o / a)

      const o2 = weight - weight1 // (problem weight)
      const h2 = o2 / Math.sin(rad)

      const a2 = Math.sqrt(h2 * h2 - o2 * o2)
      const limit = fwd1 + a2 // 1000

      if (o2 < 0) {
        return bounds.fwd1[0]
      } else {
        return limit
      }
    }
    getAftCGLimit(weight) {
      return this.limits.CG.aft // *** For now. will make more complex if needed ***
    }
    getCGLimit(weight) {
      // returns [foward,aft] limits for a given weight
      // Defaults to simple [forward,aft] limits unless overridden with more complex calculations.
      let forward = this.getForwardCGLimit(weight)
      let aft = this.limits.CG.aft
      return [forward, aft]
    }
    isBalanced(totalWeight, CG) {
      const bounds = this.limits.CG.bounds // [{[],[]}] of bounds *** Ugly ***
      //
      // Check extreme bounds
      //
      let balanced = true
      if (CG > this.limits.CG.aft || CG < this.limits.CG.forward) {
        return false
      }
      //
      // Check Weight
      //
      if (totalWeight > this.limits.weight.MAUW) {
        return false
      }
      //
      // Check forward bounds
      //
      bounds.forEach((bound) => {
        const limit = this.getForwardCGLimit(totalWeight, bound)
        const wLower = bound.fwd1[1] // Lower Bound weight
        const wUpper = bound.fwd2[1] // Upper Bound weight

        if (totalWeight <= wUpper && totalWeight >= wLower) {
          balanced = CG > limit
        }
      })
      return balanced
    }
  }
</script>
