<style>
  .container {
    background-color: #333;
    padding: 1rem;
    margin-top: 1rem;
  }
  .draggable {
    background-color: white;
    padding: 1rem;
    border: 1px solid black;
    cursor: move;
  }
  .draggable.dragging {
    opacity: 0.5;
  }
  .Pickup {
    background-color: rgb(100, 201, 122);
  }
  .PickupSprite {
    display: inline-block;
    min-height: 500px;
  }

  .vehicle-box{
    display: inline-block;
    width: 330px;
  }
  .title {
    display: inline-block;
    width: 300px;
  }
  .input-title {
    width: 100px;
  }
  .Dropoff {
    background-color: 7393B3;
  }
  .popupCloseButtonSmall {
    color: #ccc;
    background-color: #fff;
    border: 3px solid #999;
    border-radius: 8px;
    cursor: pointer;
    display: inline-block;
    font-family: arial;
    font-weight: bold;
    position: absolute;
    top: 0px;
    left: 0px;
    font-size: 15px;
    line-height: 15px;
    width: 15px;
    height: 15px;
    text-align: center;
    z-index: 1;
  }
  .needToPay {
    display: block; /* Make the span a block-level element */
    width: 100%; /* Set its width to 100% of the container */
    background-color: rgb(255, 119, 119, 0.2);
  }
  ul:before{
    content:attr(list-label);
    font-size:100%;
    font-weight:bold;
    margin-left:15px;
}
</style>

<script>
  class PickupList {
    constructor($this) {
      let _this = this
      this.$this = $this // jQuery selector passed in
      $this.data("object", this)
      this.pickupList
      this.headers = ["Crafter", "HiAce", "Crafter2", "Taxi", "Misc"]
    }
    get$PickupList(args) {
      this.pickupList = args.pickupList
      // Clear dupicates
      this.pickupList.pickups = [...new Set(this.pickupList.pickups)]
      this.pickupList.dropoffs = [...new Set(this.pickupList.dropoffs)]
      // Clear $ .PickupContents
      this.clear() // this.$this.find(".PickupContents").remove()
      let contents = $("<div class='PickupContents container'></div>")
        .append(
          $(
            `<span class="popupCloseButtonSmall left MobileButton">X</span>`
          ).click(() => this.$this.hide())
        )
        .append("<div class='container'></div>")

      // so it can be called against pickups or dropoffs
      if (this.pickupList.pickups.length > 0) {
        contents = this.buildList(contents, this.pickupList.pickups, "Pickup")
      } else {
        contents = this.buildList(contents, this.pickupList.dropoffs, "Dropoff")
      }
      return contents
    }
    buildList(contents, list, pickdrop) {
      // --------------------
      // Each Pickup Location
      // --------------------
      list.forEach((orderNumber) => {
        //
        // Number of pax at pickup location
        //
        const px = this.pickupList.passengers.filter((pax) =>
          pax.fields.find((f) => f.value == orderNumber)
        )
        const location = px[0].fields.reduce((acc, field) => {
          if (field.label == "pickupLocation") {
            acc = field.value
          }
          return acc
        }, null)

        let pickupTime = time.getTime(location?.pickupTime)
        if (pickupTime == "NaN:NaN") {
          pickupTime = ""
        }
        const loc = location?.locationName || ""

        // Build div and append.
        const drag = $(`<div>(${px.length}x) ${loc} ${pickupTime}</div>`)
          .addClass(pickdrop)
          .addClass("draggable")
          .draggable({
            helper: "clone",
            cursor: "pointer",
          })
          .draggable({
            start: function (event, ui) {
              $(this).draggable("instance").offset.click = {
                left: Math.floor(ui.helper.width() / 2),
                top: Math.floor(ui.helper.height() / 2),
              }
            },
          })
          .draggable("enable")
        contents.append(drag)
      })
      return contents
    }
    clear() {
      this.$this.find(".PickupContents").remove()
    }
    show(args) {
      console.log("This: ", this)
      console.log("PickupList: ", args)
      this.$this.append(this.get$PickupList(args)) // Old V2 pickupList DOM.
      this.$this.show()
      // *** to disable the new stuff, remove the next call...
      this.showList(args.pickupList) // Calling retrofit of V1 pickupList DOM... deletes Old V2 version first
      this.handleDropEvent()
    }
    hide() {
      this.$this.hide()
    }

    showList(pickupData) {
      // pickupData is built in {Manifest}
      // getPickupList({ bookings, date, row }) {
      console.log("showList pickupData: ", pickupData)
      const PickupManifest = "PickupManifest"

      /* PickupContents was the "pickup round" we're on (aka, which hour)
        We're just targetting PickupContents for now as it's the second tier container (just below PickupList)
      */
      //
      // Clear old list
      //
      const pickupList = $("#PickupList")
      pickupList.empty()
      pickupList.append("<div id='PickupContents'></div>")
      //
      // Navbar
      //
      //<button onClick='utility.printPickup()'>Print</button>
      let _nav = `<div style='width: 100%; display: block; position: absolute; top: 0;'>
        <span class="title"></span>
        </div><span id="pickupDetailsClose" class="popupCloseButtonSmall MobileButton">X</span><P>`
      $(`#PickupContents`).append(_nav)

      $(`#PickupContents`)
        .find("#pickupDetailsClose")
        .click(function () {
          pickupList.hide()
        })

      $(`#PickupContents .title`).text("Pickups")
      pickupList.css("background-color", "green")

      let data = pickupData.pickups
      let _dropoffs = false
      if (data.length < 1) {
        _dropoffs = true
        data = pickupData.dropoffs
        $(`#PickupContents .title`).text("Dropoffs")
        pickupList.css("background-color", "#7393B3")
      }
      // ----------------------------------------------------------------------------------------------------------------------------------
      // Pickup Manifest (sortable) (loop over the Data)
      // ----------------------------------------------------------------------------------------------------------------------------------
      if (data.length > 0) {
        //
        // Sortable PickupManifest
        //
        $("#PickupContents").append(
          `<span id='${PickupManifest}' class='PickupManifest'></span>`
        )
        $("#" + PickupManifest).append(
          `<span class="vehicle-box"><span class="pax"></span>
              <span class="title" data-vehicle="1">
                <form>
                  <input class="input-title" type="text" placeholder="${this.headers[0]}">
                  <input class="input-title" type="text" placeholder="">
                  <span class="total" /></span>
                </form>
            </span>
          <ul id="sortable1" class="PickupSprite droptrue"></ul></span>`
        )
        //
        // Each Pickup
        //
        data?.forEach((orderNumber) => {
          const order = pickupData.manifest.getOrder(orderNumber)
          let dropoffAddress
          let pickupAddress
          //
          // Rezdy uses the second "Drop off address" label as the actual dropoff address... IF there's a dropoff!!! (arg!)
          // The rest of the array is used for "How did you hear about us" type data... (all labeled "Drop off address") arg!!!
          //

          // Get the dropoff address (or whatever's shoved in there) if it has the field
          if (!!order) {
            const _doff = order.fields?.filter(
              (f) => (f.label = "Drop off address")
            )
            if (_doff.length > 0) {
              dropoffAddress = _doff[1]?.value
            }
          }

          // Get the pickup address (if it has one, even if it's "No pickup required" ARG!)
          // We have to get it from the first passenger, because of course it's in passengers when dropoffs are in bookings (arg!)

          // == Passenger List ==
          // get a list of passengers for this orderNumber (filtering the pickupData by orderNumber)
          const paxList = pickupData.passengers.filter((pax) => {
            const oNum = pax.fields?.find((x) => x.label == "orderNumber")
            return oNum.value == orderNumber
          })
          // Get number of infants (if any)
          const initialValue = 0
          const numInfants = paxList.reduce((accumulator, pax) => {
            const infant = pax.fields.find((x) =>
              x.label.match(/Infant/gi)
            )?.value

            if (infant?.match(/m/gi)) {
              accumulator++
            }

            return accumulator
          }, initialValue)
              // extract location from first pax
          const location = paxList[0].fields.find(
            (f) => f.label == "pickupLocation"
          )
          const locationName = {
            short: location?.value?.locationName || "",
            detail: "",
          }
          pickupAddress = locationName.short

          if (!!dropoffAddress && _dropoffs && !locationName.short) {
            locationName.short = dropoffAddress
            locationName.detail = ""
          }
          if (!!locationName.short.match(/=/)) {
            const split = locationName.short.split("=")
            locationName.short = split[1]
            locationName.detail = split[0]
          }
          if (!!locationName.short.match(/\(/)) {
            const split = locationName.short.split("(")
            locationName.short = split[0]
            locationName.detail = split[1]
          }
          let time = location?.value?.pickupTime
          if (!!time) {
            time = root.time.getTime(time)
          }
          if (_dropoffs) {
            time = ""
          }
          let _color = ""
          if (numInfants > 0) {
            _color = "color:red"
          }

          // Which plane?
          const col = paxList[0]?.cellId.split("_")[1] || 0
          const planeNum = parseInt(col, 10) //-1 // plane columns are 1-x since column 0 is pickups
          const boardId = paxList[0]?.boardId

          const plane = root.planes.getPlane(planeNum, boardId)

          // Do they need to pay?
          let paymentDue = ""
          let needToPay = ""
          if (!!order) {
            if (parseInt(order.totalDue, 10) > 0) {
              paymentDue = `<span style='color:#CC5500'>(Pay)</span>: ${order.totalDue}`
              needToPay = "needToPay"
            }
          }

          const $line =
            $(`<li id="Stop${orderNumber}" class="ui-state-default stop" paxNum=${
              paxList.length + numInfants
            }
            ></span>
              <span style='${_color}'>(${
              paxList.length + numInfants
            })</span> ${time} ${locationName.short} 
                <br>
                </li>`)
              .click(() => {
                $(".click_area").toggle("slow")
              })
              .data("paxNum", paxList.length + numInfants)
          const $clickArea =
            $(`<div class='click_area' style='font-size:x-small;display: none;'>
              <span style='display: block;' class='${needToPay}'>
              <span style='color:${plane?.regcolor}'>${plane?.reg}</span>
              ${paymentDue}
              </span>
              <span style='color:darkgrey'>${locationName.detail}</span>
              </div>`)
          paxList.forEach((p) => {
            $clickArea.append(`<div>${p.fullName}</div>`)
          })
          $line.append($clickArea)
          $("#sortable1").append($line)
        })
        //
        // Two other sortable lists (Van2 and "Other")
        //
        $("#" + PickupManifest).append(
          `<span class="vehicle-box"><span class="pax"></span>
              <span class="title" data-vehicle="2">
                <form>
                  <input class="input-title" type="text" placeholder="${this.headers[1]}">
                  <input class="input-title" type="text" placeholder="">
                  <span class="total" /></span>
                </form>
            </span>
          <ul id="sortable2" class="PickupSprite droptrue"></ul></span>`
        )
        $("#" + PickupManifest).append(
          `<span class="vehicle-box"><span class="pax"></span>
              <span class="title" data-vehicle="3">
                <form>
                  <input class="input-title" type="text" placeholder="${this.headers[2]}">
                  <input class="input-title" type="text" placeholder="">
                  <span class="total" /></span>
                </form>
            </span>
          <ul id="sortable3" class="PickupSprite droptrue"></ul></span>`
        )
        $("#" + PickupManifest).append(
          `<span class="vehicle-box"><span class="pax"></span>
              <span class="title" data-vehicle="4">
                <form>
                  <input class="input-title" type="text" placeholder="${this.headers[3]}">
                  <input class="input-title" type="text" placeholder="">
                  <span class="total" /></span>
                </form>
            </span>
          <ul id="sortable4" class="PickupSprite droptrue"></ul></span>`
        )
        $("#" + PickupManifest).append(
          `<span class="title"><span class="pax"></span>
              <span class="vehicle-box" data-vehicle="5">
                <form>
                  <input class="input-title" type="text" placeholder="${this.headers[4]}">
                  <input class="input-title" type="text" placeholder="">
                  <span class="total" /></span>
                </form>
            </span>
          <ul id="sortable5" class="PickupSprite droptrue"></ul></span>`
        )
        //
        // Link the sortables
        //
        $("ul.droptrue").sortable({
          connectWith: "ul",
        })
        //
        $("ul.dropfalse").sortable({
          connectWith: "ul",
          dropOnEmpty: false,
        })
        // --------------------------------------------------------------
        // Name Dropdowns (show by default)
        // --------------------------------------------------------------
        //
        $(
          "#sortable1" +
            " .click_area, #sortable2" +
            " .click_area, #sortable3" +
            " .click_area, #sortable4" +
            " .click_area"
        ).each(function () {
          //
          // Show/Hide details
          //

          let _stop = $(this).parent().data("data")

          let details = "<div></div>"

          $(this).append(details)

          if (!!_stop) {
            if (!!_stop.tripCell) {
              let _col = _stop.tripCell.slice(-1)
              let _reg = $("#ac" + _col)
                .text()
                .slice(0, 3)
              let _regLine = _reg + " <br> "
              $(this).append(_regLine)
            }
            let _pax = []
            for (let p in _stop.pax) {
              _pax.push(_stop.pax[p].firstName + " " + _stop.pax[p].lastName)
            }
            $(this).append(_pax.join("<BR>"))
            $(this).data("visible", 1)
          }
        })
        const _this = this
        $(
          "#sortable1" +
            ", #sortable2" +
            ", #sortable3" +
            ", #sortable4" +
            ", #sortable5"
        ).droppable({
          accept: ".ui-state-default",
          drop: _this.handleDropEvent,
        })
      }

      // ----------------------------------------------------------------------------------------------------------------------------------
      pickupList.show()
    }
    handleDropEvent(e, ui) {

      // ---------------------------------------
      // Count list totals (#of pax per vehicle)
      // ---------------------------------------
      setTimeout(function () { // doesn't count right without a slight delay
        $("#PickupManifest ul").each((i, pickupList) => {
          let paxNum = 0
          $(pickupList)
            .find("li")
            .each((i, LI) => {
              const newNum = parseInt(LI.getAttribute("paxNum")) || 0
              paxNum += newNum
            })
          $(pickupList).find(".total").text(` (${paxNum})`)
          $(pickupList).attr('list-label', `Total Pax: ${paxNum}`)
        })
      }, 100)
    }
  }
</script>
