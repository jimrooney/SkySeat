<style>
  .container {
    background-color: #333;
    padding: 1rem;
    margin-top: 1rem;
  }
  .draggable {
    background-color: white;
    padding: 1rem;
    border: 1px solid black;
    cursor: move;
  }
  .draggable.dragging {
    opacity: 0.5;
  }
  .Pickup {
    background-color: rgb(100, 201, 122);
  }
  .Dropoff {
    background-color: rgb(139, 152, 206);
  }
</style>

<script>
  class PickupList {
    constructor($this) {
      let _this = this
      this.$this = $this // jQuery selector passed in
      $this.data("object", this)
      this.pickupList
    }
    get$PickupList(args) {
      this.pickupList = args.pickupList
      // Clear dupicates
      this.pickupList.pickups = [...new Set(this.pickupList.pickups)]
      this.pickupList.dropoffs = [...new Set(this.pickupList.dropoffs)]
      // Clear $ .PickupContents
      this.clear() // this.$this.find(".PickupContents").remove()
      let contents = $("<div class='PickupContents container'></div>")
        .append(
          $(`<span class="popupCloseButtonSmall MobileButton">X</span>`).click(
            () => this.$this.hide()
          )
        )
        .append("<div class='container'></div>")

      // so it can be called against pickups or dropoffs
      if (this.pickupList.pickups.length > 0) {
        contents = this.buildList(contents, this.pickupList.pickups, "Pickup")
      } else {
        contents = this.buildList(contents, this.pickupList.dropoffs, "Dropoff")
      }
      return contents
    }
    buildList(contents, list, pickdrop) {
      // --------------------
      // Each Pickup Location
      // --------------------
      list.forEach((orderNumber) => {
        //
        // Number of pax at pickup location
        //
        const px = this.pickupList.passengers.filter((pax) =>
          pax.fields.find((f) => f.value == orderNumber)
        )
        const location = px[0].fields.reduce((acc, field) => {
          if (field.label == "pickupLocation") {
            acc = field.value
          }
          return acc
        }, null)

        let pickupTime = time.getTime(location?.pickupTime)
        if (pickupTime == "NaN:NaN") {
          pickupTime = ""
        }
        const loc = location?.locationName || ""

        // Build div and append.
        const drag = $(`<div>(${px.length}x) ${loc} ${pickupTime}</div>`)
          .addClass(pickdrop)
          .addClass("draggable")
          .draggable({
            helper: "clone",
            cursor: "pointer",
          })
          .draggable({
            start: function (event, ui) {
              $(this).draggable("instance").offset.click = {
                left: Math.floor(ui.helper.width() / 2),
                top: Math.floor(ui.helper.height() / 2),
              }
            },
          })
          .draggable("enable")
        contents.append(drag)
      })
      return contents
    }
    clear() {
      this.$this.find(".PickupContents").remove()
    }
    show(args) {
      console.log("PickupList: ", args)
      this.$this.append(this.get$PickupList(args)) // Old V2 pickupList DOM.
      this.$this.show()
      // *** to disable the new stuff, remove the next call...
      this.showList(args.pickupList) // Calling retrofit of V1 pickupList DOM... deletes Old V2 version first
    }
    hide() {
      this.$this.hide()
    }

    showList(Data) {
      const RoundID = "PickupContents" // legacy hack... can probably replace below with string
      const PickupManifest = "PickupManifest"

      /* RoundID was the "pickup round" we're on (aka, which hour)
        We're just targetting PickupContents for now as it's the second tier container (just below PickupList)
      */
      const time = "99"
      console.log("showList Data: %o", Data)
      //
      // Clear old list
      //
      const pickupList = $("#PickupList")
      pickupList.empty()
      pickupList.append("<div id='PickupContents'></div>")
      //
      // Navbar
      //
      let _nav = `<div style='float:right; width: 100%; display: block; position: absolute; top: 0;'>
        <button onClick='utility.printPickup()'>Print</button>
        </div><span id="pickupDetailsClose" class="popupCloseButtonSmall MobileButton">X</span><P>`
      $("#PickupContents").append(_nav)
      $("#PickupContents")
        .find("#pickupDetailsClose")
        .click(function () {
          $("#PickupList").hide()
        })

      // ----------------------------------------------------------------------------------------------------------------------------------
      // Pickup Manifest (sortable) (loop over the Data)
      // ----------------------------------------------------------------------------------------------------------------------------------
      if (!!Data.pickups && Data.pickups.length > 0) {
        let data = Data.pickups
        //
        // Sortable PickupManifest
        //
        $("#" + RoundID).append(
          "<div id='" +
            PickupManifest +
            "' data-time='" +
            time +
            "' data-round='" +
            RoundID +
            "' class='PickupManifest'></div>"
        )
        $("#" + PickupManifest).append(
          `<ul id="sortable1" class="PickupSprite droptrue">
              <span class="pax"></span>
              <span class="title" data-vehicle="1">Van1</span>
            </ul>`
        )
        //
        // Each Pickup
        //
        data.forEach((orderNumber) => {
          // In Manifest getPickupList() looking at how the data is formed and looking to include the pickup data
          // so we don't have to dig it back up here. ***

          $("#sortable1").append(
            `<li id="Stop${orderNumber}" class="ui-state-default stop"></span>
                ${orderNumber}
                <br>
                <span class='click_area' style='font-size:x-small'></span>
                </li>`
          )
          $("#Stop" + orderNumber).data("data", stop)
        })
        //
        // Two other sortable lists (Van2 and "Other")
        //
        $("#" + PickupManifest).append(
          '<ul id="sortable2' +
            time +
            '" class="PickupSprite droptrue"><span class="pax"></span><span class="title" data-vehicle="2">Van2</span></ul>'
        )
        $("#" + PickupManifest).append(
          '<ul id="sortable3' +
            time +
            '" class="PickupSprite droptrue"><span class="pax"></span><span class="title" data-vehicle="3">Other</span></ul>'
        )
        //
        // Link the sortables
        //
        $("ul.droptrue").sortable({
          connectWith: "ul",
        })
        //
        $("ul.dropfalse").sortable({
          connectWith: "ul",
          dropOnEmpty: false,
        })
        // --------------------------------------------------------------
        // Name Dropdowns (show by default)
        // --------------------------------------------------------------
        //
        $(
          "#sortable1" +
            " .click_area, #sortable2" +
            " .click_area, #sortable3" +
            " .click_area"
        ).each(function () {
          //
          // Show/Hide details
          //

          let _stop = $(this).parent().data("data")

          let details = "<div></div>"

          $(this).append(details)

          if (!!_stop) {
            if (!!_stop.tripCell) {
              let _col = _stop.tripCell.slice(-1)
              let _reg = $("#ac" + _col)
                .text()
                .slice(0, 3)
              let _regLine = _reg + " <br> "
              $(this).append(_regLine)
            }
            let _pax = []
            for (let p in _stop.pax) {
              _pax.push(_stop.pax[p].firstName + " " + _stop.pax[p].lastName)
            }
            $(this).append(_pax.join("<BR>"))
            $(this).data("visible", 1)
          }
        })

        $("#sortable1" + ", #sortable2" + ", #sortable3").droppable({
          accept: ".ui-state-default",
          //drop: handleDropEvent,
        })
      }

      // ----------------------------------------------------------------------------------------------------------------------------------
      pickupList.show()
    }
  }
</script>
