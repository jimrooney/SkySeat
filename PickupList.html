<style>
  .container {
    background-color: #333;
    padding: 1rem;
    margin-top: 1rem;
  }
  .draggable {
    background-color: white;
    padding: 1rem;
    border: 1px solid black;
    cursor: move;
  }
  .draggable.dragging {
    opacity: 0.5;
  }
</style>

<script>
  class PickupList {
    constructor($this) {
      let _this = this
      this.$this = $this // jQuery selector passed in
      $this.data("object", this)
    }
    get$PickupList(args) {
      console.log("args: ", args)
      const pickupList = args.pickupList
      pickupList.pickups = [...new Set(pickupList.pickups)]

      this.clear()
      const contents = $("<div class='PickupContents container'></div>")
        .append(
          $(`<span class="popupCloseButtonSmall MobileButton">X</span>`).click(
            () => this.$this.hide()
          )
        )
        .append("<div class='container'>Container</div>")

      // --------------------
      // Each Pickup Location
      // --------------------
      pickupList.pickups.forEach((orderNumber) => {
        //
        // Number of pax at pickup location
        //
        const px = pickupList.passengers.filter((pax) =>
          pax.fields.find((f) => f.value == orderNumber)
        )
        const location = px[0].fields.reduce((acc, field) => {
          if (field.label == "pickupLocation") {
            acc = field.value
          }
          return acc
        }, null)

        console.log("PX : ", px)
        console.log("Pickup: ", location)

        const pickupTime = time.getTime(location?.pickupTime)
        const drag = $(`<div>(${px.length}x) ${location?.locationName} ${pickupTime}</div>`)
          .addClass("pickup")
          .addClass("draggable")
          .draggable({
            helper: "clone",
            cursor: "pointer",
          })
          .draggable({
            start: function (event, ui) {
              $(this).draggable("instance").offset.click = {
                left: Math.floor(ui.helper.width() / 2),
                top: Math.floor(ui.helper.height() / 2),
              }
            },
          })
          .draggable("enable")
        contents.append(drag)
      })
      return contents
    }
    clear() {
      this.$this.find(".PickupContents").remove()
    }
    show(args) {
      this.$this.append(this.get$PickupList(args))
      this.$this.show()
    }
    hide() {
      this.$this.hide()
    }
  }
</script>
