<style>
  .container {
    background-color: #333;
    padding: 1rem;
    margin-top: 1rem;
  }
  .draggable {
    background-color: white;
    padding: 1rem;
    border: 1px solid black;
    cursor: move;
  }
  .draggable.dragging {
    opacity: 0.5;
  }
  .Pickup {
    background-color: rgb(100, 201, 122);
  }
  .Dropoff {
    background-color: rgb(139, 152, 206);
  }
</style>

<script>
  class PickupList {
    constructor($this) {
      let _this = this
      this.$this = $this // jQuery selector passed in
      $this.data("object", this)
      this.pickupList
      this.headers = ["Crafter", "HiAce", "Taxi1", "Taxi2"]
    }
    get$PickupList(args) {
      this.pickupList = args.pickupList
      // Clear dupicates
      this.pickupList.pickups = [...new Set(this.pickupList.pickups)]
      this.pickupList.dropoffs = [...new Set(this.pickupList.dropoffs)]
      // Clear $ .PickupContents
      this.clear() // this.$this.find(".PickupContents").remove()
      let contents = $("<div class='PickupContents container'></div>")
        .append(
          $(`<span class="popupCloseButtonSmall MobileButton">X</span>`).click(
            () => this.$this.hide()
          )
        )
        .append("<div class='container'></div>")

      // so it can be called against pickups or dropoffs
      if (this.pickupList.pickups.length > 0) {
        contents = this.buildList(contents, this.pickupList.pickups, "Pickup")
      } else {
        contents = this.buildList(contents, this.pickupList.dropoffs, "Dropoff")
      }
      return contents
    }
    buildList(contents, list, pickdrop) {
      // --------------------
      // Each Pickup Location
      // --------------------
      list.forEach((orderNumber) => {
        //
        // Number of pax at pickup location
        //
        const px = this.pickupList.passengers.filter((pax) =>
          pax.fields.find((f) => f.value == orderNumber)
        )
        const location = px[0].fields.reduce((acc, field) => {
          if (field.label == "pickupLocation") {
            acc = field.value
          }
          return acc
        }, null)

        let pickupTime = time.getTime(location?.pickupTime)
        if (pickupTime == "NaN:NaN") {
          pickupTime = ""
        }
        const loc = location?.locationName || ""

        // Build div and append.
        const drag = $(`<div>(${px.length}x) ${loc} ${pickupTime}</div>`)
          .addClass(pickdrop)
          .addClass("draggable")
          .draggable({
            helper: "clone",
            cursor: "pointer",
          })
          .draggable({
            start: function (event, ui) {
              $(this).draggable("instance").offset.click = {
                left: Math.floor(ui.helper.width() / 2),
                top: Math.floor(ui.helper.height() / 2),
              }
            },
          })
          .draggable("enable")
        contents.append(drag)
      })
      return contents
    }
    clear() {
      this.$this.find(".PickupContents").remove()
    }
    show(args) {
      console.log("PickupList: ", args)
      this.$this.append(this.get$PickupList(args)) // Old V2 pickupList DOM.
      this.$this.show()
      // *** to disable the new stuff, remove the next call...
      this.showList(args.pickupList) // Calling retrofit of V1 pickupList DOM... deletes Old V2 version first
    }
    hide() {
      this.$this.hide()
    }

    showList(pickupData) {
      // pickupData is built in {Manifest}
      // getPickupList({ bookings, date, row }) {
      console.log("showList pickupData: ", pickupData)
      const PickupManifest = "PickupManifest"

      /* PickupContents was the "pickup round" we're on (aka, which hour)
        We're just targetting PickupContents for now as it's the second tier container (just below PickupList)
      */
      //
      // Clear old list
      //
      const pickupList = $("#PickupList")
      pickupList.empty()
      pickupList.append("<div id='PickupContents'></div>")
      //
      // Navbar
      //
      //<button onClick='utility.printPickup()'>Print</button>
      let _nav = `<div style='float:right; width: 100%; display: block; position: absolute; top: 0;'>
        <span class="title"></span>
        </div><span id="pickupDetailsClose" class="popupCloseButtonSmall MobileButton">X</span><P>`
      $(`#PickupContents`).append(_nav)

      $(`#PickupContents`)
        .find("#pickupDetailsClose")
        .click(function () {
          pickupList.hide()
        })

      $(`#PickupContents .title`).text("Pickups")
      pickupList.css("background-color", "green")

      let data = pickupData.pickups
      let _dropoffs = false
      if (data.length < 1) {
        _dropoffs = true
        data = pickupData.dropoffs
        $(`#PickupContents .title`).text("Dropoffs")
        pickupList.css("background-color", "lightgreen")
      }
      // ----------------------------------------------------------------------------------------------------------------------------------
      // Pickup Manifest (sortable) (loop over the Data)
      // ----------------------------------------------------------------------------------------------------------------------------------
      if (data.length > 0) {
        //
        // Sortable PickupManifest
        //
        $("#PickupContents").append(
          `<div id='${PickupManifest}' class='PickupManifest'></div>`
        )
        $("#" + PickupManifest).append(
          `<ul id="sortable1" class="PickupSprite droptrue">
              <span class="pax"></span>
              <span class="title" data-vehicle="1">${this.headers[0]}</span>
            </ul>`
        )
        //
        // Each Pickup
        //
        data.forEach((orderNumber) => {
          //
          // Get Dropoff Location for one way trips (outs/ccf)...
          // Rezdy uses multiple "Drop off address" labels, so we're getting the last one...
          // This will break if they add more "Drop off address" labels in the future.
          //
          const order = pickupData.manifest.getOrder(orderNumber)
          let dropoffAddress
          if (!!order) {
            console.log("Order: ", order)
            const _doff = order.fields?.findLast(
              (f) => (f.label = "Drop off address")
            )
            if (!!_doff.value) {
              dropoffAddress = _doff.value
            }
          }
          // get a list of passengers for this orderNumber (filtering the pickupData by orderNumber)
          const paxList = pickupData.passengers.filter((pax) => {
            const oNum = pax.fields?.find((x) => x.label == "orderNumber")
            return oNum.value == orderNumber
          })
          // Get number of infants (if any)
          const initialValue = 0
          const numInfants = paxList.reduce((accumulator, pax) => {
            const infant = pax.fields.find((x) => x.label.match(/Infant/gi))?.value
            if ((infant === "0" || infant > 0) && infant < 3) {
              accumulator++
            }
            return accumulator
          }, initialValue)
          //          console.log("orderNumber %o pax: %o", orderNumber, paxList)
          // extract location from first pax
          const location = paxList[0].fields.find(
            (f) => f.label == "pickupLocation"
          )
          const locationName = {
            short: location?.value?.locationName || "MissingPickupName",
            detail: "",
          }
          if (!!dropoffAddress && _dropoffs) {
            locationName.short = dropoffAddress
            locationName.detail = ""
          }
          if (!!locationName.short.match(/=/)) {
            const split = locationName.short.split("=")
            locationName.short = split[1]
            locationName.detail = split[0]
          }
          if (!!locationName.short.match(/\(/)) {
            const split = locationName.short.split("(")
            locationName.short = split[0]
            locationName.detail = split[1]
          }
          let time = location?.value?.pickupTime
          if (!!time) {
            time = root.time.getTime(time)
          }
          if (_dropoffs) {
            time = ""
          }
          let _color = ""
          if (numInfants>0){
            _color = "color:red"
          }
          const $line =
            $(`<li id="Stop${orderNumber}" class="ui-state-default stop"></span>
              <span style='${_color}'>(${paxList.length+numInfants})</span> ${time} ${locationName.short} 
                <br>
                </li>`).click(() => {
              $(".click_area").toggle("slow")
            })
          const $clickArea =
            $(`<div class='click_area' style='font-size:x-small;display: none;'>
              <span style='color:darkgrey'>${locationName.detail}</span></div>`)
          paxList.forEach((p) => {
            $clickArea.append(`<div>${p.fullName}</div>`)
          })
          $line.append($clickArea)
          $("#sortable1").append($line)
          $("#Stop" + orderNumber).data("data", stop)
        })
        //
        // Two other sortable lists (Van2 and "Other")
        //
        $("#" + PickupManifest).append(
          `<ul id="sortable2" class="PickupSprite droptrue">
            <span class="pax"></span>
            <span class="title" data-vehicle="2">${this.headers[1]}</span>
          </ul>`
        )
        $("#" + PickupManifest).append(
          `<ul id="sortable3" class="PickupSprite droptrue">
            <span class="pax"></span>
            <span class="title" data-vehicle="3">${this.headers[2]}</span>
          </ul>`
        )
        $("#" + PickupManifest).append(
          `<ul id="sortable4" class="PickupSprite droptrue">
            <span class="pax"></span>
            <span class="title" data-vehicle="4">${this.headers[3]}</span>
          </ul>`
        )
        //
        // Link the sortables
        //
        $("ul.droptrue").sortable({
          connectWith: "ul",
        })
        //
        $("ul.dropfalse").sortable({
          connectWith: "ul",
          dropOnEmpty: false,
        })
        // --------------------------------------------------------------
        // Name Dropdowns (show by default)
        // --------------------------------------------------------------
        //
        $(
          "#sortable1" +
            " .click_area, #sortable2" +
            " .click_area, #sortable3" +
            " .click_area, #sortable4" +
            " .click_area"
        ).each(function () {
          //
          // Show/Hide details
          //

          let _stop = $(this).parent().data("data")

          let details = "<div></div>"

          $(this).append(details)

          if (!!_stop) {
            if (!!_stop.tripCell) {
              let _col = _stop.tripCell.slice(-1)
              let _reg = $("#ac" + _col)
                .text()
                .slice(0, 3)
              let _regLine = _reg + " <br> "
              $(this).append(_regLine)
            }
            let _pax = []
            for (let p in _stop.pax) {
              _pax.push(_stop.pax[p].firstName + " " + _stop.pax[p].lastName)
            }
            $(this).append(_pax.join("<BR>"))
            $(this).data("visible", 1)
          }
        })

        $("#sortable1" + ", #sortable2" + ", #sortable3").droppable({
          accept: ".ui-state-default",
          //drop: handleDropEvent,
        })
      }

      // ----------------------------------------------------------------------------------------------------------------------------------
      pickupList.show()
    }
  }
</script>
