<script>
  // Object for TableCells
  class PlaneCell {
    constructor(board, r, c) {
      let _this = this // reference for inside the click function scope
      this._this = this // keep a reference to this JS object (self reference)
      this.board = board // reference to the instantiating board
      this.id = r + "_" + c
      this.row = r
      this.column = c
      // -------------------------------------------
      // jQuery object
      // -------------------------------------------
      let $this = $("<td />", {
        class: "PlaneCell Row_" + r + " Col_" + c,
        id: this.id,
      }).click(function () {
        _this.selectorPopup($(this))
      })
      $this.css({ position: "relative" })
      // -------------------------------------------
      // Backreference
      // -------------------------------------------
      $this.data("_script", this._this) // Backreference to JS from jQuery object
      this.$this = $this // keep a reference to the jQuery object
    }
    selectorPopup() {
      //
      console.log("PlaneCell Click")
      //
      const $this = this.$this
      const $drop = this.getDrop()
      $this.append($drop)
      $drop.css({ position: "absolute", top: "0px" })
      console.log("ID: %o", this.id)
      //
      const data = this.board.state.getData($this)
      console.log("PlaneCell data: %o", data)

      if (!data.PCF) {
        data.PCF = {
          type: "Plane",
          reg: "LOR",
          pilot: "James",
          fuel: 0,
        }
        this.saveData(data)
      }
    }
    //
    // Plane Dropmenu
    //
    getDrop() {
      /*
            This could be build a lot better... and generic (plane/pilot/etc)
      
      */
      const _this = this.$this
      let _drop = `<span class="dropdown">
        <button id="PlaneDrop" class="dropbtn">Plane</button>
        <div id="myPlaneDropdown" class="dropdown-content"></div></span>`

      let drop = $(`<div />`)
      drop.empty() // clear the old contents
      drop.append(_drop)
      $("#PlaneDrop").click(function () {
        for (let p in PlaneManager.planes.list) {
          let selected = PlaneManager.planes.list[p].reg

          let menu_row = "<div class='changePlane' id='" + selected + "'>" + selected + "</div>"
          drop.append(menu_row)
          /*
          
                selection action here **************************
          
          
          */
          $("#" + selected).click(function () {
            let PCF = _this.data("PCF")
            PCF[0] = selected

            drop.empty()
          })
        }
      })
      return drop
    }
    update() {
      const data = this._this.board.state.getData(this.$this)
      const PCF = data.PCF
      const $this = this.$this

      if (!!PCF) { // quick hack to avoid lack of defaults **********************
        const $content = $(`<div class="CellContent" />`)
        const $pilot = $(`<div class="pilot">${PCF.pilot}</div>`)
        const $plane = $(`<div class="plane">${PCF.reg}</div>`)
        const $fuel = $(`<div class="fuel">${PCF.fuel}</div>`)
        $content.append($plane).append($pilot).append($fuel)

        $this.empty()
        $this.append($content)
      }
    }
    getData() {
      return this.board.state.getData(this.$this) // get the CellData Object from the state object
    }
    saveData(data) {
      this.board.state.addData(this.$this, data)
    }
    setPlaneData(key, val) {
      console.log("Set Plane Data, Key: %o Val: %o", key, val)
      let s = this.getState() // get copy of current State
      let state = JSON.parse(JSON.stringify(s))
      state.PCF[key] = val
      console.log("Set State: %o", state)
      this.setState(state)
    }
    getState() {
      return (state = this.board.state.getData(this.$this)) // get the CellData Object from the state object
    }
  }
</script>
