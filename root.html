<script>
  var root = {
    boards: [],
    standard: {
      weight: {
        adult: 86,
        child: 46,
        infant: 15,
        declared_bonus : 4,
      },
    },
    //trash: new Trash(this),
    // --------------------------------- Load TripCodes ----------------------------------------------
    loadTripCodes: function () {
      google.script.run.withSuccessHandler(gya.onTripCodeLoad).loadTripCodes()
    },
    getBoards: function () {
      return $(".Board").map((i, board) => $(board).data("root"))
    },
    updateBoards : function (){
      this.boards.forEach( board => board.update())
    },
    //
    // Example function, changes all boards to today.
    //
    changeBoards: function () {
      $(".Board").each((i, board) => {
        $(board).data("root").manifest.setDate(new Date())
      })
    },
    makeNewBoard: function () {
      const boardName = "AutoBoard" + root.boards.length
      const lastBoard = root.boards[root.boards.length - 1]
      const lastDate = !!lastBoard ? lastBoard.getDate() : null
      const $this = $("<div />", {
        class: "root NoPrint Board",
        style: "display:inline-block;vertical-align:top;width:2000px;", // Locks manifest width
        id: boardName,
      })
      const _board = new Board($this)
      $this.data("root", _board)
      $("#Boards").append($this)
      _board.writeBoard()
      //
      // Set to next day
      //
      if (!!lastDate) {
        let tomorrow = new Date(lastDate)
        tomorrow.setDate(tomorrow.getDate() + 1)
        _board.setDate(tomorrow)
        _board.load() // Load Rezdy
      }
      this.boards.push(_board)
    },
    removeBoard: function (board) {
      this.boards.forEach((b,i,o) => {
        if (b === board){
          o.splice(i,1)
        }
      })
    },
    //
    // currently calling debug.clear() on Rezdy load (so not to overload this variable)
    //
    debug: {
      logs: [],
      log: function (...msg) {
        const _this = this
        _this.logs.push(msg)
      },
      clear: function () {
        this.logs = []
        return "Logs Cleared"
      },
      show: function () {
        this.logs.forEach(entry => {
          console.log(entry)
        })
        return "[end]"
      },
    },
    getItem(barcode) {
			let ret = ""
      this.boards.forEach((board) => {
				const item = board.manifest.getItem(barcode)
				if (!!item){
					ret = item
				}
      })
			return ret
    },
  }
</script>
