<script>
  // -------------------------------------------------------------------------------
  // This is an object to hold functions to communicate with remote servers (Google)
  // -------------------------------------------------------------------------------
  var Rezdy = {
    // --------------------------------- Load Rezdy ----------------------------------------------
    /*

    We're just checking to see if a date was passed in, and if not, check the date picker.
    Since we're going to have multiple date pickers, we'll want to do something like pass in the "board" object and just interragate it's datepicker.
    Then we can update that board with the return data.

    */
    load: function (Manifest) {
      console.log("Rezdy.load([Manifest])")
      let requestedDate
      if (typeof Manifest == "object") {
        requestedDate = Manifest.getDate()
        if (!!requestedDate) {
          requestedDate = Dates.getNZ(requestedDate)
        } else {
          console.log("No date passed in")
          return
        }
      } else {
        console.log("Rezdy.load: Wrong object")
        return
      }
      console.log("Run Google Script loadRezdy(%o)", requestedDate)
      $(".Manifest_Container .Manifest").css("background-color", "#ccc")
      google.script.run.withSuccessHandler(this.onLoad).withUserObject(Manifest).loadRezdy(requestedDate)
    },
    onLoad: function (json, Manifest) {
      console.log("Rezdy.onLoad( Manifest )")
      utility.alert("Rezdy Loaded", "#ManifestMessages")
      $(".Manifest_Container .Manifest").css("background-color", "#68a167")
      // Remove all old booking objects (need to clear the board and theBoard array as well) ********************************
      $(".BookingSprite").remove()

      let data = JSON.parse(json)
      console.log("JSON Loaded: %o", data)
      // -----------------------
      // Parse Rezdy Data
      //------------------------
      let bookings = Rezdy.parseData(data) // --------------=========== Can't be called with "this".. this is the window object here ==============----------------

      // bookings is now an object, it can't be sorted.
      //
      // Sort bookings by trip time
      //
      // bookings.sort(function(a, b) {
      //   return a.time.localeCompare(b.time) // localCompare is a Javascript function
      // })

      console.log("Parsed Bookings: %o", bookings)
      // ---------------------
      // Show Manifest
      // ---------------------
      Bookings.add(bookings)
      Manifest.json = data.bookings // We don't need to keep the response code meta-data
      Manifest.onLoad(bookings)
    },
    onTripCodeLoad: function (data) {
      console.log("OnTripCodeLoad: %o", data)
      gya.trips = data
      return data
    },
    test: function (obj) {
      console.log("remote test: %o", obj)
    },
    loadTripCodes: function () {
      google.script.run.withSuccessHandler(Rezdy.onTripCodeLoad).loadTripCodes()
    },
    // ========================================== Parse Rezdy Data ==========================================
    parseData: function (data) {
      //
      // An array to store the bookings
      //
      let bookings = {}
      //
      // Translate Rezdy objects into our booking object structure
      //
      for (a in data.bookings) {
        // Check status before continuing
        if (data.bookings[a].status == "CONFIRMED" && data.bookings[a].orderNumber) {
          //
          // -- Skip wrapper data and use "Items" as bookings" --
          //
          let rezdyBookings = data.bookings[a].items
          for (let i in rezdyBookings) {
            let rezdyBooking = rezdyBookings[i]
            let booking = {}
            booking.flight = {} // an object for our data
            //
            // Pull some parent values down into the booking so we don't lose them
            //
            //
            // multiPass is for multiple bookings per order
            //
            let multiPass = ""
            if (i > 0) {
              multiPass = "-" + i
            }
            booking.orderNumber = data.bookings[a].orderNumber + multiPass
            booking.resellerAlias = data.bookings[a].resellerAlias
            booking.bookingName = data.bookings[a].customer.firstName + " " + data.bookings[a].customer.lastName
            //
            // Translate Rezdy Booking to our idea of a booking
            //
            booking.productCode = gya.getCode(rezdyBooking.productCode) // row from TripCodes spreadsheet
            booking.product = booking.productCode[2] || "" // Blank in case missing code in spreadsheet

            // ***********************************************************
            // These should be internal functions, not callouts to utility
            // ***********************************************************
            booking.seats = utility.getPax(rezdyBooking).seats

            if (!booking.seats) {
              booking.seats = 0
            }
            booking.ACI = utility.getPax(rezdyBooking).ACI

            booking.flight.ACI = booking.ACI
            booking.flight.seats = booking.seats

            booking.extras = rezdyBooking.extras

            booking.time = rezdyBooking.startTimeLocal
            booking.endTime = rezdyBooking.endTimeLocal

            booking.flight.date = Dates.getNZ(booking.time)
            booking.flight.ETD = time.getTime(booking.time)

            booking.sourceChannel = rezdyBooking.sourceChannel
            booking.pickupLocation = rezdyBooking.pickupLocation
            booking.internalNotes = data.bookings[a].internalNotes

            // Flatten the list of extras
            let ext = []
            // each extra
            for (let e in booking.extras) {
              // For Each Quantity, push an extra into the ext array
              for (let num = 0; num <= booking.extras[e].quantity; num++) {
                ext.push(booking.extras[e])
              }
            }
            //
            // Parse Pax Data
            //
            let pax = []
            //
            // If ACI returned false, ignore it.
            //
            let sumACI = 0
            if (booking.ACI) {
              sumACI = arrays.sum(booking.ACI, 2)
            }
            //
            // Check Passenger list against ACI *************************************************************
            //
            if (rezdyBooking.participants.length >= sumACI) {
              //
              // Pax List is Good... so use the entered passenger names and details
              //
              for (let p in rezdyBooking.participants) {
                let px = rezdyBooking.participants[p]
                let person = {}
                //
                // Key each individual with the booking order + their number in the pax array
                //
                person.key = booking.orderNumber + "_" + p
                person.paxNumber = p
                person.product = booking.product
                person.productCode = booking.productCode
                person.pickupLocation = booking.pickupLocation
                person.extra = "" // blank so we can just add it to strings without checking
                //
                // Assign Extras to passengers
                // This will invariably give the wrong type of extra to some people (like vegitarian stuff), but it'll be close enough for now *************
                //
                if (ext[p]) {
                  person.extra = ext[p]
                }
                //
                //
                //
                for (let f in px.fields) {
                  if (typeof px.fields[f] !== "undefined") {
                    //
                    // Everyone's an adult unless specified otherwise
                    //
                    person.standardWeight = gya.standard.adult

                    switch (px.fields[f].label) {
                      case "First Name":
                        person.firstName = px.fields[f].value || booking.bookingName + p

                      case "Last Name":
                        person.lastName = px.fields[f].value || ""

                      case "Passenger weight (Please specify units: kg or lbs)":
                        person.weight = px.fields[f].value || ""
                    }
                  }
                }
                if (booking.ACI && p < booking.ACI[0]) {
                } else {
                  person.standardWeight = gya.standard.child
                }
                pax.push(person)
              }
            } else {
              //
              // Generate names from ACI
              //
              for (let p = 0; p < sumACI; p++) {
                // number of ACI
                let person = {}
                //
                // Key each individual with the booking order + their number in the pax array
                //
                person.key = booking.orderNumber + "_" + p
                person.paxNumber = p
                person.firstName = booking.orderNumber + "_" + p
                person.lastName = "[Generated]"
                person.weight = 0
                person.standardWeight = gya.standard.adult
                pax.push(person)
              }
            }

            booking.pax = pax

            // ************************************************************************************************************************

            // Key/Record/Note if something is an "out" of sorts (overnight cruises, etc) and maybe note the out time?

            // ******************************************************************************************************************************************************
            // This might be able to be replaced by looking at the "EndTime" from the booking... but likely still needs to account for the flight duration **********
            booking.offset = gya.getOffset(booking.product) // Get the time (in hours) before the return departure

            // To Array or not to Array, that is the question *****************************************************
            bookings[booking.orderNumber] = booking

            // ************************************************************************************************************************
          }
        }
      }
      return bookings
    },
  }
</script>
