<script>
  // -------------------------------------------------------------------------------
  // This is an object to hold functions to communicate with remote servers (Google)
  // -------------------------------------------------------------------------------
  var Rezdy = {
    // --------------------------------- Load Rezdy ----------------------------------------------
    /*

    We're just checking to see if a date was passed in, and if not, check the date picker.
    Since we're going to have multiple date pickers, we'll want to do something like pass in the "board" object and just interragate it's datepicker.
    Then we can update that board with the return data.

    */
    load: function (Manifest) {
      console.log("Rezdy.load({Manifest})")
      //
      // Date Check (should be a Manifest object)
      //
      let requestedDate
      if (typeof Manifest == "object") {
        requestedDate = Manifest.getDate() // returns a {date} object
      } else {
        console.log("Rezdy.load: Wrong object")
        return
      }
      //
      // Call the google script and pass it the Manifest
      //
      requestedDate.setUTCHours(03)
      requestedDate = requestedDate.toString()

      let endDate = new Date(requestedDate)
      endDate = new Date(endDate.setMonth(endDate.getMonth()+1))
      endDate.setUTCHours(03)
      endDate = endDate.toString()

      console.log("Run Google Script loadRezdy( %o )", requestedDate)
      console.log("startDate %o", requestedDate)
      console.log("endDate %o", endDate)

      $(".Manifest_Container .Manifest").css("background-color", "#ccc")
      google.script.run.withSuccessHandler(this.onLoad).withUserObject(Manifest).loadRezdy(requestedDate,endDate)
    },
    // Passes Google Script XML return back to the Manifest that called the script
    onLoad: function (ret, Manifest) {
      console.log("Rezdy.onLoad()")
      console.log("Requested URL: %o", ret.url)
      console.log("Ret %o",ret)
      Manifest.onLoad(ret.json)
    },
    onTripCodeLoad: function (data) {
      console.log("OnTripCodeLoad: %o", data)
      gya.trips = data
      return data
    },
    test: function (obj) {
      console.log("remote test: %o", obj)
    },
    loadTripCodes: function () {
      google.script.run.withSuccessHandler(Rezdy.onTripCodeLoad).loadTripCodes()
    },
    // ========================================== Parse Rezdy Data ==========================================

    //
    // Takes a JSON object of data and returns a list of Booking objects
    //
    parseData: function (data) {
      let bookings = {}
      //
      for (let a in data.bookings) {
        let order = data.bookings[a]
        // if there's no orderNumber, skip it
        if (!order.orderNumber) {
          continue
        }
        for (let i in order.items){
          let key = order.orderNumber
          if (i>0){
            key = key + "-" + i
          }
          bookings[key] = new Booking(order,i,key)
        }
      }
      return bookings
    },
  }
</script>
