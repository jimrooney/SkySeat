<script>
  Date.prototype.addDays = function (days) {
    let date = new Date(this.valueOf())
    date.setDate(date.getDate() + days)
    return date
  }

  //-------------------------------------------
  // Quick and dirty version:
  //let d1 = new Date(dateList[i][0]);
  //let d2 = new Date(values[v][0]);
  //let same = d1.getTime() === d2.getTime();
  //let notSame = d1.getTime() !== d2.getTime();
  //--------------------------------------------

  var Dates = {
    //
    // **** Maybe move this into Board.html? ****
    //
    initPicker: function ($picker, _board) {
      //
      // DatePicker
      //
      // Set the picker to NZ format (dd/mm/yyyy) and to today's date
      // Then remove focus
      $picker.datepicker({
        dateFormat: "dd/mm/yy",
        firstDay: 1,
        onSelect: function (dateText) {
          _board.handleDatePickerSelect($picker)
          this.blur()
        },
      })
      $picker.datepicker("setDate", "today")
    },
    //
    // Takes a NZ formatted date String and returns a JS Date Object
    // 24/8/2020
    //
    getFromNZ: function (d) {
      d = d.split("/")
      d = d.map(x => parseInt(x))
      return new Date([d[2],d[1]+1,d[0]])
    },
    getFromEuro: function (d) {
      d = d.split("/")
      d = d.map(x => parseInt(x))
      return new Date([d[2],d[1],d[0]])
    },
    getNZ: function (d,short) {
      //if (typeof d === 'undefined') {d = new Date()}
      typeof d === "undefined" ? (d = new Date()) : d.constructor === Date ? d : (d = new Date(d))

      let dd = String(d.getDate()).padStart(2, "0")
      let mm = String(d.getMonth() + 1).padStart(2, "0") //January is 0!
      let yyyy = d.getFullYear()
      let yy = "" + d.getYear()
      yy = yy.substr(1) 

      d = dd + "/" + mm + "/" + yyyy
      if (!!short){
        d = dd + "/" + mm + "/" + yy
      }
      return d
    },
    getUSA: function (d) {
      //if (typeof d === 'undefined') {d = new Date()}
      typeof d === "undefined" ? (d = new Date()) : d.constructor === Date ? d : (d = new Date(d))

      let dd = String(d.getDate()).padStart(2, "0")
      let mm = String(d.getMonth() + 1).padStart(2, "0") //January is 0!
      let yyyy = d.getFullYear()

      d = mm + "/" + dd + "/" + yyyy
      return d
    },
    getJustDate: function (d) {
      // Right now, this is just a copy of getNZ() *************************
      // Convert a date object to a String with just dd/mm/yyyy
      typeof d === "undefined" ? (d = new Date()) : d.constructor === Date ? d : (d = new Date(d))
      let dd = String(d.getDate()).padStart(2, "0")
      let mm = String(d.getMonth() + 1).padStart(2, "0") //January is 0!
      let yyyy = d.getFullYear()
      d = dd + "/" + mm + "/" + yyyy
      return d
    },
    convert: function (d) {
      // Converts the date in d to a date-object. The input can be:
      //   a date object: returned without modification
      //  an array      : Interpreted as [year,month,day]. NOTE: month is 0-11.
      //   a number     : Interpreted as number of milliseconds
      //                  since 1 Jan 1970 (a timestamp)
      //   a string     : Any format supported by the javascript engine, like
      //                  "YYYY/MM/DD", "MM/DD/YYYY", "Jan 31 2009" etc.
      //  an object     : Interpreted as an object with year, month and date
      //                  attributes.  **NOTE** month is 0-11.
      return d.constructor === Date
        ? d
        : d.constructor === Array
        ? new Date(d[0], d[1], d[2])
        : d.constructor === Number
        ? new Date(d)
        : d.constructor === String
        ? new Date(d)
        : typeof d === "object"
        ? new Date(d.year, d.month, d.date)
        : NaN
    },
    compare: function (a, b) {
      // Compare two dates (could be of any type supported by the convert
      // function above) and returns:
      //  -1 : if a < b
      //   0 : if a = b
      //   1 : if a > b
      // NaN : if a or b is an illegal date
      // NOTE: The code inside isFinite does an assignment (=).
      return isFinite((a = this.convert(a).valueOf())) && isFinite((b = this.convert(b).valueOf()))
        ? (a > b) - (a < b)
        : NaN
    },
    inRange: function (d, start, end) {
      // Checks if date in d is between dates in start and end.
      // Returns a boolean or NaN:
      //    true  : if d is between start and end (inclusive)
      //    false : if d is before start or after end
      //    NaN   : if one or more of the dates is illegal.
      // NOTE: The code inside isFinite does an assignment (=).
      return isFinite((d = this.convert(d).valueOf())) &&
        isFinite((start = this.convert(start).valueOf())) &&
        isFinite((end = this.convert(end).valueOf()))
        ? start <= d && d <= end
        : NaN
    },
  }
</script>
