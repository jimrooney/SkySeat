<script>
  //
  // Object to hold the state of the board (Holds the booking ID's in a 2D array mirroring the TableCells)
  //
  class State {
    constructor(Board) {

      this.board = Board
      this.date = this.board.manifest.getDate()
      this.data = {}
    }
    clear() {
      console.log("Cleared State")
      this.data = {}
    }
    add(cell, dragged) {
      let dataKey = dragged.prop("id")
      let cellKey = cell.prop("id")
      if (this.data[cellKey] == undefined){
        this.data[cellKey] = {}
      }
      if (this.data[cellKey][dataKey] == undefined){
        this.data[cellKey][dataKey] = dataKey
      }
      console.log("State: %o",this.data)
    }
    get(cell) {
      return this.data[cell.prop("id")]
    }
    remove(cell,key){
      // Remove a booking from a cell's data
    }
  }
</script>
