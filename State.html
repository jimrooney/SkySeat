<script>
  //
  // Object to hold the state of the board (Holds the booking ID's in a 2D array mirroring the TableCells)
  //
  class State {
    constructor(Board) {
      this.board = Board
      this.date = this.board.manifest.getDate()
      //
      // data is an object that holds booking keys key'd by their keys
      //
      this.data = {}
    }
    clear() {
      console.log("Cleared State")
      this.data = {}
    }
    add(TableCell, $dropped) {
      // ({TableCell},{Booking})
      //
      // add dropped object to TableCell it was dropped onto
      //

      let _dropped = $dropped.prop("_this") // ({TableCell} or {Booking}) JS object attached to the Selector
      let cell_ID = TableCell.prop("id")
      debug.log("_dropped", _dropped)

      /*

      Record into the state the booking orderNumber... partial bookings will have [orderNumber-participantKey] (maybe the barcode?)
      We can also record the TableCell specific details like pax seat numbers and plane details (if not default)


      Only TableCell specific data should get recorded into State (which will be plane/trip data).
      All the booking data can be pulled from the manifest.

*/

      //
      // If a tablecell is dropped, it's multiple bookings *******************
      //
      if (!!_dropped) {
        //
        // If the CellData Object doesn't exist, create it
        //
        if (this.data[cell_ID] == undefined) {
          this.data[cell_ID] = new CellData(cell_ID)
        }
        // Brand the cell (for In/Out/Etc)
        let cellData = this.data[cell_ID]
        cellData.leg = _dropped.getLeg()

        // Adding Data ***********************************
        if (_dropped.constructor.name == "TableCell") {
          debug.log("TableCell Drop")
          debug.log("Bookings", _dropped.getOrders())
          debug.log("getCellDataObject()", _dropped.getCellDataObject())
          _dropped.getOrders().forEach((element) => {
            this.data[cell_ID].add(element)
          })
        } else {
          this.data[cell_ID].add(_dropped)
        }
      }
    }
    getCellDataObject(cell) {
      return this.data[cell.prop("id")]
    }
    remove(cell, key) {
      // Remove a booking from a cell's data
    }
    getState() {
      return this.data
    }
  }
</script>
