<script>
  //
  // Object to hold the state of the board (Holds the booking ID's in a 2D array mirroring the TableCells)
  //
  // =====================================================================================================
  // Always accessed through getters and setters
  // This provides two things... one in case an cell data object doesn't exist, it's created first
  // And functions aren't saved in JSON, so it keeps the save data to a minimum
  // =====================================================================================================
  class State {
    constructor(Board) {
      this.board = Board
      this.date = this.getDate()
      //
      // data is an object that holds booking keys key'd by their keys
      //
      this.data = {}
      this.com = {
        success: (args) => {
          console.log("Load Success")
          utility.alert("Success")
          // if (!!args.json) {
          //   debug.log("JSON: ", JSON.parse(args.json))
          // }
        },
        failure: (err) => {
          console.log("Load Failure: ", err)
        },
      }
    }
    clear() {
      console.log("Cleared State")
      this.data = {}
    }
    getDate() {
      return this.board.manifest.getDate()
    }
    /*
      ************************************************************************************
      This can likely be combined with add(TableCell,$dropped) as the're the same concept.
      Especially since we're saving $CellData, not $TableCell or $PlaneCell
      Adding TableCells just requires different yes/no logic.
      But then, maybe that shouldn't be at the "State" level?
      ************************************************************************************

    */
    //
    // Returns a {CellData} object based on the provided id
    //
    getCell(cell) {
      return this.getData(cell)
    }
    getData($cell) {
      let id = $cell
      if (typeof $cell == "string") {
        id = $cell
      } else {
        if ($cell?.id) {
          id = $cell.id
        } else {
          id = $cell?.prop("id")
        }
      }
      let data = this.data[id]
      if (!data) {
        data = new CellData(id)
      }
      return data
    }
    setData(id, data) {
      console.log("{state}.setData(): %o %o", id, data)
      let cell = this.data[id]
      !cell ? (cell = new CellData(id)) : null
      cell.bookingOrders = data
      this.data[id] = cell
      return cell
    }
    addData($cell, data) {
      let cell_ID = $cell.prop("id")
      if (!this.data[cell_ID]) {
        this.data[cell_ID] = new CellData(cell_ID)
      }
      if (!!data) {
        // also check that data is an object ****************
        this.data[cell_ID] = { ...this.data[cell_ID], ...data }
      }
    }
    getPlanes() {
      const list = Object.values(this.data).filter((entry) => {
        let cellID = entry.cellID
        if (!!cellID) {
          cellID = cellID.split("_")
          if (cellID.length > 0) {
            cellID = cellID[0]
          }
        }
        return cellID == 0
      })
      return list
    }
    getRow(number) {
      // Get each cell {} for the row
      // Returns an [] of {}
      let row = {}
      const planes = this.getPlanes()
      planes.forEach((plane) => {
        let ID = plane.cellID
        if (!!ID) {
          ID = plane.cellID.split("_")
          if (ID.length > 0) {
            const id = number + "_" + ID[1]
            const cell = new CellData(id)
            row[id] = cell
          }
        }
      })
      // iterate over this.data extracting all that match the row number (split the ID on _ )
      number = number.toString()
      const list = Object.values(this.data).filter((entry) => {
        let cellID = entry.cellID
        if (!!cellID) {
          cellID = cellID.split("_")
          if (cellID.length > 0) {
            cellID = cellID[0]
          }
        }
        return cellID == number
      })
      //
      // overwrite empty cells with pax cells
      // the row is the empty plane cells by default... replace with existing data for that cell
      list.forEach((cell) => {
        row[cell.cellID] = cell
      })
      return Object.values(row)
    }
    getPlane(cell) {
      const [r, c] = cell.split("_")
      const key = "0_" + c
      const PCF = this.data[key].PCF
      const plane = planes.getPlane(PCF.reg)
      return plane
    }
    getPlaneFromState(cell) {
      const [r, c] = cell.cellID.split("_")
      const key = "0_" + c
      const PCF = this.data[key].PCF
      const type = planes.getPlane(PCF.reg) || planes.getPlane("GA8") // loads raw plane data from PlaneManager
      type.state = this
      const plane = type.getLoadedPlane(cell)
      plane.cell = cell
      plane._state = this
      return plane
    }
    addPax(pax, cellID, leg) {
      if (!this.data[cellID]) {
        this.data[cellID] = new CellData(cellID)
      }
      !!leg ? (this.data[cellID].leg = leg) : null
      // If Pax Exists, ignore
      const existingPax = this.data[cellID].passengers.find(
        (p) => p.barcode == pax.barcode
      )
      if (!existingPax) {
        this.data[cellID].passengers.push(pax)
      }
      return this.data[cellID].passengers
    }
    savePax(pax, cellID, leg) {
      if (!!pax.length) {
        pax = new Pax(pax)
      }
      const key = this.data[cellID].passengers.findIndex((p) =>
        p.fields.some((f) => f.label == "Barcode" && f.value == pax.barcode)
      )
      if (key > -1) {
        this.data[cellID].passengers[key] = pax
      } else {
        this.addPax(pax, cellID, leg) // if pax doesn't exist, add them... but they should exist.
      }
    }
    getFuel(CellId) {
      // if no fuel set in the cell, look at the planeCell for data ***************
      return this.data[CellId]?.PCF?.fuel
    }
    setFuel(cellId, PCF) {
      if (!!this.data[cellId]) {
        this.data[cellId].PCF = { ...this.data[cellId]?.PCF, ...PCF }
      }
    }
    // -----------------------------------------------------------------------------------------------------
    //
    //
    removeOrder($cell, key) {
      // Remove a booking from a cell's data
      // Removing everything for now... will need different for partial removals *************
      // pass a list of bookings?**********
      // look in remove function ************
      // Will need reference to originating board on multiboard?... might come with context though ********

      delete this.data[$cell.prop("id")]

      // let ret = this.data[$cell.prop("id")].removeOrder()
      // if (ret == 0) {

      //   $cell.data("_script").clear()
      // }
    }
    containsPax(pax) {} //
    getPaxCells(pax, leg) {
      // return a list of [{CellData}] for any cells with that barcode/pax
      let ret = []
      for (const key in this.data) {
        this.data[key].passengers.forEach((p, index) => {
          let px = p
          if (p.constructor.name != "Pax") {
            px = new Pax(p)
          }
          if (pax.barcode === px.barcode && leg == this.data[key].leg) {
            ret.push(key)
          }
        })
      }
      return ret
    }
    //
    // Remove all pax plots based on their barcode
    //
    removeAllBarcode(pax) {
      for (const key in this.data) {
        this.removePax(pax, key)
      }
    }
    //
    // Clear all references to pax
    //
    clearoutPax(paxList) {
      if (!paxList.length) {
        // force array
        paxList = [paxList]
      }
      paxList.forEach((pax) => {
        for (const key in this.data) {
          this.removePax(pax, key)
        }
      })
      this.clearEmpties()
    }
    //
    // Remove single reference of pax
    //
    removePax(pax, key) {
      pax = new Pax(pax)
      this.data[key]?.passengers?.forEach((p, index) => {
        const px = new Pax(p)
        if (pax.barcode == px.barcode) {
          this.data[key].passengers.splice(index, 1)
        }
      })
      this.clearEmpties()
    }
    //
    // Returns a list of all pax with the supplied barcode
    //
    getPax(barcode) {
      let ret
      for (const key in this.data) {
        ret = this.data[key].passengers.find((pax) =>
          pax.fields.find((f) => f.label == "Barcode" && f.value == barcode)
        )
        if (!!ret) {
          break
        }
      }
      return ret
    }
    clearEmpties() {
      for (const key in this.data) {
        let arry = this.data[key].passengers?.filter((n) => n)
        if (!!arry && arry.length < 1 && !this.data[key].PCF) {
          delete this.data[key]
        }
      }
    }
    getState() {
      return this
    }
    load() {
      console.log("{state}.load()")
      const _date = this.getDate().toLocaleString("en-NZ", {
        dateStyle: "medium",
      })

      console.log("Date: %o", _date)
      google.script.run
        .withSuccessHandler(this.onLoad)
        .withUserObject(this)
        .loadState(_date)
    }
    // OnLoad, parse into JSON and update the board
    onLoad(args, _this) {
      console.log("{state}onLoad")
      const _args = JSON.parse(args)
      if (!!_args) {
        const date = _args.shift()
        const st = {}
        _args.forEach((element) => {
          if (!!element) {
            const JS = JSON.parse(element)
            st[JS.cellID] = JS
          }
        })
        _this.data = st
        _this.board.update()
      }
    }
    save() {
      console.log("{state}.save()")
      const _date = this.getDate().toLocaleString("en-NZ", {
        dateStyle: "medium",
      })

      console.log("Date: %o", _date)

      console.log("Data: %o", this.data)

      const sendData = []
      Object.entries(this.data).forEach((entry) => {
        const [key, value] = entry
        sendData.push(JSON.stringify(value))
      })

      console.log("sendData: ", sendData)
      //google.script.run.saveState(_date, this.data)
      google.script.run
        .withSuccessHandler(this.com.success)
        .withFailureHandler(this.com.failure)
        .saveState(_date, sendData)

      //
      // google.script.run.withSuccessHandler(theBoard.timeStamp.saveLocal).saveBoard( dataArry )
      // function saveBoard(_array) { ... in Code.js
      //
      // Can just try calling the root save() function.
    }

    test(args) {
      console.log("Test: ", args)
    }
    //
    // A function to move a pax so the B leg can be handled as well.
    //
    movePax(pax, oldCell, newCell) {
      if (!(pax instanceof Pax)) {
        // force {Pax} object
        pax = new Pax(pax.fields)
      }
      //
      // oldCell sometimes gets passed in as just the CellID (string) so covert to and Object
      //
      if (typeof oldCell == "string") {
        const id = oldCell
        oldCell = this.getCell(oldCell)
        oldCell = JSON.parse(JSON.stringify(oldCell)) // copy by value since this data is about to change
        newCell = this.getCell(newCell)
      }
      if (!!oldCell.id && oldCell.id == newCell.id) {
        this.savePax(pax.fields, oldCell.cellID, oldCell.leg) // same cell, so doesn't matter if you use oldCell or newCell
        return // If it's the same cell, skip everything (they're just changing seats)
      }
      !!newCell.leg ? null : (newCell.leg = oldCell.leg) // if blank, copy .leg to newCell
      // find B legs for A cells, move them if needed
      // (if a B is plotted where it should be, it hasn't been moved yet)
      let plotB = false
      let oldPax = false
      let oldBCell
      if (oldCell.leg == "A") {
        if (!!oldCell.id) {
          // TableCell Drop
          oldBCell = this.getBCell(pax, oldCell)
          // See if the pax is plotted in this B cell
          oldPax = oldBCell.passengers.find((px) => {
            px = new Pax(px) // force {Pax} object so it will have a .barcode
            return px.barcode == pax.barcode
          })
          //
          if (!!oldPax) {
            // plotted (and not moved, remove and replot)
            plotB = true
          }
        } else {
          // Manifest Drop (no cell.id)
          plotB = true
        }
        if (plotB) {
          //  console.log("plotB pax instandceof {Pax}: ", pax instanceof Pax)

          if (!(pax instanceof Pax)) {
            return
          }

          const newBCell = this.getBCell(pax, newCell)

          // First, check if it can be moved (conflicts)... if not, throw an error ***
          // Check for .leg?
          //
          // check if target is branded
          // check new B cell matches
          //
          let conflict = false
          if (
            !!newBCell.leg &&
            !!oldBCell?.leg &&
            oldBCell?.leg != newBCell.leg
          ) {
            conflict = true
          }
          if (!conflict) {
            this.addPax(pax, newBCell.id, "B") // *** Brand the cell... could be done better (rather than passing it in)
            if (!!oldBCell) {
              this.removePax(oldPax, oldBCell.id)
            }
          } else {
            utility.error(
              "In/Out Leg Conflict \nNew: " +
                newBCell.leg +
                " \nOld: " +
                oldBCell?.leg
            )
          }
        }
      }
      !!newCell.leg ? null : (newCell.leg = oldCell.leg) // copy .leg to newCell
      this.addPax(pax, newCell.id, newCell.leg) // explicitly pass in the leg for now *** could just pass in newCell, but Details uses this too
      if (oldCell.id != newCell.id) {
        this.removePax(pax, oldCell.id)
      }
    }
    getBCell(pax, cell) {
      // cell is the current cell
      // this returns the cell where the B leg would normally plot
      //
      // get pax product code
      // get duration based on the code... pass code to gya.getProduct("[codehere]").duration
      // find new cellID by adding the duration to the current cellID
      // return the B cell
      //
      let duration = gya.getProduct(pax.getValue("productCode"))?.Duration
      const row = cell.id?.split("_")[0]
      const col = cell.id?.split("_")[1]
      const newRow = parseInt(row) + parseInt(duration)
      const outID = newRow + "_" + col
      const out = this.getCell(outID)
      return out
    }
  }
</script>
