<script>
  //
  // Object to hold the state of the board (Holds the booking ID's in a 2D array mirroring the TableCells)
  //
  // =====================================================================================================
  // Always accessed through getters and setters
  // This provides two things... one in case an cell data object doesn't exist, it's created first
  // And functions aren't saved in JSON, so it keeps the save data to a minimum
  // =====================================================================================================
  class State {
    constructor(Board) {
      this.board = Board
      this.date = this.getDate()
      //
      // data is an object that holds booking keys key'd by their keys
      //
      this.data = {}
    }
    clear() {
      console.log("Cleared State")
      this.data = {}
    }
    getDate() {
      return this.board.manifest.getDate()
    }
    /*
      ************************************************************************************
      This can likely be combined with add(TableCell,$dropped) as the're the same concept.
      Especially since we're saving $CellData, not $TableCell or $PlaneCell
      Adding TableCells just requires different yes/no logic.
      But then, maybe that shouldn't be at the "State" level?
      ************************************************************************************

    */
    //
    // Returns a {CellData} object based on the provided id
    //
    getData($cell) {
      let id = $cell
      typeof $cell == "string" ? (id = $cell) : (id = $cell.prop("id"))
      let data = this.data[id]
      if (!data) {
        data = new CellData(id)
      }
      return data
    }
    setData(id, data) {
      console.log("{state}.setData(): %o %o", id, data)
      let cell = this.data[id]
      !cell ? (cell = new CellData(id)) : null
      cell.bookingOrders = data
      this.data[id] = cell
      return cell
    }
    addData($cell, data) {
      let cell_ID = $cell.prop("id")
      if (!this.data[cell_ID]) {
        this.data[cell_ID] = new CellData(cell_ID)
      }
      if (!!data) {
        // also check that data is an object ****************
        this.data[cell_ID] = { ...this.data[cell_ID], ...data }
      }
    }
    addOrder(cell_ID, booking) {
      let cell = this.data[cell_ID]

      cell.leg = booking.getLeg()
      let orderNumber = booking.orderNumber
      let product = booking.itemNumber
      let key = orderNumber + "_" + product
      if (!!key && !cell.bookingOrders.includes(key)) {
        cell.bookingOrders.push(key)
      }
      return true
    }
    // -----------------------------------------------------------------------------------------------------
    //
    //
    removeOrder($cell, key) {
      // Remove a booking from a cell's data
      // Removing everything for now... will need different for partial removals *************
      // pass a list of bookings?**********
      // look in remove function ************
      // Will need reference to originating board on multiboard?... might come with context though ********

      delete this.data[$cell.prop("id")]

      // let ret = this.data[$cell.prop("id")].removeOrder()
      // if (ret == 0) {

      //   $cell.data("_script").clear()
      // }
    }
    removePax(paxList) {
      if (!!paxList.length) { // require an array be passed in
        paxList.forEach((pax) => {
          for (const key in this.data) {
            this.data[key].passengers.forEach((p, index) => {
              if (pax.barcode == this.data[key].passengers[index].barcode) {
                this.data[key].passengers.splice(index, 1)
              }
            })
          }
        })
        this.clearEmpties()
        this.board.update()
      }
    }
    clearEmpties() {
      for (const key in this.data) {
        let arry = this.data[key].passengers.filter((n) => n)
        if (arry.length < 1 && !this.data[key].PCF) {
          delete this.data[key]
        }
      }
    }
    getState() {
      return this
    }
    load() {
      console.log("{state}.load()")
      const _date = this.getDate().toLocaleString("en-NZ", { dateStyle: "medium" })

      console.log("Date: %o", _date)
      google.script.run.withSuccessHandler(this.onLoad).withUserObject(this).loadState(_date)
    }
    onLoad(args, _this) {
      const _args = JSON.parse(args)
      const date = _args.shift()
      const st = {}
      _args.forEach((element) => {
        if (!!element) {
          const JS = JSON.parse(element)
          st[JS.cellID] = JS
        }
      })
      _this.data = st

      _this.board.update()
    }
    save() {
      console.log("{state}.save()")
      const _date = this.getDate().toLocaleString("en-NZ", { dateStyle: "medium" })

      console.log("Date: %o", _date)
      google.script.run.saveState(_date, this.data)

      //
      // google.script.run.withSuccessHandler(theBoard.timeStamp.saveLocal).saveBoard( dataArry )
      // function saveBoard(_array) { ... in Code.js
      //
      // Can just try calling the root save() function.
    }
  }
</script>
