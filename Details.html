<script>
  $(() => {
    $("#planeDetailsClose").click(() => {
      $(".planeDetails").hide()
    })
  })
  // ===============================
  // Details Class
  // ===============================
  class Details {
    constructor(root) {
      this.root = root
      this._this = this
      this.setWeightClass = function (className, $selector) {
        className = className.slice(0, 1)
        const ret = {}
        switch (className) {
          case "D":
            ret.txt = "Declared Weights"
            ret.SAD = "Declared"
            ret.class = "declaredWeights"
            break
          case "A":
            ret.txt = "Actual Weights"
            ret.SAD = "Actual"
            ret.class = "actualWeights"
            break
          case "S":
            ret.txt = "Standard Weights"
            ret.SAD = "Standard"
            ret.class = "standardWeights"
            break
        }
        $(".WeightClass").each((index, element) => {
          $(element)
            .removeClass("actualWeights")
            .removeClass("standardWeights")
            .removeClass("declaredWeights")
            .addClass(ret.class)
        })
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt)
        }
        _this.SAD = ret
        return ret
      }
      this.changeWeightClass = function ($selector) {
        let className = "S"
        if (!!this.SAD) {
          className = this.SAD.txt
        }
        className = className.slice(0, 1)
        let ret = {}
        switch (className) {
          case "S":
            ret = this.setWeightClass("Declared", $selector)
            break
          case "D":
            ret = this.setWeightClass("Actual", $selector)
            break
          case "A":
            ret = this.setWeightClass("Standard", $selector)
            break
        }
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt)
        }
        _this.SAD = ret
        return ret
      }
      this.count = 0
      const _this = this
      this.bookings = []
      this.name = "Details"
      //this.SAD = "Declared" // Standard | Declared | Actual
      this.bgColors = {}
      this.colorNumbers = Array.from({ length: 20 }, (_, i) => "hsl(" + (i + 1) + 360 / (i + 1) + ", 50%, 75%)")
      //
      this.Pax = class {
        constructor(parent, pax, _type) {
          if (!pax) {
            return
          }
          const index = parent.count || 0
          parent.count++
          this.name = _type
          this.pax = pax
          const _parent = parent
          const _pax = pax
          const list = `${_type}List` || "PaxList"
          const firstName = pax.firstName
          const weight = pax.weight
          const orderNumber = pax.orderNumber
          const barcode = pax.barcode

          let $pax = $(
            `<div>${firstName}<br><span class="weight" style="font-size:large;">${weight.declared}</span></div>` //<br>${orderNumber}</div>`
          )
            //.data("number", p)
            .data("seat", index)
            .data("booking", orderNumber)
            .data("pax", pax.fields)
            .data("_pax", pax)
            .data("this", this)
            .attr("id", `${_type}${index}`)
            .appendTo(`#${list}`) // This places the object
            .addClass("Pax")
            .addClass(_type)
            .draggable({
              containment: "#detailsDiv",
              stack: `#${list} div`,
              cursor: "move",
              revert: true,
              start: function (evt, ui) {
                this.startPos = ui.helper.position()
              },
              stop: function (event, ui) {
                _parent.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
                let $station = $(this).closest(".station")
                if ($station.length > 0) {
                  ui.helper.position({ of: $station, my: "left top", at: "left top" })
                }
              },
            })
            .click(function (e) {
              if (_parent.SAD.SAD != "Actual") {
                return
              }
              let weight = _pax.weight.actual || _pax.weight.declared
              if (!parseInt(weight) > 0) {
                weight = root.standard.weight.adult
              }
              // Find the midpoint of the sprite
              const margin = 5
              const x = e.pageX - this.offsetLeft
              const y = e.pageY - this.offsetTop - 50
              const h = $(this).outerHeight(true)
              const midpoint = (h + margin) / 2
              const deadzone = 15
              // --------------------------------

              if (y < midpoint - deadzone) {
                const w = weight + 1
                _pax.weight = { actual: w }
              }
              if (y > midpoint + deadzone) {
                const w = weight - 1
                _pax.weight = { actual: w }
              }

              if (!!_pax.weight.actual) {
                $pax.find(".weight").text(_pax.weight.actual)
              }
              _parent.update()
            })

          let hue
          if (parent.bgColors[orderNumber]) {
            hue = parent.bgColors[orderNumber]
          } else {
            hue = parent.colorNumbers.pop()
            parent.bgColors[orderNumber] = hue
          }
          $pax.css("background-color", hue)

          if (!!firstName && firstName.length >= 7) {
            $pax.css("font-size", "8px")
          }
          return $pax
        }
        echo() {
          console.log("I am %o", this.name)
        }
      }
      this._TableCell = ""
      this.airplane // placholder (gets built in reset())

      this.$root = $(`<div  id="Details"  class="detailsDiv NoPrint" />`).append(
        `<div class="MenuBar"><span class="MenuButton MobileButton Print">Print</span><span class="Report" /></div>`
      ).append(`
        <div id="detailsContents" class="WeightClass detailsContents">
          <div id="content" style="width: 100%; overflow: hidden;">
            <div id="Airplane" class="grid-container Airplane"></div>
            <div id="PaxList" class="PaxList"></div>
            <div id="CargoPod" class="CargoPod">POD</div>
          </div>
          <div id="CrewList" class="CrewList"></div>
        </div>`)
      this.$this = this.$root
      this.report = this.$root.find(".Report") // Can probably fix by rebuilding the $()
      const _report = this.report // needed for the click scope
      this.report.click(() => {
        console.log("LoadedClick")
        const loadedPlane = _report.prop("loadedPlane")
        console.log("Loaded Plane: %o", loadedPlane)
        console.log("WB: %o", loadedPlane.getWB())
        _this.seatPax()
      })
      this.PCFSelectorString = `<span class="PCF_Selector" id="PCF_Selector">
          <select class="Plane" name="plane" />
          <select class="Fuel" name="fuel" /> Liters
        </span>`
      this.$PCFSelector = $(this.PCFSelectorString)
      this.$root.find(".MenuBar").prepend(this.$PCFSelector)
      this.$root.data("root", this) // Access this object through $([Selector]).data('root')
      // ---------------------------
      // Print Button
      // ---------------------------
      this.$Print = this.$root.find(".Print")
      this.$Print.click(function () {
        console.log("Print Click")
        LOADSHEET.show(_this._TableCell)
      })
      //
      // ---------------------------
      // Airplane layout <div> Click
      // ---------------------------
      this.$Airplane = this.$root.find(".Airplane")
      this.$Airplane.click(() => {
        // console.log("AirplaneClick")
        // $(".station")
        //   .children()
        //   .each(function (i, child) {
        //     console.log("Child: %o", child)
        //     console.log("Station: %o", $(this).closest(".station").data("seat"))
        //     console.log("Pax: %o", $(this))
        //   })
        // _this.update()
      })
      // ====================
      // Details Close Button
      // ====================
      const $pop = $(`<div id="DetailsClose" class="popupCloseButton right MobileButton">X</div>`)
      const $popLeft = $(`<div id="DetailsClose" class="popupCloseButton left small MobileButton">X</div>`)
      const $SAD = $(`<span class="SAD WeightClass relativeLeft MobileButton"></span>`).click(function () {
        let txt = $(this).text().charAt(0)
        _this.changeWeightClass($(this))
        _this.update()
      })
      const _$root = this.$root
      this.$root.append($pop).append($popLeft)
      this.$root.find(".MenuBar").prepend($SAD)
      $pop.click(() => _$root.hide())
      $popLeft.click(() => _$root.hide())
      return this
    }

    update() {
      const _this = this
      $(".Pax").each(function () {
        const _pax = $(this).data("this").pax
        let weight = ""
        switch (_this.SAD.SAD) {
          case "Declared":
            weight = _pax.weight.declared || ` `
            break
          case "Actual":
            weight = _pax.weight.actual || `<span style="font-size:small;color:grey">${_pax.weight.declared}</span>`
            break
          case "Standard":
            weight = root.standard.weight.adult
            break
        }

        $(this).html(`${_pax.firstName}<br><span class="weight" style="font-size:large;">${weight}</span>`)
      })
      this.getWB()
    }
    //
    // .stations are tagged in their data with seat number ... .data("number", i)
    // numbered 1 - 8 (1=pilot)
    //
    init() {
      let _this = this // used to reference this Details object from within the $body element's function
      $(".station").droppable({
        greedy: true,
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
      $(".PaxList").droppable({
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $(".CrewList").droppable({
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $("body").droppable({
        accept: ".Pax",
        drop: function (e, ui) {
          _this.removePax(e, ui)
          _this.update()
        },
      })
      $(".CargoPod").droppable({
        greedy: true,
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
    }
    removePax(event, ui) {
      //
      // Add baggage removal code here ***
      //
      let $source = $(".PaxList")
      if (ui.draggable.attr("class").includes("Crew")) {
        $source = $(".CrewList")
      }
      let $newPax = ui.draggable.detach()
      if (!!$source) {
        $newPax.appendTo($source)
        return
      }
      $newPax.appendTo($(this))
    }
    reset($TableCell) {
      this.setWeightClass("D")
      $(".SAD").text(this.SAD.txt)
      this.count = 0
      this.airplane = $TableCell.data("_script").getPlane()
      const _this = this
      $("#PaxList").empty()
      $("#CrewList").empty()
      $("#CargoPod").empty()
      //
      // -------------------------
      // Setup Airplane
      // -------------------------
      $("#Airplane").empty()
      // ------------
      // Pilot's seat
      // ------------
      $("<div></div>")
        .data("number", 1)
        .data("seat", 1)
        .attr("id", "SeatNumber1")
        .addClass("SeatNumber1")
        .appendTo("#Airplane")
        .addClass("grid-item")
        .addClass("station")
        .addClass("Seat")
        .addClass("PilotSeat")
        .addClass("Crew")
      // -----
      // Seats
      // -----
      // slice(1) skips the pilot's seat
      let index = 2 // Skipping the Pilot seat and using 1 based counting.
      this.airplane.stations
        .slice(1)
        .filter((el) => el.type.includes("seat") || el.type.includes("placeholder"))
        .forEach((seat) => {
          if (seat.type.includes("placeholder")) {
            $("<div></div>").appendTo("#Airplane").addClass("grid-placeholder")
            //.text("Placeholder")
          } else {
            $("<div></div>")
              .data("number", index)
              .data("seat", index)
              .appendTo("#Airplane")
              .attr("id", "SeatNumber" + index)
              .addClass("SeatNumber" + index)
              .addClass("grid-item")
              .addClass("station")
              .addClass("Seat")
              .addClass("droppedPaxSeat")
            index++
          }
        })
      // -----------
      // Baggage Pod
      // -----------
      // Check to see if the plane has a baggage pod. ***
      // in ZEA's case, add the pod to the WB if attached (need a POD/NOPOD button at the top)
      //
      const podBays = _this.airplane.stations.forEach((station) => {
        if (station.type.includes("podBay")) {
          const $bay = $("<div></div>")
            .appendTo("#CargoPod")
            .addClass("grid-placeholder")
            .addClass("station")
            .addClass("Baggage")
            .data("station", station)
          //.text(station.arm)
          const $selector = $("<select />")
            .appendTo($bay)
            .data("station", station)
            .append(`<option value="0">0</option>`)
          const _station = station
          // Limit the selector by the max limit of the pod bay ********
          for (let i = 10; i <= 500; i += 10) {
            let selected = ""

            if (_station.weight == i.toString()) {
              selected = " selected"
            }

            $selector.append(`<option value="${i}" ${selected}>${i}</option>`)
          }
          $selector.change(function () {
            station.weight = this.value
            _this.update()
          })
        }
      })
    }
    handleDrop(event, ui) {
      const _this = $(this).closest(".detailsDiv").data("root") // This Details Object
      const $root = ui.draggable.closest(".detailsDiv")
      const _root = $root.data("root")
      //
      // this.airplane.stations updates via getWB which searches the .station classes
      //
      let $alreadySeatedPax
      const DroppedStation = ui.draggable.closest(".station") // If dragging from a Station, not the Manifest
      let $newPax = ui.draggable.detach()
      let droppedPaxFields = $newPax.data("pax") // array of Rezdy fields
      let droppedPaxSeat = droppedPaxFields.find((p) => !!p && p.label === "seat")
      let thisSeat = {
        label: "seat",
        value: $(this).data("seat"),
      }
      //
      // Capture old seat
      //
      let oldSeat
      if (!droppedPaxSeat) {
        //
        // If not from a seat, just assign it this one.
        droppedPaxFields.push(thisSeat)
        //
      } else {
        const barcode = droppedPaxFields.find((field) => field.label == "Barcode").value
        const manifestPax = _this._TableCell.board.manifest.getPax(barcode)
        let statePax = _this._TableCell.board.state.getPax(barcode)

        if (!!manifestPax) {
          //
          // Capture it's last seat before assigning it this one.
          oldSeat = JSON.parse(JSON.stringify(droppedPaxSeat))
          manifestPax.fields = manifestPax.fields.filter((x) => x.label != "seat")
          manifestPax.fields.push(thisSeat)
          droppedPaxFields = manifestPax.fields
          statePax.seat = thisSeat.value
        }
      }
      //
      // Pax exists
      //
      if ($(this).children().length > 0) {
        //
        // Swap with any existing seated pax
        //
        // Detach pax from seat
        $alreadySeatedPax = $(this).children(".Pax").detach()
        //
        // == Two pax ==, both seated, swap seats
        //
        if (DroppedStation.length > 0) {
          //
          // Move the existing pax to the old station
          //
          $alreadySeatedPax.appendTo(DroppedStation)
          $alreadySeatedPax.position({ of: DroppedStation, my: "left top", at: "left top" })
          //
          // Remove the source seat field and rebrand with the old seat
          //
          let alreadySeatedPaxFields = $alreadySeatedPax.data("pax")
          //
          // Filter out the current seat
          // Remove seat field
          //
          alreadySeatedPaxFields = alreadySeatedPaxFields.filter((x) => JSON.stringify(x) != JSON.stringify(thisSeat))
          alreadySeatedPaxFields.push(oldSeat)
          //
          // Save
          //
          $alreadySeatedPax.data("pax", alreadySeatedPaxFields)
        } else {
          // ********* Needs to drop back where it came from (Crew to CrewList) ********
          //
          // Dropping onto a seated pax from the Passenger List, take seated pax out of plane and back into Passenger List
          //
          $alreadySeatedPax.appendTo($("#PaxList"))
        }
      }
      _this.assignSeat($(this), $newPax, droppedPaxFields)
      _this.update()
    }
    assignSeat($seat, $pax, droppedPaxFields) {
      // this should take a pax object instead of feilds *******************
      $pax.appendTo($seat)
      $pax.draggable({ revert: false })
      $pax.position({ of: $seat, my: "left top", at: "left top" })
      $pax.data("pax", droppedPaxFields)
      //
      this.update()
    }
    seatPax() {
      $(".Pax").each((index, pax) => {
        const fields = $(pax).data("_pax")
        if (fields.seat > 0) {
          const $assignedSeat = $(`#SeatNumber${fields.seat}`)
          $(pax).detach().appendTo($assignedSeat)
          $(pax).position({
            my: "left top",
            at: "left top",
            of: $assignedSeat,
          })
        }
      })
      this.update()
    }
    getWB() {
      //
      // Loads plane based on Details ".station" classes
      //
      const loadedPlane = this._TableCell.getPlane() // retunrs a loaded airplane object
      const WB = loadedPlane.getWB(this.SAD)
      const report = this.$root.find(".Report")
      const color = WB.cg.balanced ? "blue" : "red"
      //
      // Update the "red/notRed" report bar above the seats
      //
      report.prop("loadedPlane", loadedPlane)
      report.css("background-color", color)
      report.text(`CG: ${WB.rounded.CG} AUW: ${WB.rounded.AUW}`)
      //
      // Return the loadedPlane
      //
      return loadedPlane
    }
    // =============== Workaround for that stupid position bug ========================
    // revert always reverts from an offset from it's previous anchor... when you reattach it to a different node, it "reverts" graphically every time
    // This lets it revert to something close to the new container
    setRevert($obj) {
      $obj.draggable({ revert: true })
    }
    // --------------------------------------
    // Show
    // --------------------------------------
    show($TableCell) {
      //
      // Clear the popup
      //
      this.reset($TableCell)
      //
      //
      //
      let visible = this.$root.css("display") !== "none"
      const _this = this
      //
      // Keep the TableCell object cuz drops lose it.
      //
      this.$TableCell = $TableCell
      this._TableCell = $TableCell.data("_script")
      let _TableCell = this._TableCell
      //
      //
      //
      const passengers = this._TableCell.getPassengers() || []
      let state = this._TableCell.getState() // Returns State {CellData}
      // ====================================
      // -------------- PCF -----------------
      // ====================================
      let $plane = $("> .Plane", this.$PCFSelector)
      let $pilot = $("> .Pilot", this.$PCFSelector)
      let $coPilot = $("> .CoPilot", this.$PCFSelector)
      let $fuel = $("> .Fuel", this.$PCFSelector)

      PlaneManager.planes.data.forEach((plane, i) => {
        if (!!plane.weight) {
          $plane.append(`<option value="${plane.reg}">${plane.reg}</option>`)
        }
      })
      $plane.change(function () {
        _TableCell.setPlaneData("reg", this.value)
        _this.show(_this.$TableCell)
        _this.$this.show()
      })
      $fuel.append(`<option value="0">0</option>`)
      for (let i = 10; i <= 1260; i += 10) {
        $fuel.append(`<option value="${i}">${i}</option>`)
      }
      $fuel.change(function () {
        _TableCell.setPlaneData("fuel", this.value)
        _this.update()
      })
      //      Make Fuel List that's determined by the plane's max fuel ***************

      /*

        Set the values to the data stored in State ***************************

      */
      if (Object.keys(state.PCF).length > 0) {
        if (!!state.PCF.coPilot) {
          $coPilot.val(state.PCF.coPilot)
        } else {
          $coPilot.val("")
        }
        $pilot.val(state.PCF.pilot)
        $fuel.val(state.PCF.fuel)
        $plane.val(state.PCF.reg)
      }

      const _crew = []
      pilots.list.forEach((pilot, i) => {
        _crew.push({
          fields: [
            { label: "Role", value: "PIC" },
            { label: "First Name", value: pilot.first },
            { label: "Last Name", value: pilot.last },
            { label: "Passenger Weight", value: pilot["declared weight"].toString() },
          ],
        })
      })

      // const _crew = [
      //   {
      //     fields: [
      //       { label: "Role", value: "PIC" },
      //       { label: "First Name", value: "Zapps" },
      //       { label: "Last Name", value: "Brannigan" },
      //       { label: "Full Name", value: "Zapp Brannigan" },
      //       { label: "Weight", value: "79" },
      //     ],
      //   },
      //   {
      //     fields: [
      //       { label: "Role", value: "SIC" },
      //       { label: "First Name", value: "Kif" },
      //       { label: "Last Name", value: "Kroker" },
      //       { label: "Full Name", value: "Kif Kroker" },
      //       { label: "Weight", value: "42" },
      //     ],
      //   },
      // ]

      // ===========================================
      // -------------- Crew -----------------
      // ===========================================
      _crew.forEach((crew, index) => {
        const pax = new Pax(crew)
        const firstName = pax.firstName
        const weight = pax.weight
        const $pax = new this.Pax(_this, pax, "Crew")
      })
      // ===========================================
      // -------------- Passengers -----------------
      // ===========================================
      passengers.forEach((p, index) => {
        const pax = new Pax(p, index)
        const firstName = pax.getValue("First Name")
        const weight = pax.weight
        const orderNumber = pax.getValue("orderNumber")
        const barcode = pax.getValue("Barcode")
        const $pax = new this.Pax(this, pax, "Pax")
      })
      //this.seatPax()
      this.init() // initialize jQuery drag/drop code
      if (visible) {
        this.$root.hide()
      } else {
        this.$root.css("width", "800px")
        this.$root.css("heigh", "600px")
        this.$root.show()
      }
      this.seatPax() // load pax into seats if possible (pax might have duplicate seats) ****
    }
  }
</script>
