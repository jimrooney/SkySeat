<script>
  $(() => {
    $("#planeDetailsClose").click(() => {
      $(".planeDetails").hide()
    })
  })
  // ===============================
  // Details Class
  // ===============================
  class Details {
    constructor(root) {
      this.root = root
      this._this = this
      this.state // placeholder
      this.$TableCell // placeholder
      this._TableCell // placeholder

      this.setWeightClass = function (className, $selector) {
        className = className.slice(0, 1)
        const ret = {}
        switch (className) {
          case "D":
            ret.txt = "Declared Weights"
            ret.SAD = "Declared"
            ret.class = "declaredWeights"
            break
          case "A":
            ret.txt = "Actual Weights"
            ret.SAD = "Actual"
            ret.class = "actualWeights"
            break
          case "S":
            ret.txt = "Standard Weights"
            ret.SAD = "Standard"
            ret.class = "standardWeights"
            break
        }
        $(".WeightClass").each((index, element) => {
          $(element)
            .removeClass("actualWeights")
            .removeClass("standardWeights")
            .removeClass("declaredWeights")
            .addClass(ret.class)
        })
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt)
        }
        _this.SAD = ret
        return ret
      }
      this.changeWeightClass = function ($selector) {
        let className = "S"
        if (!!this.SAD) {
          className = this.SAD.txt
        }
        className = className.slice(0, 1)
        let ret = {}
        switch (className) {
          case "S":
            ret = this.setWeightClass("Declared", $selector)
            break
          case "D":
            ret = this.setWeightClass("Actual", $selector)
            break
          case "A":
            ret = this.setWeightClass("Standard", $selector)
            break
        }
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt)
        }
        _this.SAD = ret
        return ret
      }
      this.count = 0
      const _this = this
      this.bookings = []
      this.name = "Details"
      //this.SAD = "Declared" // Standard | Declared | Actual
      this.bgColors = {}
      this.colorNumbers = Array.from(
        { length: 20 },
        (_, i) => "hsl(" + (i + 1) + 360 / (i + 1) + ", 50%, 75%)"
      )
      // ==============================
      // Pax Class
      // ==============================
      this.Pax = class {
        constructor(parent, pax, _type, id) {
          if (!pax) {
            return
          }
          if (pax.fields.some((field) => field.label == "Role")) {
            _type = "Crew"
            id = ""
          }
          const _this = this
          const index = parent.count || 0
          parent.count++
          this.name = _type
          this.pax = pax
          const _parent = parent
          const _pax = pax
          const list = `${_type}List_${id}` || "PaxList"
          const firstName = pax.firstName
          const weight = pax.weight
          const orderNumber = pax.orderNumber
          const barcode = pax.barcode

          let $pax = $(
            `<div>${firstName}<br><span class="weight" style="font-size:large;">${weight.declared}</span></div>` //<br>${orderNumber}</div>`
          )
            //.data("number", p)
            .data("seat", index)
            .data("booking", orderNumber)
            .data("pax", pax.fields)
            .data("_pax", pax)
            .data("this", this)
            .data("list", list)
            .attr("id", `${_type}${index}`)
            .appendTo(`#${list}`) // This places the object
            .addClass("Pax")
            .addClass(_type)
            .draggable({
              containment: "#detailsDiv",
              stack: `#${list} div`,
              cursor: "move",
              revert: true,
              start: function (evt, ui) {
                this.startPos = ui.helper.position()
              },
              stop: function (event, ui) {
                _parent.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
                let $station = $(this).closest(".station")
                if ($station.length > 0) {
                  ui.helper.position({
                    of: $station,
                    my: "left top",
                    at: "left top",
                  })
                }
              },
            })
            .click(function (e) {
              console.log("PaxClick this %o", _this)
              if (_parent.SAD.SAD != "Actual") {
                return
              }
              //
              // set starting weight... order of preference: actual / declared / standard
              //
              let weight = _pax.weight.actual || _pax.weight.declared
              if (!parseInt(weight) > 0) {
                weight = root.standard.weight.adult
              }
              // Find the midpoint of the sprite
              const margin = 5
              const x = e.pageX - this.offsetLeft
              const y = e.pageY - this.offsetTop - 30
              const h = $(this).outerHeight(true)
              const midpoint = (h + margin) / 2
              const deadzone = 10
              // --------------------------------
              if (y < -deadzone) {
                const w = weight + 1
                _pax.weight = { actual: w }
              }
              if (y > deadzone) {
                const w = weight - 1
                _pax.weight = { actual: w }
              }

              if (!!_pax.weight.actual) {
                $pax.find(".weight").text(_pax.weight.actual)
                const pax_ = _parent.state.getPax(_pax.barcode)
                if (
                  pax_.fields.find((f) => f.label == "Acual Weight")?.length ==
                  0
                ) {
                  pax_.fields.push({
                    label: "Actual Weight",
                    value: _pax.weight.actual,
                  })
                }
                debug.log(
                  "Actual Weight",
                  pax_.fields.find((f) => f.label == "Acual Weight")
                )
              }
              _parent.update("Parent Update")
            })

          // Color Pax / Crew Sprites
          if (_type == "Crew") {
            $pax.css("background-color", "rgba(64,64,64,.8)")
          } else {
            let hue
            if (parent.bgColors[orderNumber]) {
              hue = parent.bgColors[orderNumber]
            } else {
              hue = parent.colorNumbers.pop()
              parent.bgColors[orderNumber] = hue
            }
            $pax.css("background-color", hue)
          }

          if (!!firstName && firstName.length >= 7) {
            $pax.css("font-size", "8px")
          }
          return $pax
        }
        echo() {
          console.log("I am %o", this.name)
        }
      }
      this.AirplanePlotter = class {
        constructor(cell, i) {
          this.id = i
          this.cell = cell
          this.parent = _this // {Details}
          this.airplane = _this.state.getPlane(cell.cellID) // Airplane Object based on {state}
          this.airplane.state = cell
          this.$seating = $(
            `<div id="Airplane_${i}" class="grid-container Airplane ${this.airplane.reg}"></div>`
          ).data("_this", this) // backreference
        }
        get$Pod() {
          const $ret = $(
            `<div id="CargoPod_${this.id}" class="CargoPod">Pod_${this.id}</div>`
          )
          this.airplane.stations
            .filter((station) => station.type.includes("podBay"))
            .forEach((station) => {
              const $bay = $("<div></div>")
                .appendTo($ret)
                .addClass("grid-placeholder")
                .addClass("station")
                .addClass("Baggage")
                .data("station", station)
              //.text(station.arm)
              const $selector = $("<select />")
                .appendTo($bay)
                .data("station", station)
                .append(`<option value="0">0</option>`)
              const _station = station
              // Limit the selector by the max limit of the pod bay ********
              for (let i = 10; i <= 500; i += 10) {
                let selected = ""
                if (_station.weight == i.toString()) {
                  selected = " selected"
                }
                $selector.append(
                  `<option value="${i}" ${selected}>${i}</option>`
                )
              }
              $selector.change(function () {
                station.weight = this.value
                _this.update("Selector Change")
              })
            })
          return $ret
        }

        reset() {
          $("#CrewList_").empty()
          this.$seating.empty()
          this.$planePlotter
            .find(".MenuBar")
            .prepend(`<span class="Report Report_${this.id}" />`)
            .prepend(`<span class="Print" />`)
          const $Airplane = this.$seating
          // ------------
          // Pilot's seat
          // ------------
          $("<div></div>")
            .data("number", 1)
            .data("seat", 1)
            .attr("id", "SeatNumber1")
            .addClass("SeatNumber1")
            .addClass("grid-item")
            .addClass("station")
            .addClass("Seat")
            .addClass("PilotSeat")
            .addClass("Crew")
            .appendTo($Airplane)

          // -----
          // Seats
          // -----
          // slice(1) skips the pilot's seat
          let index = 2 // Skipping the Pilot seat and using 1 based counting.
          this.airplane.stations
            .slice(1)
            .filter(
              (el) =>
                el.type.includes("seat") || el.type.includes("placeholder")
            )
            .forEach((seat) => {
              if (seat.type.includes("placeholder")) {
                $("<div></div>")
                  .appendTo("#Airplane")
                  .addClass("grid-placeholder")
                //.text("Placeholder")
              } else {
                $("<div></div>")
                  .data("number", index)
                  .data("seat", index)
                  .attr("id", "SeatNumber" + index)
                  .addClass("SeatNumber" + index)
                  .addClass("grid-item")
                  .addClass("station")
                  .addClass("Seat")
                  .addClass("droppedPaxSeat")
                  .appendTo($Airplane)
                index++
              }
            })
          this.$planePlotter.css({
            background: utility.hexToRgbA(this.airplane.regcolor, 0.5),
          })
        }
      }
      this._TableCell = ""
      //this.airplane // placholder (gets built in resetAirplane())
      /*
        Details GUI Object 
      */
      const $S = $("<div />", {
        text: "Save",
        class: "MenuButton MobileButton",
      })
      $S.click(function () {
        console.log("State data:", _this.state.data)
        _this.state.save()
      })
      this.$root = $(
        `<div  id="Details"  class="detailsDiv NoPrint" />`
      ).append($S).append(`
        <div id="CrewList_" class="CrewList" />
        <div id="detailsContents" class="WeightClass detailsContents content" />
        `)
      this.$this = this.$root
      this.PCFSelectorString = `<span class="PCF_Selector" id="PCF_Selector">
          <select class="Plane" name="plane" />
          <select class="Fuel" name="fuel" /> Liters
        </span>`
      this.$root.data("root", this) // Access this object through $([Selector]).data('root')
      // ====================
      // Details Close Button
      // ====================
      this.close = function (_this) {
        _this.$root.hide()
        _this.root.updateBoards()
      }
      const $pop = $(
        `<div id="DetailsClose" class="popupCloseButton right MobileButton">X</div>`
      )
      const $popLeft = $(
        `<div id="DetailsClose" class="popupCloseButton left small MobileButton">X</div>`
      )
      this.$root.append($pop).append($popLeft)
      $pop.click(() => _this.close(_this))
      $popLeft.click(() => _this.close(_this))

      return this
    }
    // ============================================================================
    // Update
    // ============================================================================
    update(ARGS) {
      console.log("\nUpdate(%o)",ARGS)
      const _this = this
      $(".SAD").text(this.SAD.txt) // syncs all SAD buttons
      // Reflect PAX weights as per SAD
      $(".Pax").each(function () {
        const _pax = $(this).data("this").pax
        let weight = ""
        switch (_this.SAD.SAD) {
          case "Declared":
            weight = _pax.weight.declared || ` `
            break
          case "Actual":
            weight =
              _pax.weight.actual ||
              `<span style="font-size:small;color:grey">${_pax.weight.declared}</span>`
            break
          case "Standard":
            weight = root.standard.weight.adult
            break
        }
        $(this).html(
          `${_pax.firstName}<br><span class="weight" style="font-size:large;">${weight}</span>`
        )
      })
      //
      // Update WB reports
      //
      const _row = this.state.getRow(this._TableCell.row)
      const WBPlanes = []
      const _WB = []
      const loadedPlanes = []
      _row.forEach((CellData, i) => {
        //
        // Load Fuel
        //
        const plane = _this.state.getPlaneFromState(CellData)
        const loadedPlane = plane.getLoadedPlane(CellData)
        // get the PCF selector
        // Set it to match the {state} data (or standard fuel if no state fuel)
        const $PCF_Selector = $(`#AirplanePlotter_${i}`).find(".PCF_Selector")
        const $selectedFuel = $(`#AirplanePlotter_${i}`)
          .find(".PCF_Selector :selected")
          .text()
        const WB = loadedPlane.getWB({...this.SAD,...CellData})

        if (WB.POB.length > 0){
          console.log("WB: ", WB)
        }
        const report = $(`.Report_${i}`)
        const color = WB.cg.balanced ? "green" : "red"
        //
        // Update the "red/notRed" report bar above the seats
        //
        report.css("background-color", color)
        report.text(`CG: ${WB.rounded.CG} AUW: ${WB.rounded.AUW}`)
      })
    }
    // ============================================================================
    // End Update
    // ============================================================================
    //
    // .stations are tagged in their data with seat number ... .data("number", i)
    // numbered 1 - 8 (1=pilot)
    //
    // ============================================================================
    // Init
    // ============================================================================
    init() {
      let _this = this // used to reference this Details object from within the $body element's function
      $(".station").droppable({
        greedy: true,
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
      $(".PaxList").droppable({
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handlePaxListDrop,
      })
      $(".CrewList").droppable({
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $("body").droppable({
        accept: ".Pax",
        drop: function (e, ui) {
          _this.removePax(e, ui)
          _this.update("body.droppable")
        },
      })
      $(".CargoPod").droppable({
        greedy: true,
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
    }
    // ============================================================================
    // End Init
    // ============================================================================
    removePax(event, ui) {
      return // ****
      //
      // Add baggage removal code here ***
      //
      const list = ui.draggable.data("list")
      let $source = $(`#${list}`)
      ui.draggable.data("_pax").seat = null // Remove old seat value (so pax doesn't get plotted)

      if (ui.draggable.attr("class").includes("Crew")) {
        $source = $(".CrewList")
      }
      let $newPax = ui.draggable.detach()
      if (!!$source) {
        $newPax.appendTo($source)
        return
      }
      $newPax.appendTo($(this))
    }
    resetAirplane($TableCell) {
      this.setWeightClass("D")
      $(".SAD").text(this.SAD.txt)
      this.count = 0
      //this.airplane = this.state.getPlane($TableCell.data("_script").id)
      const _this = this
      $("#PaxList").empty()
      $("#CrewList").empty()
      $("#CargoPod").empty()
      //
      // -------------------------
      // Setup Airplane
      // -------------------------
      $(".Airplane").data("_this").reset()
      // -----------
      // Baggage Pod
      // -----------
      // Check to see if the plane has a baggage pod. ***
      // in ZEA's case, add the pod to the WB if attached (need a POD/NOPOD button at the top)
      //
    }
    getPax(droppedPaxFields) {
      // Maybe incorperate this into the manifext.getPax() method?
      const barcode = droppedPaxFields.find(
        (field) => field.label == "Barcode"
      ).value
      let pax = this._TableCell.board.manifest.getPax(barcode)
      if (!pax) {
        // crew
        pax = new Pax(droppedPaxFields)
      }
      return pax
    }
    // ============================
    // Dropped on the Pen (PaxList)
    // ============================
    handlePaxListDrop(even, ui) {
      // console.log("Dropped on Pen $(this): ", $(this))
      // console.log("Paxlist: ", $(this).prop("id"))

      const _this = $(this).closest(".detailsDiv").data("root") // This Details Object
      const cellID = $(this).data("cell").cellID

      const $droppedAirplanePlotter = ui.draggable.closest(".AirplanePlotter") // $droppedAirplanePlotter.data("cell")
      //console.log("droppedAirplanePlotter: ", $droppedAirplanePlotter.prop("id"))

      // const oldID = ui.draggable.data("cell")
      // console.log("OldID: ", ui.draggable)
      /*

      Since we've moved $droppedAirplanePlotter above the detach() method,
      {state}.movePax() no longer skip-returns because oldCell is no longer null (the null check used to just return)
      The next idea is now to flag the movePax() maybe by passing in a variable? so it knows that it was called
      by a pen drop... then it can clean up the {state} and skip-return so the sprite puts itself into the pen.

      */

      let $newPax = ui.draggable.detach()
      let fields = $newPax.data("pax") // array of Rezdy fields

      // const $thisAirplanePlotter = $(this).closest(".AirplanePlotter")
      // console.log("thisAirplanePlotter: ", $thisAirplanePlotter.prop("id"))

      const oldCellID = $droppedAirplanePlotter.data("cell")?.cellID
      const barcode = fields.find((field) => field.label == "Barcode").value
      let statePax = _this._TableCell.board.state.getPax(barcode)
      statePax.fields = fields.filter((x) => x.label != "seat") // remove seat

      // save the pax with no seat (incase the movePax skips )
      // Keeps them in the same pen, but the "movePax" method below should handle the swap to the new pen.
      _this._TableCell.board.state.savePax(statePax, oldCellID)
      _this.state.movePax(statePax, oldCellID, cellID)
      $newPax.appendTo($(this))
    }
    handleDrop(event, ui) {
      const $seat = $(this) // The jQuery seat (that's handling the drop)
      const _this = $seat.closest(".detailsDiv").data("root") // This Details Object
      //
      const $droppedAirplanePlotter = ui.draggable.closest(".AirplanePlotter") // $droppedAirplanePlotter.data("cell")
      const $thisAirplanePlotter = $seat.closest(".AirplanePlotter")
      //
      const oldCellID = $droppedAirplanePlotter.data("cell")?.cellID // Dropped from cell's id
      const newCellID = $thisAirplanePlotter.data("cell")?.cellID // This cell's id

      const occupiedFields = $seat.children(".Pax").data("pax") // undefined if seat's empty
      const droppedFields = ui.draggable.data("pax")

      if (!!occupiedFields) {
        utility.alert("Seat's Occupied")
        //
        // Capture old seat and save both swapped
        const $droppedUI = ui.draggable.detach()
        const droppedPaxSeat = $droppedUI
          .data("pax")
          .find((p) => !!p && p.label === "seat")
        const existingPax = new Pax(occupiedFields)
        existingPax.setSeat(droppedPaxSeat.value) // assign the dropped pax seat to the existing pax
        _this.state.movePax(
          existingPax,
          _this.state.getCell(oldCellID),
          _this.state.getCell(newCellID)
        ) // Save
      }

      let newPax = new Pax(droppedFields)
      newPax.setSeat($seat.data("seat")) // assign the accepting seat to the dropped pax
      //
      _this.state.movePax(
        newPax,
        _this.state.getCell(oldCellID),
        _this.state.getCell(newCellID)
      )
      _this.show(_this.$TableCell, true)
    }

    assignSeat($seat, $pax, droppedPaxFields) {
      $pax.appendTo($seat)
      $pax.draggable({ revert: false })
      $pax.position({ of: $seat, my: "left top", at: "left top" })
      $pax.data("pax", droppedPaxFields)
    }
    seatPax($pax, $plane) {
      //
      // check to make sure the assigned seat is within the number of available seats before assigning
      //
      const pax = $pax.data("_pax")
      const plane = $plane.data("airplanePlotter").airplane
      const seats = plane.stations.filter((s) =>
        s.type.some((t) => t == "seat")
      ).length
      if (pax.seat > 0 && pax.seat <= seats) {
        const $assignedSeat = $plane.find(`.SeatNumber${pax.seat}`)
        if (!!$assignedSeat) {
          $pax.detach().appendTo($assignedSeat)
          $pax.position({
            my: "left top",
            at: "left top",
            of: $assignedSeat,
          })
        }
      }
    }
    // =============== Workaround for that stupid position bug ========================
    // revert always reverts from an offset from it's previous anchor... when you reattach it to a different node, it "reverts" graphically every time
    // This lets it revert to something close to the new container
    setRevert($obj) {
      $obj.draggable({ revert: true })
    }
    //
    // ======================================
    // Show
    // ======================================
    //
    //  [This is the first function called]
    //
    // --------------------------------------
    show($TableCell, notInitial) {
      this.$this.show()
      this.$root.find(".content").empty() // Clear the Details popup (removes the old planes)
      this.setWeightClass("D") // Set the initial SAD to Declared
      //
      const _this = this
      const visible = this.$root.css("display") !== "none"
      // Store the clicked cell
      this.$TableCell = $TableCell
      this._TableCell = $TableCell.data("_script")
      this.state = this._TableCell.board.state
      // Get the entire row
      let _row = this.state.getRow(this._TableCell.row) // [CellData,CellData,CellData]
      _row = _row.sort((a, b) => {
        return a.cellID.split("_")[1] - b.cellID.split("_")[1]
      })
      //
      // =========================================================================================
      // Each Plane
      // =========================================================================================
      // Each of these will be a different plane (and have it's own PCF)
      //
      //      console.log("Details.show() row: ", _row)
      _row.some((cell, i) => {
        // why some? ***


        // ======================================
        // New this.Airplane
        // ======================================
        const airplanePlotter = new _this.AirplanePlotter(cell, i) // backlink is in data.this
        const $plane = $(`<div />`, {
          id: `AirplanePlotter_${i}`,
          class: "AirplanePlotter",
        })
          .data("airplanePlotter", airplanePlotter) // Backreference to JS {plane} object
          .data("cell", cell) // Backreference to which calendar cell it's plotting
          .append(airplanePlotter.$seating)
          .append(
            $(`<span />`, {
              id: `PaxList_${i}`,
              class: "PaxList",
            }).data("cell", cell)
          )
          .append(airplanePlotter.get$Pod())
          .append(`</span><span class="SpacerPod"></span>`)
        $plane.prepend(
          $(`<div class="MenuBar"></div>`).prepend($(this.PCFSelectorString))
        )
        $plane
          .find(".PaxList")
          .css("background", utility.hexToRgbA(airplanePlotter.airplane.regcolor, 0.5))
          
          // $plane
          // .find(".PCF_Selector :selected")
          // .text()


        $plane.click(() => {
          const ARGS = {
            SAD: _this.SAD,
            CellData: cell,
            liters: airplanePlotter.airplane.getFuelQuantity(cell),
            airplane: airplanePlotter.airplane
          }
          console.log("Airplane Click")
          console.log("ARGS: ", ARGS)
          console.log("getFuel: ", airplanePlotter.airplane.getFuelQuantity(cell))
          console.log("WB: ", airplanePlotter.airplane.getWB(ARGS))
        })
        // ---------------------------
        // Print Button
        // ---------------------------
        const $Print = $("<div />", {
          text: "P",
          class: "MenuButton MobileButton Print",
        })
        $Print.click(function () {
          console.log("\nPrint Click (cellID: %o)", cell.cellID) // correct ID (no other data than ID)

          console.log("airplanePlotter: ", airplanePlotter)
          const ARGS = {
            SAD: _this.SAD,
            CellData: cell,
            liters: airplanePlotter.airplane.getFuelQuantity(cell)
          }
          console.log("Print WB: ", airplanePlotter.airplane.getWB(ARGS)) // need to add ARGS to getWB()

          const WB = airplanePlotter.airplane.getWB(ARGS)
          LOADSHEET.show(_this._TableCell, airplanePlotter.airplane, WB)
        })
        // ---------------------------
        // State Button
        // ---------------------------
        const $State = $("<div />", {
          text: "State",
          class: "MenuButton MobileButton",
        })
        $State.click(function () {
          console.log("State data:", _this.state.data)
