<script>
  $(function () {
    $("#planeDetailsClose").click(function () {
      $(".planeDetails").hide()
    })
  })
  // ===============================
  // Details Class
  // ===============================
  class Details {
    constructor() {
      this._this = this
      this.bookings = []

      this.$root = $(`<div id="Details" class="detailsDiv">
        <div class="Print">Print</div>
        <div class="Report" />
        <div id="detailsContents">
          <div id="content" style="width: 100%; overflow: hidden;">
            <div id="Airplane" class="grid-container Airplane"></div>
            <div id="PassengerList" class="PassengerList"></div>
          </div>
        </div>
      </div>`)
      this.$this = this.$root
      this.PCFSelectorString = `<div class="PCF_Selector" id="PCF_Selector">
          <select class="Plane" name="plane" />
          <select class="Pilot" name="pilot" />
          <select class="CoPilot" name="copilot" />
          <select class="Fuel" name="fuel" />
        </div>`
      this.$PCFSelector = $(this.PCFSelectorString)
      this.$root.prepend(this.$PCFSelector)
      //
      this.$root.data("root", this) // Access this object through $([Selector]).data('root')
      //
      // ---------------------------
      // Airplane layout <div> Click
      // ---------------------------
      //this.$Airplane = this.$root.find(".Airplane")
      this.$Airplane = $("> .Airplane", this)
      this.$Airplane.click(function () {
        // console.log("Airplane Click")
        // console.log("Airplane: %o",this)
        $(".station")
          .children()
          .each(function (i, child) {
            console.log("Child: %o", child)
            console.log("Station: %o", $(this).closest(".station").data("seat"))
            console.log("Pax: %o", $(this))
          })
      })
      // ====================
      // Details Close Button
      // ====================
      let $pop = $(`<div id="DetailsClose" class="popupCloseButton">X</div>`)
      let _$root = this.$root
      this.$root.append($pop)
      $pop.click(function () {
        _$root.hide()
        console.log("closing details")
      })
      return this.$root
    }
    //
    // .stations are tagged in their data with seat number ... .data("number", i)
    // numbered 1 - 8 (1=pilot)
    //
    init() {
      let _this = this // used to reference this Details object from within the $body element's function
      $(".station").droppable({
        greedy: true,
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
      $(".PassengerList").droppable({
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $("body").droppable({
        accept: ".Pax",
        drop: function (e, ui) {
          _this.removePax(e, ui, $(".PassengerList"))
        },
      })
    }
    removePax(event, ui, $source) {
      let $DropPax = ui.draggable.detach()
      if (!!$source) {
        $DropPax.appendTo($source)
        return
      }
      $DropPax.appendTo($(this))
    }
    reset($TableCell) {
      this.$PCFSelector.remove()
      this.$PCFSelector = $(this.PCFSelectorString)
      this.$root.prepend(this.$PCFSelector)

      $("#PassengerList").html("") // will be able to be removed since we'll just plot all pax in seats (don't need a populated pax list... maybe a holding pen though)
      //
      // *************************************************************
      // Tweak for different plane types
      // *************************************************************
      //
      // Setup type
      // We'll need to clear this jQuery object with each plane loaded.. *******************
      $("#Airplane").empty()
      let airplane = $TableCell.data("_script").getPlane()

      $("<div></div>")
        .data("number", 1)
        .data("seat", 1)
        .appendTo("#Airplane")
        .addClass("grid-item")
        .addClass("station")
        .addClass("PilotSeat")
        .addClass("Crew")

      // *** change to reflect any plane *********************************************
      // probably need to add .click() here. ********************

      let seats = airplane.stations.filter((el) => el.type.includes("seat"))
      console.log("New Array %o", seats)

      for (var i = 2; i <= seats.length; i++) {
        $("<div></div>")
          .data("number", i)
          .data("seat", i)
          .appendTo("#Airplane")
          .addClass("grid-item")
          .addClass("station")
          .addClass("PaxSeat")
      }
    }
    handleDrop(event, ui) {
      let _this = $(this).closest(".detailsDiv").data("root") // This Details Object
      let $root = ui.draggable.closest(".detailsDiv")
      let _root = $root.data("root")
      //
      let existingPax
      let DragParent = ui.draggable.closest(".station") // If dragging from a Station, not the Manifest
      let $DropPax = ui.draggable.detach()
      let droppedPax = $DropPax.data("pax")
      let seatNumber = $(this).data("number")
      //
      // Victory is mine :)
      //
      // **************************************************************************************************
      // Assign sets ... this just keeps adding seat numbers... needs to add maybe objects and overwrite old seat assignments,
      // but it modifiest the source object (by copy, not reference), so it retains the seat assignment.
      // This might need to moce into the "flight" object for state saving
      //
      // **************************************************************************************************

      let _pax = new Pax(droppedPax)
      const paxSeat = _pax.fields.find((p) => p.label === "seat")
      if (!paxSeat) {
        console.log("No Seat")
        let p = {
          label: "seat",
          value: seatNumber,
        }
        droppedPax.push(p)
      } else {
        paxSeat.value = seatNumber
      }
      console.log({ _pax })

      // Swap with any existing seated pax
      if ($(this).children().length > 0) {
        // Detach pax from seat
        existingPax = $(this).children(".Pax").detach()
        // Two pax, both seated, swap seats
        if (DragParent.length > 0) {
          existingPax.appendTo(DragParent)
          existingPax.position({ of: DragParent, my: "left top", at: "left top" })
        } else {
          // Dropping onto a seated pax from the Passenger List, take seated pax out of plane and back into Passenger List
          existingPax.appendTo($("#PassengerList"))
        }
      }
      $DropPax.appendTo($(this))
      $DropPax.draggable({ revert: false })
      $DropPax.position({ of: $(this), my: "left top", at: "left top" })
      //
      //
      //
      _root.getWB()
      //
      //
      //
    }
    getWB() {
      let _wb = this._TableCell.getWB()
      this.$root.find(".Report").text(`CG: ${_wb.roundCG} AUW: ${_wb.AUW}`)
    }
    // =============== Workaround for that stupid position bug ========================
    // revert always reverts from an offset from it's previous anchor... when you reattach it to a different node, it "reverts" graphically every time
    // This lets it revert to something close to the new container
    setRevert($obj) {
      $obj.draggable({ revert: true })
    }
    // --------------------------------------
    // Show
    // --------------------------------------
    show($TableCell) {
      console.log("Details.show()")
      console.log("Cell: %o", $TableCell.prop("id"))
      //
      // Clear the popup
      //
      this.reset($TableCell)
      //
      //
      //
      let visible = this.$root.css("display") !== "none"
      let _this = this
      //
      // Keep the TableCell object cuz drops lose it.
      //
      this.$TableCell = $TableCell
      this._TableCell = $TableCell.data("_script")
      let _TableCell = this._TableCell
      //
      //
      //
      let bookings = this._TableCell.getOrders()
      let state = this._TableCell.getState() // Returns State {CellData}
      console.log("State: %o", state)
      console.log("TableCell bookings: %o", bookings)

      // ====================================
      // -------------- PCF -----------------
      // ====================================
      let $plane = $("> .Plane", this.$PCFSelector)
      let $pilot = $("> .Pilot", this.$PCFSelector)
      let $coPilot = $("> .CoPilot", this.$PCFSelector)
      let $fuel = $("> .Fuel", this.$PCFSelector)

      PlaneManager.planes.data.forEach((plane, i) => {
        if (!!plane.weight)
       { 
         $plane.append(`<option value="${plane.reg}">${plane.reg}</option>`)
         }
      })
      $plane.change(function () {
        _TableCell.setPlaneData("reg", this.value)
        _this.show(_this.$TableCell)
        _this.$this.show()
      })
      pilots.list.forEach((pilot, i) => {
        $pilot.append(`<option value="${pilot.first}">${pilot.first}</option>`)
        $coPilot.append(`<option value="${pilot.first}">${pilot.first}</option>`)
      })
      $pilot.change(function () {
        _TableCell.setPlaneData("pilot", this.value)
      })
      $coPilot.change(function () {
        _TableCell.setPlaneData("copilot", this.value)
      })
      $fuel.append(`<option value="0">0</option>`)
      for (let i = 10; i <= 320; i += 10) {
        $fuel.append(`<option value="${i}">${i}</option>`)
      }
      $fuel.change(function () {
        _TableCell.setPlaneData("fuel", this.value)
      })
      //      Make Fuel List that's determined by the plane's max fuel ***************

      /*

        Set the values to the data stored in State ***************************

      */
      if (Object.keys(state.planeData).length > 0) {
        console.log("PlaneData: %o", state.planeData)
        if (!!state.planeData.coPilot) {
          $coPilot.val(state.planeData.coPilot)
        } else {
          $coPilot.val("")
        }
        $pilot.val(state.planeData.pilot)
        $fuel.val(state.planeData.fuel)
        $plane.val(state.planeData.reg)
      }

      // ===========================================
      // -------------- Passengers -----------------
      // ===========================================

      let bgColors = {}
      let colorNumbers =  Array.from({length: 20}, (_, i) => "hsl(" + (i+1) + 360/(i+1) + ", 50%, 75%)")

      for (let key in bookings) {
        for (let p in bookings[key].item.participants) {
          let pax = new Pax({ fields: bookings[key].item.participants[p].fields })
          let firstName = pax.getFirstName()
          let weight = pax.getWeight()
          let orderNumber = pax.getOrderNumber()

          let $pax = $(
            `<div>${firstName}<br><span style="font-size:large;">${weight}</span>`//<br>${orderNumber}</div>`
          )
            //"<div>" + firstName + " <BR><span style='font-size: large;'>" + pax.getWeight() + "</span></div>"            .data("number", p)
            .data("seat", p)
            .data("booking", key)
            .data("pax", pax.fields)
            .data("_pax", pax)
            .attr("id", "pax" + p)
            .appendTo("#PassengerList") // This places the object... can swap #PassengerList for an assigned seat **********
            .addClass("Pax")
            .draggable({
              containment: "#detailsDiv",
              stack: "#PassengerList div",
              cursor: "move",
              revert: true,
              start: function (evt, ui) {
                this.startPos = ui.helper.position()
              },
              stop: function (event, ui) {
                _this.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
                let $station = $(this).closest(".station")
                if ($station.length > 0) {
                  ui.helper.position({ of: $station, my: "left top", at: "left top" })
                }
              },
            })

            let hue
            if(bgColors[orderNumber]){
              hue = bgColors[orderNumber]
            }
            else{
              hue = colorNumbers.pop()
              bgColors[orderNumber] = hue
            }
            $pax.css("background-color", hue)

          if (firstName.length >= 7) {
            $pax.css("font-size", "8px")
          }

          this.init() // initialize jQuery drag/drop code

          if (visible) {
            this.$root.hide()
          } else {
            this.$root.css("width", "400px")
            this.$root.css("heigh", "600px")
            this.$root.show()
          }
        }
      }
    }
  }
</script>
