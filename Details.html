<script>
  $(() => {
    $("#planeDetailsClose").click(() => {
      $(".planeDetails").hide()
    })
  })
  // ===============================
  // Details Class
  // ===============================
  class Details {
    constructor(root) {
      this.root = root
      this._this = this
      this.state // placeholder
      this.$TableCell // placeholder
      this._TableCell // placeholder

      this.AircraftPlotterClass = class {
        constructor(cell, i) {
          this.id = i
          this.cell = cell
          this.parent = _this // {Details}
          this.airplane = _this.state.getPlane(cell.cellID) // Airplane Object based on {state}
          this.airplane.state = cell
          this.$seating = $(
            `<div id="Airplane_${i}" class="grid-container Airplane ${
              this.airplane.reg
            }"
            style="background:${utility.hexToRgbA(this.airplane.regcolor, 0.9)}"
            ></div>`
          ).data("_this", this) // backreference
        }
        get$Pod() {
          const $ret = $(
            `<div id="CargoPod_${this.id}" class="CargoPod">CargoPod</div>`
          )
          this.airplane.stations
            .filter((station) => station.type.includes("podBay"))
            .forEach((station) => {
              const $bay = $("<div></div>")
                .appendTo($ret)
                .addClass("grid-placeholder")
                .addClass("station")
                .addClass("Baggage")
                .data("station", station)
              //.text(station.arm)
              const $selector = $("<select />")
                .appendTo($bay)
                .data("station", station)
                .append(`<option value="0">0</option>`)
                .click((e) => {
                  e.stopPropagation()
                })
              const _station = station
              // Limit the selector by the max limit of the pod bay ********
              for (let i = 10; i <= 500; i += 10) {
                let selected = ""
                if (_station.weight == i.toString()) {
                  selected = " selected"
                }
                $selector.append(
                  `<option value="${i}" ${selected}>${i}</option>`
                )
              }
              $selector.change(function (e) {
                e.stopPropagation()
                station.weight = this.value
                _this.update("Selector Change")
              })
            })
          return $ret
        }

        reset() {
          $("#CrewList_").empty()
          this.$seating.empty()
          this.$menubarPlotter
            .find(".MenuBar")
            .prepend(`<span class="Report Report_${this.id}" />`)
            .prepend(`<span class="Print" />`)
          const $Airplane = this.$seating
          // ------------
          // Pilot's seat
          // ------------
          $("<div>Pilot</div>")
            .data("number", 1)
            .data("seat", 1)
            .attr("id", "SeatNumber1")
            .addClass("SeatNumber1")
            .addClass("grid-item")
            .addClass("station")
            .addClass("Seat")
            .addClass("PilotSeat")
            .addClass("Crew")
            .appendTo($Airplane)

          // -------------------------------------------------------------------
          // Create Seats
          // -------------------------------------------------------------------
          // slice(1) skips the pilot's seat
          let index = 2 // Skipping the Pilot seat and using 1 based counting.
          this.airplane.stations
            .slice(1)
            .filter(
              (el) =>
                el.type.includes("seat") || el.type.includes("placeholder")
            )
            .forEach((seat) => {
              if (seat.type.includes("placeholder")) {
                $("<div></div>")
                  .data("number", -index)
                  .addClass("grid-placeholder")
                  .addClass("station")
                  .css("background-color",utility.hexToRgbA(this.airplane.regcolor, 0.9))
                  .appendTo($Airplane)
              } else {
                $("<div></div>")
                  .data("number", index)
                  .data("seat", index)
                  .attr("id", "SeatNumber" + index)
                  .addClass("SeatNumber" + index)
                  .addClass("grid-item")
                  .addClass("station")
                  .addClass("Seat")
                  .addClass("droppedPaxSeat")
                  .appendTo($Airplane)
                index++
              }
            })
          this.$menubarPlotter.css({
            background: utility.hexToRgbA(this.airplane.regcolor, 0.5),
          })
        }
      }
      this.setWeightClass = function (className, $selector) {
        className = className.slice(0, 1)
        const ret = {}
        switch (className) {
          case "D":
            ret.txt = "Declared Weights"
            ret.SAD = "Declared"
            ret.class = "declaredWeights"
            break
          case "A":
            ret.txt = "Actual Weights"
            ret.SAD = "Actual"
            ret.class = "actualWeights"
            break
          case "S":
            ret.txt = "Standard Weights"
            ret.SAD = "Standard"
            ret.class = "standardWeights"
            break
        }
        $(".WeightClass").each((index, element) => {
          $(element)
            .removeClass("actualWeights")
            .removeClass("standardWeights")
            .removeClass("declaredWeights")
            .addClass(ret.class)
        })
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt)
        }
        _this.SAD = ret
        return ret
      }
      this.changeWeightClass = function ($selector) {
        let className = "S"
        if (!!this.SAD) {
          className = this.SAD.txt
        }
        className = className.slice(0, 1)
        let ret = {}
        switch (className) {
          case "S":
            ret = this.setWeightClass("Declared", $selector)
            break
          case "D":
            ret = this.setWeightClass("Actual", $selector)
            break
          case "A":
            ret = this.setWeightClass("Standard", $selector)
            break
        }
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt) // Change the display text
        }
        _this.SAD = ret
        return ret
      }
      this.count = 0
      const _this = this
      this.bookings = []
      this.name = "Details"
      //this.SAD = "Declared" // Standard | Declared | Actual
      this.bgColors = {}
      this.colorNumbers = Array.from(
        { length: 20 },
        (_, i) => "hsl(" + (i + 1) + 360 / (i + 1) + ", 50%, 75%)"
      )
      // ==============================
      // Pax Class
      // ==============================
      this.Pax = class {
        constructor(parent, pax, _type, id) {
          if (!pax) {
            return
          }
          if (pax.fields.some((field) => field.label == "Role")) {
            _type = "Crew"
            id = ""
          }
          const _this = this
          const index = parent.count || 0
          parent.count++
          this.name = _type
          this.pax = pax
          const _parent = parent
          const _pax = pax
          const list = `${_type}List_${id}` || "PaxList"
          const firstName = pax.firstName
          const weight = pax.weight
          const orderNumber = pax.orderNumber
          const barcode = pax.barcode

          let $pax = $(
            `<div>${firstName}<br><span class="weight" style="font-size:large;">${weight.declared}</span></div>` //<br>${orderNumber}</div>`
          )
            //.data("number", p)
            .data("seat", index)
            .data("booking", orderNumber)
            .data("pax", pax.fields)
            .data("_pax", pax)
            .data("this", this)
            .data("list", list)
            .attr("id", `${_type}${index}`)
            .appendTo(`#${list}`) // This places the object
            .addClass("Pax")
            .addClass(_type)
            .draggable({
              containment: "#detailsDiv",
              stack: `#${list} div`,
              cursor: "move",
              revert: true,
              start: function (evt, ui) {
                this.startPos = ui.helper.position()
              },
              stop: function (event, ui) {
                _parent.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
                let $station = $(this).closest(".station")
                if ($station.length > 0) {
                  ui.helper.position({
                    of: $station,
                    my: "left top",
                    at: "left top",
                  })
                }
              },
            })
            // --------------------------------
            // Changing Weights
            // --------------------------------
            .click(function (e) {
              e.stopPropagation()
              if (_parent.SAD.SAD != "Actual") {
                //              if ((_parent.SAD.SAD == "Standard")||((_parent.SAD.SAD != "Declared"))) {
                return
              }
              // Block changing Actual weights outside of plane seats (cuz bugs ***)
              if (!_this.pax.fields.find((field) => field.label == "seat")) {
                console.log("no seat")
                return
              }
              //
              // set starting weight... order of preference: actual / declared / standard
              //
              let weight = _pax.weight.actual || _pax.weight.declared
              if (!parseInt(weight)) {
                weight = root.standard.weight.adult // Could figure out if it's a child, but MEH
              }
              //
              // Find the midpoint of the sprite
              //
              const margin = 5
              const x = e.pageX - this.offsetLeft
              const y = e.pageY - this.offsetTop - 30
              const h = $(this).outerHeight(true)
              const midpoint = (h + margin) / 2
              const deadzone = 10

              if (y < -deadzone) {
                const w = weight + 1
                _pax.weight = { actual: w }
              }
              if (y > deadzone) {
                const w = weight - 1
                _pax.weight = { actual: w }
              }

              if (!!_pax.weight.actual) {
                $pax.find(".weight").text(_pax.weight.actual)
                const pax_ = _parent.state.getPax(_pax.barcode)
                if (
                  pax_.fields.find((f) => f.label == "Acual Weight")?.length ==
                  0
                ) {
                  pax_.fields.push({
                    label: "Actual Weight",
                    value: _pax.weight.actual,
                  })
                }
                debug.log(
                  "Actual Weight",
                  pax_.fields.find((f) => f.label == "Acual Weight")
                )
              }
              _parent.update("Parent Update")
            })

          // Color Pax / Crew Sprites
          if (_type == "Crew") {
            $pax.css("background-color", "rgba(64,64,64,.8)")
          } else {
            let hue
            if (parent.bgColors[orderNumber]) {
              hue = parent.bgColors[orderNumber]
            } else {
              hue = parent.colorNumbers.pop()
              parent.bgColors[orderNumber] = hue
            }
            $pax.css("background-color", hue)
          }

          if (!!firstName && firstName.length >= 7) {
            $pax.css("font-size", "8px")
          }
          return $pax
        }
        echo() {
          console.log("I am %o", this.name)
        }
      }
      
      this._TableCell = ""
      //this.airplane // placholder (gets built in resetAirplane())
      /*
        Details GUI Object 
      */
      const $S = $("<div />", {
        text: "Save",
        class: "MenuButton MobileButton SaveButton",
      })
      $S.click(function () {
        console.log("State data:", _this.state.data)
        _this.state.save()
      })
      this.$root = $(
        `<div  id="Details"  class="detailsDiv NoPrint" />`
      ).append($S).append(`
        <div id="CrewList_" class="CrewList" />
        <div id="detailsContents" class="WeightClass detailsContents content" />
        `)
      this.$this = this.$root
      this.PCFSelectorString = `<span class="PCF_Selector" id="PCF_Selector">
          <select class="Plane" name="plane" />
          <select class="Fuel" name="fuel" /> Liters
        </span>`
      this.$root.data("root", this) // Access this object through $([Selector]).data('root')
      // ====================
      // Details Close Button
      // ====================
      this.close = function (_this) {
        _this.$root.hide()
        _this.root.updateBoards()
      }
      const $pop = $(
        `<div id="DetailsClose" class="popupCloseButton right MobileButton">X</div>`
      )
      const $popLeft = $(
        `<div id="DetailsClose" class="popupCloseButton left MobileButton">X</div>`
      )
      this.$root.append($pop).append($popLeft)
      $pop.click(() => _this.close(_this))
      $popLeft.click(() => _this.close(_this))

      return this
    }
    //
    // ======================================
    // Show
    // ======================================
    //
    //  [This is the first function called]
    //
    // --------------------------------------
    show($TableCell, notInitial) {
      this.$this.show()
      this.$root.find(".content").empty() // Clear the Details popup (removes the old planes)
      if (!notInitial) {
        this.setWeightClass("D") // Set the initial SAD to Declared
      } //
      const _this = this
      const visible = this.$root.css("display") !== "none"
      // Store the clicked cell
      this.$TableCell = $TableCell
      this._TableCell = $TableCell.data("_script")
      this.state = this._TableCell.board.state
      const _state = this.state

      // Get the entire row
      let _row = this.state.getRow(this._TableCell.row) // [CellData,CellData,CellData]
      // Sort to ensure the row is ordered correctly
      _row = _row.sort((a, b) => {
        return a.cellID.split("_")[1] - b.cellID.split("_")[1]
      })

      // =========================================================================================
      // Each Plane (loop over the row)
      // =========================================================================================
      // Each of these will be a different plane (and have it's own PCF)
      _row.forEach((cell, i) => {
        // ======================================
        // New this.Airplane
        // ======================================
        const aircraftPlotter = new _this.AircraftPlotterClass(cell, i) // backlink is in data.this
        const $aircraftBackgroundContainer = $(
          `<div class="AircraftPlotterContainer"></div>`
        )
          .append(`<div class="AircraftPlotterBackground" style="color:${utility.hexToRgbA(
          aircraftPlotter.airplane.regcolor,
          0.9
        )}">
          ${aircraftPlotter.airplane.reg}
          </div>`)
        const $menubar = $(`<div />`, {
          id: `AircraftPlotter_${i}`,
          class: "AircraftPlotter",
        })
          .data("aircraftPlotter", aircraftPlotter) // Backreference to JS {plane} object
          .data("cell", cell) // Backreference to which calendar cell it's plotting

          .append(aircraftPlotter.$seating)
          .append(
            $(`<span />`, {
              id: `PaxList_${i}`,
              class: "PaxList",
            }).data("cell", cell)
          )
          .append(aircraftPlotter.get$Pod())
          .append(`</span><span class="SpacerPod"></span>`)

        $menubar
          .prepend(
            $(
              `<div class="MenuBar" style="background-color:${utility.hexToRgbA(
                aircraftPlotter.airplane.regcolor,
                0.8
              )}"></div>`
            ).prepend($(this.PCFSelectorString))
          )
          .prepend($aircraftBackgroundContainer)
        // Color the menubar (reg color)
        $menubar
          .find(".PaxList")
          .css(
            "background",
            utility.hexToRgbA(aircraftPlotter.airplane.regcolor, 0.5)
          )
        // $menubar
        // .find(".PCF_Selector :selected")
        // .text()
        $menubar.click((e) => {
          const data = $menubar.data("cell")
          console.log("State: ", _state)
          const aircraft = _state.getAircraftFromState(data)
          const selectedFuel = $menubar.find(".PCF_Selector :selected").val()
          data.SAD = _this.SAD.SAD.toLowerCase()
          data.liters = selectedFuel
          // ---------------------------
          // Get WB
          // ---------------------------
          const WB = aircraft.calculator.getWB(data)
          console.log("CellData: ", data)
          console.log("Aircraft: ", aircraft)
          console.log("WB: ", WB)
          console.table(WB.aircraft.stations)
          e.stopPropagation()
        })

        // ---------------------------
        // Print Button
        // ---------------------------
        const $Print = $("<div />", {
          text: "Print",
          class: "MenuButton MobileButton Print",
        })
        $Print.click(function () {
          console.log("\nPrint Click (cellID: %o)", cell.cellID) // correct ID (no other data than ID)

          const data = cell
          const aircraft = _state.getAircraftFromState(data)
          const selectedFuel = $menubar.find(".PCF_Selector :selected").val()
          data.SAD = _this.SAD.SAD.toLowerCase()
          data.liters = selectedFuel
          // ---------------------------
          // Get WB
          // ---------------------------
          const WB = aircraft.calculator.getWB(data)

          const validPOBs = WB.POB.every((station) => station.weight > 0)
          console.log("ValidPOBs: ", validPOBs)

          // Missin Weights Check
          if (!validPOBs) {
            utility.alert("Missing Weights", $("#Details"))
            return
          }
          root.loadsheet.show(_this._TableCell, aircraftPlotter.airplane, WB)
        })
        // ---------------------------
        // State Button
        // ---------------------------
        const $Fill = $("<div />", {
          text: "Fill",
          class: "MenuButton MobileButton",
        })
        $Fill.click(function (e) {
          e.stopPropagation()
          _this.fillSeats(cell)
        })

        //
        // SAD Button
        //
        const $SAD = $(
          `<span class="SAD WeightClass relativeLeft MobileButton">SAD</span>`
        ).click(function (e) {
          e.stopPropagation()
          let txt = $(this).text().charAt(0)
          _this.changeWeightClass($(this))
          _this.update("SAD Button")
        })
        $menubar.find(".MenuBar").prepend($SAD)
        aircraftPlotter.$menubarPlotter = $menubar // Backreference ******
        aircraftPlotter.reset()

        //aircraftPlotter.$seating.find(".Print").append($Print) // can use this to put the print button at the top
        aircraftPlotter.$seating.append([$Print, $Fill])
        $menubar.find(`CargoPod_${i}`).append()
        _this.$root.find(".content").append($menubar)

        const passengers = cell.passengers
        const state = this.state // need this cells {CellData}... might be getting {state} ***
        // ===========================================
        // -------------- Passengers -----------------
        // ===========================================
        passengers.forEach((p, index) => {
          const pax = new Pax(p, index)
          const $pax = new this.Pax(_this, pax, "Pax", i) // create pax Sprite
          this.seatPax($pax, $menubar)
        })
        const $PCF = $menubar.find(".PCF_Selector")
        $PCF.empty()
        // ===========================================
        // Fuel Selector
        // ===========================================
        const $selector = $("<select />")
          .appendTo($PCF)
          .append(`<option value="0">0</option>`)
        const fuelCap = aircraftPlotter.airplane.fuel.capacity || 350 // Limit the selector by the max fuel limit
        for (let i = 10; i <= fuelCap; i += 10) {
          $selector.append(`<option value="${i}">${i}</option>`)
        }
        //
        //
        // if the cell has fuel, load that. If not, then use standardFuel.
        // standardFuel is set in the Company Data Spreadsheet
        //
        const fuel =
          cell.PCF?.fuel > -1
            ? cell.PCF.fuel
            : aircraftPlotter.airplane.standardFuel
        $selector.val(fuel) // Sets the dropmenu to the current fuel
        {
          const PCF = { fuel: fuel }
          _this.state.setFuel(cell?.cellID, fuel)
        }
        //

        $selector.change(function () {
          const PCF = { fuel: $(this).val() }
          _this.state.setFuel(cell?.cellID, PCF)
          // console.log("cell ID: %o, PCF: %o", cell?.cellID, PCF)
          // console.log("fuel now: ", _this.state.getFuel(cell?.cellID))
          _this.update("FuelSelector Change")
        })
        $selector.click(function (e) {
          // Stop clicks from triggering Airplane clicks
          return false
        })
        return false
      })
      // =========================================================================================
      // End (Each Plane)
      // =========================================================================================

      // ===========================================
      // -------------- Crew -----------------
      // ===========================================
      const _crew = []
      pilots.list.forEach((pilot, i) => {
        _crew.push({
          fields: [
            { label: "Role", value: "PIC" },
            { label: "First Name", value: pilot.first },
            { label: "Last Name", value: pilot.last },
            { label: "Mobile", value: pilot.mobile },
            {
              label: "Passenger Weight",
              value: pilot["declared weight"].toString(),
            },
          ],
        })
      })
      _crew.forEach((crew, index) => {
        const pax = new Pax(crew)
        const firstName = pax.firstName
        const weight = pax.weight
        const $pax = new this.Pax(_this, pax, "Crew", "")
      })
      // ===========================================
      // -------------- Init -----------------
      // ===========================================
      this.init() // initialize jQuery drag/drop code

      /*

        Doesn't seem to be doing anything... this doesn't fire but the buttons still sync


      */
      // if (!notInitial) {
      //   $(".SAD").text(this.SAD.txt) // syncs all SAD buttons
      // }

      _this.update("PostPlane")
    }
    // ============================================================================
    // Update
    // ============================================================================
    update(ARGS) {
      console.log("\nUpdate(%o)", ARGS)
      const _this = this
      $(".SAD").text(this.SAD.txt) // syncs all SAD buttons
      //
      // Update Pax Sprites
      //
      $(".Pax").each(function () {
        const _pax = $(this).data("this").pax
        let weight = ""
        switch (_this.SAD.SAD) {
          case "Declared":
            weight = _pax.weight.declared || ` `
            break
          case "Actual":
            weight =
              _pax.weight.actual ||
              `<span style="font-size:small;color:grey">${_pax.weight.declared}</span>`
            break
          case "Standard":
            weight = _pax.weight.standard // || root.standard.weight.adult
            break
        }
        $(this).html(
          `${_pax.firstName}<br><span class="weight" style="font-size:large;">${weight}</span>`
        )
      })
      //
      // Update WB reports
      //

      //
      // Loop over each Row in {State}
      //
      const _row = this.state.getRow(this._TableCell.row)
      const WBPlanes = []
      const _WB = []
      const loadedPlanes = []
      const _state = this.state
      _row.forEach((data, i) => {
        const $AircraftPlotter = $(`#AircraftPlotter_${i}`)
        data.SAD = _this.SAD.SAD.toLowerCase()
        const aircraft = _state.getAircraftFromState(data)
        // ---------------------------
        // Get WB
        // ---------------------------
        const WB = aircraft.calculator.getWB(data)
        //
        // Update the "red/notRed" $Report bar above the seats
        //
        const $Report = $(`.Report_${i}`)
        const color = WB.isBalanced ? "green" : "red"
        let WeightLeft = WB.aircraft.limits.weight.MAUW - WB.roundAUW
        WeightLeft = Math.round(WeightLeft)
        $Report.css("background-color", color)
        $Report.text(`CG: ${WB.roundCG} Left: ${WeightLeft} kg`)
      })
    }
    // ============================================================================
    // End Update
    // ============================================================================
    //
    // .stations are tagged in their data with seat number ... .data("number", i)
    // numbered 1 - 8 (1=pilot)
    //
    // ============================================================================
    // Init
    // ============================================================================
    init() {
      let _this = this // used to reference this Details object from within the $body element's function
      $(".station").droppable({
        greedy: true,
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
      $(".PaxList").droppable({
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handlePaxListDrop,
      })
      $(".CrewList").droppable({
        accept: ".Crew",
        hoverClass: "hovered",
      })
      $("body").droppable({
        accept: ".Pax",
        drop: function (e, ui) {}, // unused
      })
      $(".CargoPod").droppable({
        greedy: true,
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
    }
    // ============================================================================
    // End Init
    // ============================================================================
    resetAirplane($TableCell) {
      this.setWeightClass("D")
      $(".SAD").text(this.SAD.txt)
      this.count = 0
      //this.airplane = this.state.getPlane($TableCell.data("_script").id)
      const _this = this
      $("#PaxList").empty()
      $("#CrewList").empty()
      $("#CargoPod").empty()
      //
      // -------------------------
      // Setup Airplane
      // -------------------------
      $(".Airplane").data("_this").reset()
      // -----------
      // Baggage Pod
      // -----------
      // Check to see if the plane has a baggage pod. ***
      // in ZEA's case, add the pod to the WB if attached (need a POD/NOPOD button at the top)
      //
    }
    getPax(droppedPaxFields) {
      // Maybe incorperate this into the manifext.getPax() method?
      const barcode = droppedPaxFields.find(
        (field) => field.label == "Barcode"
      ).value
      let pax = this._TableCell.board.manifest.getPax(barcode)
      if (!pax) {
        // crew
        pax = new Pax(droppedPaxFields)
      }
      return pax
    }
    // ============================
    // Dropped on the Pen (PaxList)
    // ============================
    handlePaxListDrop(even, ui) {
      //
      // $(this) = This Pen
      // ui.draggable = $Pax
      // $(this).closest(".detailsDiv").data("root") = This Details Object
      // ui.draggable.closest(".AircraftPlotter") = Which plane? (could be the same plane)

      // console.log("Dropped on Pen $(this): ", $(this))
      // console.log("Paxlist: ", $(this).prop("id"))
      // console.log("HasClass: " , $(this).hasClass("PaxList"))
      // console.log("Draggable: ", ui.draggable.data("pax"))

      const _this = $(this).closest(".detailsDiv").data("root") // This Details Object
      const cellID = $(this).data("cell").cellID // This pen's ID
      const $droppedAircraftPlotter = ui.draggable.closest(".AircraftPlotter") // Which plane? (could be the same plane)
      const droppedAircraftPlotter =
        $droppedAircraftPlotter.data("aircraftPlotter")
      const oldCellID = $droppedAircraftPlotter.data("cell")?.cellID

      let fields = ui.draggable.data("pax") // array of Rezdy fields
      //const barcode = ui.draggable.data("pax").find((field) => field.label == "Barcode").value
      ui.draggable.detach() // remove dropped Sprite (not needed anymore)

      fields = fields.filter((x) => x.label != "seat") // remove seat
      let newPax = new Pax(fields)
      //
      _this.state.movePax(
        newPax,
        _this.state.getCell(oldCellID),
        _this.state.getCell(cellID)
      )
      droppedAircraftPlotter.airplane.removePax(newPax) // remove the pax from this {airplane}
      _this.show(_this.$TableCell, true)
    }
    handleDrop(event, ui) {
      const $seat = $(this) // The jQuery seat (that's handling the drop)
      const _this = $seat.closest(".detailsDiv").data("root") // This Details Object
      //
      const $droppedAircraftPlotter = ui.draggable.closest(".AircraftPlotter") // $droppedAircraftPlotter.data("cell")
      const droppedAircraftPlotter =
        $droppedAircraftPlotter.data("aircraftPlotter")
      const $thisAircraftPlotter = $seat.closest(".AircraftPlotter")
      //
      const oldCellID = $droppedAircraftPlotter.data("cell")?.cellID // Dropped from cell's id
      const newCellID = $thisAircraftPlotter.data("cell")?.cellID // This cell's id

      const occupiedFields = $seat.children(".Pax").data("pax") // undefined if seat's empty
      const droppedFields = ui.draggable.data("pax")

      if (!!occupiedFields) {
        // utility.alert("Seat's Occupied")
        //
        // Capture old seat and save both swapped
        const $droppedUI = ui.draggable.detach()
        const droppedPaxSeat = $droppedUI
          .data("pax")
          .find((p) => !!p && p.label === "seat")
        const existingPax = new Pax(occupiedFields)
        existingPax.setSeat(droppedPaxSeat.value) // assign the dropped pax seat to the existing pax
        _this.state.movePax(
          existingPax,
          _this.state.getCell(oldCellID),
          _this.state.getCell(newCellID)
        ) // Save
      }

      let newPax = new Pax(droppedFields)
      droppedAircraftPlotter?.airplane.removePax(newPax) // remove the pax from originating {airplane} // Not always the same plane as the accepting plane
      newPax.setSeat($seat.data("seat")) // assign the accepting seat to the dropped pax
      //
      _this.state.movePax(
        newPax,
        _this.state.getCell(oldCellID),
        _this.state.getCell(newCellID)
      )
      _this.show(_this.$TableCell, true)
    }

    assignSeat($seat, $pax, droppedPaxFields) {
      $pax.appendTo($seat)
      $pax.draggable({ revert: false })
      $pax.position({ of: $seat, my: "left top", at: "left top" })
      $pax.data("pax", droppedPaxFields)
    }
    fillSeats(cell) {
      // this is {Details}
      console.log("Fill Seats:", cell)
      const plane = this.state.getAircraftFromState(cell)
      const seats = plane.getSeats()
      console.log("Seats: ", seats)

      // Only work on empty planes
      if (seats.some((seat) => seat.id != 1 && seat.weight != 0)) {
        utility.alert("Plane's not empty")
        return
      }

      cell.passengers.forEach((p, index) => {
        const pax = new Pax(p, index)
        // Skip if overloading plane
        if (index > seats.length - 2) {
          return
        }
        // Skip the first two seats and backfill CoPilot if the plane's full.
        let seatNum = index + 3
        if (seatNum > seats.length) {
          seatNum = 2
        }
        pax.setSeat(seatNum)
        p.fields = pax.fields
        this.state.savePax(p, cell.cellID, cell.leg)
      })
      this.show(this.$TableCell, true)
    }
    seatPax($pax, $menubar) {
      //
      // check to make sure the assigned seat is within the number of available seats before assigning
      //
      const pax = $pax.data("_pax")
      const plane = $menubar.data("aircraftPlotter").airplane
      const seats = plane.stations.filter((s) =>
        s.type.some((t) => t == "seat")
      ).length
      if (pax.seat > 0 && pax.seat <= seats) {
        const $assignedSeat = $menubar.find(`.SeatNumber${pax.seat}`)
        if (!!$assignedSeat) {
          $pax.detach().appendTo($assignedSeat)
          $pax.position({
            my: "left top",
            at: "left top",
            of: $assignedSeat,
          })
        }
      }
    }
    // =============== Workaround for that stupid position bug ========================
    // revert always reverts from an offset from it's previous anchor... when you reattach it to a different node, it "reverts" graphically every time
    // This lets it revert to something close to the new container
    setRevert($obj) {
      $obj.draggable({ revert: true })
    }
  }
</script>
