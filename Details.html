<script>
  $(() => {
    $("#planeDetailsClose").click(() => {
      $(".planeDetails").hide()
    })
  })
  // ===============================
  // Details Class
  // ===============================
  class Details {
    constructor(root) {
      this.root = root
      this._this = this
      this.state // placeholder
      this.$TableCell // placeholder
      this._TableCell // placeholder

      this.setWeightClass = function (className, $selector) {
        className = className.slice(0, 1)
        const ret = {}
        switch (className) {
          case "D":
            ret.txt = "Declared Weights"
            ret.SAD = "Declared"
            ret.class = "declaredWeights"
            break
          case "A":
            ret.txt = "Actual Weights"
            ret.SAD = "Actual"
            ret.class = "actualWeights"
            break
          case "S":
            ret.txt = "Standard Weights"
            ret.SAD = "Standard"
            ret.class = "standardWeights"
            break
        }
        $(".WeightClass").each((index, element) => {
          $(element)
            .removeClass("actualWeights")
            .removeClass("standardWeights")
            .removeClass("declaredWeights")
            .addClass(ret.class)
        })
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt)
        }
        _this.SAD = ret
        return ret
      }
      this.changeWeightClass = function ($selector) {
        let className = "S"
        if (!!this.SAD) {
          className = this.SAD.txt
        }
        className = className.slice(0, 1)
        let ret = {}
        switch (className) {
          case "S":
            ret = this.setWeightClass("Declared", $selector)
            break
          case "D":
            ret = this.setWeightClass("Actual", $selector)
            break
          case "A":
            ret = this.setWeightClass("Standard", $selector)
            break
        }
        if (!!$selector && !!$selector.text) {
          $selector.text(ret.txt)
        }
        _this.SAD = ret
        return ret
      }
      this.count = 0
      const _this = this
      this.bookings = []
      this.name = "Details"
      //this.SAD = "Declared" // Standard | Declared | Actual
      this.bgColors = {}
      this.colorNumbers = Array.from({ length: 20 }, (_, i) => "hsl(" + (i + 1) + 360 / (i + 1) + ", 50%, 75%)")
      // ==============================
      // Pax Class
      // ==============================
      this.Pax = class {
        constructor(parent, pax, _type, id) {
          if (!pax) {
            return
          }
          const _this = this
          const index = parent.count || 0
          parent.count++
          this.name = _type
          this.pax = pax
          const _parent = parent
          const _pax = pax
          const list = `${_type}List_${id}` || "PaxList"
          const firstName = pax.firstName
          const weight = pax.weight
          const orderNumber = pax.orderNumber
          const barcode = pax.barcode

          let $pax = $(
            `<div>${firstName}<br><span class="weight" style="font-size:large;">${weight.declared}</span></div>` //<br>${orderNumber}</div>`
          )
            //.data("number", p)
            .data("seat", index)
            .data("booking", orderNumber)
            .data("pax", pax.fields)
            .data("_pax", pax)
            .data("this", this)
            .data("list", list)
            .attr("id", `${_type}${index}`)
            .appendTo(`#${list}`) // This places the object
            .addClass("Pax")
            .addClass(_type)
            .draggable({
              containment: "#detailsDiv",
              stack: `#${list} div`,
              cursor: "move",
              revert: true,
              start: function (evt, ui) {
                this.startPos = ui.helper.position()
              },
              stop: function (event, ui) {
                _parent.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
                let $station = $(this).closest(".station")
                if ($station.length > 0) {
                  ui.helper.position({ of: $station, my: "left top", at: "left top" })
                }
              },
            })
            .click(function (e) {
              console.log("PaxClick this %o", _this)
              if (_parent.SAD.SAD != "Actual") {
                return
              }
              let weight = _pax.weight.actual || _pax.weight.declared
              if (!parseInt(weight) > 0) {
                weight = root.standard.weight.adult
              }
              // Find the midpoint of the sprite
              const margin = 5
              const x = e.pageX - this.offsetLeft
              const y = e.pageY - this.offsetTop - 50
              const h = $(this).outerHeight(true)
              const midpoint = (h + margin) / 2
              const deadzone = 15
              // --------------------------------

              if (y < midpoint - deadzone) {
                const w = weight + 1
                _pax.weight = { actual: w }
              }
              if (y > midpoint + deadzone) {
                const w = weight - 1
                _pax.weight = { actual: w }
              }

              if (!!_pax.weight.actual) {
                $pax.find(".weight").text(_pax.weight.actual)
              }
              _parent.update()
            })

          // Color Pax / Crew Sprites
          if (_type == "Crew") {
            $pax.css("background-color", "rgba(64,64,64,.8)")
          } else {
            let hue
            if (parent.bgColors[orderNumber]) {
              hue = parent.bgColors[orderNumber]
            } else {
              hue = parent.colorNumbers.pop()
              parent.bgColors[orderNumber] = hue
            }
            $pax.css("background-color", hue)
          }

          if (!!firstName && firstName.length >= 7) {
            $pax.css("font-size", "8px")
          }
          return $pax
        }
        echo() {
          console.log("I am %o", this.name)
        }
      }
      this.Airplane = class {
        constructor(cell, i) {
          this.id = i
          this.cell = cell
          this.parent = _this // {Details}
          this.airplane = _this.state.getPlane(cell.cellID) // Airplane Object based on {state}
          this.airplane.state = cell
          this.$seating = $(`<div id="Airplane_${i}" class="grid-container Airplane ${this.airplane.reg}"></div>`)
            .data("_this", this) // backreference
            .click((event) => {
              // in this context, this is {airplane}
              // _this is {Details}
              console.log("AirplaneClick: this: %o", this)
              // $(".station")
              //   .children()
              //   .each(function (i, child) {
              //     console.log("Child: %o", child)
              //     console.log("Station: %o", $(this).closest(".station").data("seat"))
              //     console.log("Pax: %o", $(this))
              //   })
            })
        }
        get$Pod() {
          const $ret = $(`<div id="CargoPod_${this.id}" class="CargoPod">Pod_${this.id}</div>`)
          this.airplane.stations
            .filter((station) => station.type.includes("podBay"))
            .forEach((station) => {
              const $bay = $("<div></div>")
                .appendTo($ret)
                .addClass("grid-placeholder")
                .addClass("station")
                .addClass("Baggage")
                .data("station", station)
              //.text(station.arm)
              const $selector = $("<select />")
                .appendTo($bay)
                .data("station", station)
                .append(`<option value="0">0</option>`)
              const _station = station
              // Limit the selector by the max limit of the pod bay ********
              for (let i = 10; i <= 500; i += 10) {
                let selected = ""
                if (_station.weight == i.toString()) {
                  selected = " selected"
                }
                $selector.append(`<option value="${i}" ${selected}>${i}</option>`)
              }
              $selector.change(function () {
                station.weight = this.value
                _this.update()
              })
            })
          return $ret
        }

        reset() {
          $("#CrewList_").empty()
          this.$seating.empty()
          this.$planePlotter
            .find(".MenuBar")
            .prepend(`<span class="Report Report_${this.id}" />`)
            .prepend(`<span class="Print" />`)
          const $Airplane = this.$seating
          // ------------
          // Pilot's seat
          // ------------
          $("<div></div>")
            .data("number", 1)
            .data("seat", 1)
            .attr("id", "SeatNumber1")
            .addClass("SeatNumber1")
            .addClass("grid-item")
            .addClass("station")
            .addClass("Seat")
            .addClass("PilotSeat")
            .addClass("Crew")
            .appendTo($Airplane)

          // -----
          // Seats
          // -----
          // slice(1) skips the pilot's seat
          let index = 2 // Skipping the Pilot seat and using 1 based counting.
          this.airplane.stations
            .slice(1)
            .filter((el) => el.type.includes("seat") || el.type.includes("placeholder"))
            .forEach((seat) => {
              if (seat.type.includes("placeholder")) {
                $("<div></div>").appendTo("#Airplane").addClass("grid-placeholder")
                //.text("Placeholder")
              } else {
                $("<div></div>")
                  .data("number", index)
                  .data("seat", index)
                  .attr("id", "SeatNumber" + index)
                  .addClass("SeatNumber" + index)
                  .addClass("grid-item")
                  .addClass("station")
                  .addClass("Seat")
                  .addClass("droppedPaxSeat")
                  .appendTo($Airplane)
                index++
              }
            })
          this.$planePlotter.css({ background: utility.hexToRgbA(this.airplane.regcolor, 0.5) })
        }
      }
      this._TableCell = ""
      this.airplane // placholder (gets built in resetAirplane())
      /*
        Details GUI Object 
      */
      this.$root = $(`<div  id="Details"  class="detailsDiv NoPrint" />`).append(`
        <div id="CrewList_" class="CrewList" />
        <div id="detailsContents" class="WeightClass detailsContents content" />
        `)
      this.$this = this.$root
      this.PCFSelectorString = `<span class="PCF_Selector" id="PCF_Selector">
          <select class="Plane" name="plane" />
          <select class="Fuel" name="fuel" /> Liters
        </span>`
      this.$root.data("root", this) // Access this object through $([Selector]).data('root')
      // ---------------------------
      // Print Button
      // ---------------------------
      this.$Print = this.$root.find(".Print")
      this.$Print.click(function () {
        console.log("Print Click")
        LOADSHEET.show(_this._TableCell)
      })
      // ====================
      // Details Close Button
      // ====================
      this.close = function (_this) {
        _this.$root.hide()
        _this.root.updateBoards()
      }
      const $pop = $(`<div id="DetailsClose" class="popupCloseButton right MobileButton">X</div>`)
      const $popLeft = $(`<div id="DetailsClose" class="popupCloseButton left small MobileButton">X</div>`)
      this.$root.append($pop).append($popLeft)
      $pop.click(() => _this.close(_this))
      $popLeft.click(() => _this.close(_this))

      return this
    }

    update() {
      const _this = this

      // Reflect PAX weights as per SAD
      $(".Pax").each(function () {
        const _pax = $(this).data("this").pax
        let weight = ""
        switch (_this.SAD.SAD) {
          case "Declared":
            weight = _pax.weight.declared || ` `
            break
          case "Actual":
            weight = _pax.weight.actual || `<span style="font-size:small;color:grey">${_pax.weight.declared}</span>`
            break
          case "Standard":
            weight = root.standard.weight.adult
            break
        }
        $(this).html(`${_pax.firstName}<br><span class="weight" style="font-size:large;">${weight}</span>`)
      })

      // Update WB reports
      console.log("\n\nUpdate WB Reports")
      const _row = this.state.getRow(this._TableCell.row)
      _row.forEach((CellData, i) => {
        const loadedPlane = _this.state.getPlaneFromState(CellData)
        const WB = loadedPlane.getWB(this.SAD)

        const report = $(`.Report_${i}`)
        const color = WB.cg.balanced ? "green" : "red"

        console.log("\nWB plane: %o %o\n", i, WB)
        //
        // Update the "red/notRed" report bar above the seats
        //
        report.data("plane", loadedPlane)
        report.prop("loadedPlane", loadedPlane)
        report.css("background-color", color)
        report.text(`CG: ${WB.rounded.CG} AUW: ${WB.rounded.AUW}`)
      })
    }
    //
    // .stations are tagged in their data with seat number ... .data("number", i)
    // numbered 1 - 8 (1=pilot)
    //
    init() {
      let _this = this // used to reference this Details object from within the $body element's function
      $(".station").droppable({
        greedy: true,
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
      $(".PaxList").droppable({
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $(".CrewList").droppable({
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $("body").droppable({
        accept: ".Pax",
        drop: function (e, ui) {
          _this.removePax(e, ui)
          _this.update()
        },
      })
      $(".CargoPod").droppable({
        greedy: true,
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
    }
    removePax(event, ui) {
      //
      // Add baggage removal code here ***
      //
      const list = ui.draggable.data("list")
      let $source = $(`#${list}`)
      ui.draggable.data("_pax").seat = null // Remove old seat value (so pax doesn't get plotted)

      if (ui.draggable.attr("class").includes("Crew")) {
        $source = $(".CrewList")
      }
      let $newPax = ui.draggable.detach()
      if (!!$source) {
        $newPax.appendTo($source)
        return
      }
      $newPax.appendTo($(this))
    }
    resetAirplane($TableCell) {
      this.setWeightClass("D")
      $(".SAD").text(this.SAD.txt)
      this.count = 0
      //this.airplane = this.state.getPlane($TableCell.data("_script").id)
      const _this = this
      $("#PaxList").empty()
      $("#CrewList").empty()
      $("#CargoPod").empty()
      //
      // -------------------------
      // Setup Airplane
      // -------------------------
      $(".Airplane").data("_this").reset()
      // -----------
      // Baggage Pod
      // -----------
      // Check to see if the plane has a baggage pod. ***
      // in ZEA's case, add the pod to the WB if attached (need a POD/NOPOD button at the top)
      //
    }
    getPax(droppedPaxFields) {
      // Maybe incorperate this into the manifext.getPax() method?
      const barcode = droppedPaxFields.find((field) => field.label == "Barcode").value
      let pax = this._TableCell.board.manifest.getPax(barcode)
      if (!pax) {
        // crew
        pax = new Pax(droppedPaxFields)
      }
      console.log("getPax: ", pax)
      return pax
    }
    handleDrop(event, ui) {
      console.log("HandleDrop")
      // in this context, this is the seat and $(this) is the jQuery seat
      const _this = $(this).closest(".detailsDiv").data("root") // This Details Object
      const $root = ui.draggable.closest(".detailsDiv")
      const _root = $root.data("root")
      //
      const _airplane = $(this).closest(".Airplane").data("_this")
      //
      const $droppedAirplanePlotter = ui.draggable.closest(".AirplanePlotter") // $droppedAirplanePlotter.data("cell")
      const $thisAirplanePlotter = $(this).closest(".AirplanePlotter")
      const clickedCell = $thisAirplanePlotter.data("cell")
      const newCellID = $thisAirplanePlotter.data("cell").cellID
      //
      // this.airplane.stations updates via getWB which searches the .station classes
      //
      let $alreadySeatedPax
      const DroppedStation = ui.draggable.closest(".station") // If dragging from a Station, not the Manifest
      let $newPax = ui.draggable.detach()
      let droppedPaxFields = $newPax.data("pax") // array of Rezdy fields
      let droppedPaxSeat = droppedPaxFields.find((p) => !!p && p.label === "seat")
      const isCrew = !!droppedPaxFields.some((f) => f.label == "Role")
      // sets the seat value (also below if changing seats)
      let thisSeat = {
        label: "seat",
        value: $(this).data("seat"),
      }
      //
      // Capture old seat
      //
      let oldSeat
      if (!droppedPaxSeat) {
        // If not from a seat, just assign it this one.
        droppedPaxFields.push(thisSeat)
      } else {
        // Pax has seat
        // Rassigning Seat
        const barcode = droppedPaxFields.find((field) => field.label == "Barcode").value

        const manifestPax = _this.getPax(droppedPaxFields)

        let statePax = _this._TableCell.board.state.getPax(barcode)
        if (!!manifestPax) {
          // Capture it's last seat before assigning it this one.
          oldSeat = JSON.parse(JSON.stringify(droppedPaxSeat))
          manifestPax.fields = manifestPax.fields.filter((x) => x.label != "seat")
          manifestPax.fields.push(thisSeat)
          droppedPaxFields = manifestPax.fields
          statePax.seat = thisSeat.value // sets the seat value
        }
      }
      // ============================================
      // Seat's occupied
      // ============================================
      if ($(this).children().length > 0) {
        //
        // Swap with any existing seated pax
        //
        // Detach pax from seat
        $alreadySeatedPax = $(this).children(".Pax").detach()
        //
        // == Two pax ==, both seated, swap seats
        //
        if (DroppedStation.length > 0) {
          //
          // Move the existing pax to the old station
          //
          $alreadySeatedPax.appendTo(DroppedStation)
          $alreadySeatedPax.position({ of: DroppedStation, my: "left top", at: "left top" })
          //
          // Remove the source seat field and rebrand with the old seat
          //
          let alreadySeatedPaxFields = $alreadySeatedPax.data("pax")
          //
          // Filter out the current seat
          // Remove seat field
          //
          alreadySeatedPaxFields = alreadySeatedPaxFields.filter((x) => JSON.stringify(x) != JSON.stringify(thisSeat))
          alreadySeatedPaxFields.push(oldSeat)
          //
          // Save
          //
          $alreadySeatedPax.data("pax", alreadySeatedPaxFields)
        } else {
          //
          // Dropping onto a seated pax from the Passenger List, take seated pax out of plane and back into Passenger List
          //
          $alreadySeatedPax.appendTo($("#PaxList"))
        }
      }
      // done figuring everying out, move the pax in {state}
      const pax = new Pax(droppedPaxFields)
      console.log("Dropped (new Pax): %o", pax)
      console.log("This State: %o", _this.state)
      _this.state.removePax([pax])
      console.log("Pax removed")
      _this.state.addPax(pax, newCellID)
      _this.assignSeat($(this), $newPax, droppedPaxFields)
      console.log("Update...")
      _this.update()
    }
    assignSeat($seat, $pax, droppedPaxFields) {
      // console.log("Assign Seat: %o \npax: %o\nfields: %o", $seat, $pax, droppedPaxFields)
      // this should take a pax object instead of feilds *******************
      $pax.appendTo($seat)
      $pax.draggable({ revert: false })
      $pax.position({ of: $seat, my: "left top", at: "left top" })
      $pax.data("pax", droppedPaxFields)
    }
    seatPax() {
      // $(".Pax").each((index, pax) => {
      //   const fields = $(pax).data("_pax")
      //   if (fields.seat > 0) {
      //     const $assignedSeat = $(`#SeatNumber${fields.seat}`)
      //     $(pax).detach().appendTo($assignedSeat)
      //     $(pax).position({
      //       my: "left top",
      //       at: "left top",
      //       of: $assignedSeat,
      //     })
      //   }
      // })
      // this.update()
    }
    // =============== Workaround for that stupid position bug ========================
    // revert always reverts from an offset from it's previous anchor... when you reattach it to a different node, it "reverts" graphically every time
    // This lets it revert to something close to the new container
    setRevert($obj) {
      $obj.draggable({ revert: true })
    }
    //
    //
    //
    // ======================================
    // Show
    // ======================================
    //
    //  [This is the first function called]
    //
    // --------------------------------------
    show($TableCell) {
      this.$root.find(".content").empty() // Clear the Details popup (removes the old planes)
      this.setWeightClass("D") // Set the initial SAD to Declared

      console.log("{details}.show row: %o", $TableCell.data("_script").row)
      //
      const _this = this
      const visible = this.$root.css("display") !== "none"

      // Store the clicked cell
      this.$TableCell = $TableCell
      this._TableCell = $TableCell.data("_script")
      this.state = this._TableCell.board.state

      // Get the entire row
      const _row = this.state.getRow(this._TableCell.row) // [CellData,CellData,CellData]
      // ======================================
      // Each Plane
      // ======================================
      // Each of these will be a different plane (and have it's own PCF)
      //
      _row.forEach((cell, i) => {
        // ---------------------------
        // Print Button
        // ---------------------------
        const $Print = $("<div />", {
          text: "P",
          class: "MenuButton MobileButton Print",
        })

        $Print.click(function () {
          console.log("Print Click")
          const loadedPlane = _this.state.getPlaneFromState(cell)
          const WB = loadedPlane.getWB(this.SAD)
          console.log("Cell: %o", cell)
          console.log("WB: %o", WB)
          LOADSHEET.show(_this._TableCell, loadedPlane, WB)
        })

        // ======================================
        // New this.Airplane
        // ======================================
        const _plane = new _this.Airplane(cell, i) // backlink is in data.this
        const $plane = $(`<div />`, {
          id: `AirplanePlotter_${i}`,
          class: "AirplanePlotter",
        })
          .data("cell", cell) // Backreference to which calendar cell it's plotting
          .append(_plane.$seating)
          .append(`<span id="PaxList_${i}" class="PaxList">`)
          .append(_plane.get$Pod())
          .append(`</span><span class="SpacerPod"></span>`)
        $plane.prepend($(`<div class="MenuBar"></div>`).prepend($(this.PCFSelectorString)))
        $plane.find(".PaxList").css("background", utility.hexToRgbA(_plane.airplane.regcolor, 0.5))

        // SAD Button
        const $SAD = $(`<span class="SAD WeightClass relativeLeft MobileButton">SAD</span>`).click(function () {
          let txt = $(this).text().charAt(0)
          _this.changeWeightClass($(this))
          _this.update()
        })
        $plane.find(".MenuBar").prepend($SAD)

        _plane.$planePlotter = $plane // Backreference ******
        _plane.reset()

        //_plane.$seating.find(".Print").append($Print) // can use this to put the print button at the top
        _plane.$seating.append($Print)
        $plane.find(`CargoPod_${i}`).append()
        _this.$root.find(".content").append($plane)

        const passengers = cell.passengers
        const state = this.state // need this cells {CellData}... might be getting {state} ***
        // ===========================================
        // -------------- Passengers -----------------
        // ===========================================
        passengers.forEach((p, index) => {
          const pax = new Pax(p, index)
          const firstName = pax.getValue("First Name")
          const weight = pax.weight
          const orderNumber = pax.getValue("orderNumber")
          const barcode = pax.getValue("Barcode")
          const $pax = new this.Pax(this, pax, "Pax", i)
        })

        const $PCF = $plane.find(".PCF_Selector")
        $PCF.empty()
        // ===========================================
        // Fuel Selector
        // ===========================================
        const $selector = $("<select />").appendTo($PCF).append(`<option value="0">0</option>`)

        // $fuel.append(`<option value="0">0</option>`)
        // for (let i = 10; i <= 1260; i += 10) {
        //   $fuel.append(`<option value="${i}">${i}</option>`)
        // }
        // $fuel.change(function () {
        //   // fuel change ***
        // })

        // Limit the selector by the max limit of the pod bay ********
        const fuelCap = _plane.airplane.fuel.capacity || 350
        for (let i = 10; i <= fuelCap; i += 10) {
          $selector.append(`<option value="${i}">${i}</option>`)
        }
        $selector.val(_plane.airplane.standardFuel) // set in Company Data Spreadsheet
        $selector.change( function (){
          console.log("Fuel Change")
          // station.weight = this.value
          // _this.update()
          console.log("$(this).value: ",$(this).val())
          console.log("this: ", this)
          console.log("cell: ", cell)
          console.log("_this: ", _this)
          console.log("Airplane: %o", _plane)
          console.log("$plane: ", $plane)
