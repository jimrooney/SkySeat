<div id="Details" class="detailsDiv">
  <div class="Print">Print</div>
  <div id="DetailsClose" class="popupCloseButton">X</div>
  <div id="detailsContents">
    <div id="content" style="width: 100%; overflow: hidden;">
      <div id="Airplane" class="grid-container Airplane"></div>
      <div id="PassengerList" class="PassengerList"></div>
    </div>
  </div>
</div>

<script>
  // ===============================
  // Details Close Button onClick
  // ===============================
  $("#DetailsClose").click(function () {
    $("#Details").hide()
    console.log("closing details")
  })

  // ===============================
  // Details Class
  // ===============================
  class Details {
    constructor($root) {
      this.$root = $root // save a reference to the jQuery object
      // Access this object through $([Selector]).data('root')
      this.bookings = []
    }
    init() {
      let _this = this // used to reference this Details object from within the $body element's function
      $(".station").droppable({
        greedy: true,
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
      $(".PassengerList").droppable({
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $("body").droppable({
        accept: ".Pax",
        drop: function (e, ui) {
          _this.removePax(e, ui, $(".PassengerList"))
        },
      })
    }
    removePax(event, ui, $source) {
      let DropPax = ui.draggable.detach()
      if (!!$source) {
        DropPax.appendTo($source)
        return
      }
      DropPax.appendTo($(this))
    }
    reset() {
      $("#PassengerList").html("") // will be able to be removed since we'll just plot all pax in seats (don't need a populated pax list... maybe a holding pen though)
      //
      // *************************************************************
      // Tweak for different plane types
      // *************************************************************
      //
      // Setup type
      // We'll need to clear this jQuery object with each plane loaded.. *******************
      $("#Airplane").empty()

      $("<div></div>")
        .data("number", 1)
        .appendTo("#Airplane")
        .addClass("grid-item station")
        .addClass("PilotSeat")
        .addClass("Crew")

      // $("<div></div>").data("number", 2)
      // .appendTo("#Airplane")
      // .addClass("grid-item station")
      // .addClass("CoPilotSeat")
      // .addClass("Crew")

      for (var i = 2; i <= 8; i++) {
        $("<div></div>")
          .data("number", i)
          .appendTo("#Airplane")
          .addClass("grid-item station")
          .click(function () {
            $(this).children().each(function(index,child){
              console.log("Child: %o",child)
            })
            console.log("Click This: %o",$(this).data("number"))
          })
      }
    }
    handleDrop(event, ui) {
      let existingPax
      let DragParent = ui.draggable.closest(".station") // If dragging from a Station, not the Manifest
      let DropPax = ui.draggable.detach()
      let pax = DropPax.data("pax")
      //
      // Victory is mine :)
      //
      // **************************************************************************************************
      // Assign sets ... this just keeps adding seat numbers... needs to add maybe objects and overwrite old seat assignments,
      // but it modifiest the source object (by copy, not reference), so it retains the seat assignment.
      // This might need to moce into the "flight" object for state saving
      // 
      // **************************************************************************************************
      
      
       let _pax = new Pax(pax)
       console.log("_pax: %o",_pax)
      

      // assign seat, don't just push it into the fields array... (assigning it needs to put it into the array so that the manifest object saves it... just don't push it in there)

      pax.push($(this).data("number"))
      console.log("Seat: %o", $(this).data("number"))
      
      // Swap with any existing seated pax
      if ($(this).children().length > 0) {
        // Detach pax from seat
        existingPax = $(this).children(".Pax").detach()
        // Two pax, both seated, swap seats
        if (DragParent.length > 0) {
          existingPax.appendTo(DragParent)
          existingPax.position({ of: DragParent, my: "left top", at: "left top" })
        } else {
          // Dropping onto a seated pax from the Passenger List, take seated pax out of plane and back into Passenger List
          existingPax.appendTo($("#PassengerList"))
        }
      }

      DropPax.appendTo($(this))
      DropPax.draggable({ revert: false })
      DropPax.position({ of: $(this), my: "left top", at: "left top" })
    }
    // =============== Workaround for that stupid position bug ========================
    // revert always reverts from an offset from it's previous anchor... when you reattach it to a different node, it "reverts" graphically every time
    // This lets it revert to something close to the new container
    setRevert($obj) {
      $obj.draggable({ revert: true })
    }
    show(bookings,$cell) {
      console.log("Details.show()")
      console.log("Cell: %o",$cell.prop('id'))
      console.log("Bookings: %o",bookings)

      let visible = this.$root.css("display") !== "none"
      let _this = this

      this.reset()

      // -------------- Passengers -----------------
      for (let key in bookings) {
        for (let p in bookings[key].booking.participants) {
          
          let pax = new Pax({fields:bookings[key].booking.participants[p].fields})
          let firstName = pax.getFirstName()
          let $pax = $("<div>" + firstName + " <BR><span style='font-size: large;'>" + pax.getWeight() + "</span></div>")
            .data("number", p)
            .data("booking", key)
            .data("pax",pax.fields)
            .attr("id", "pax" + p)
            .appendTo("#PassengerList") // This places the object... can swap #PassengerList for an assigned seat **********
            .addClass("Pax")
            .draggable({
              containment: "#content",
              stack: "#PassengerList div",
              cursor: "move",
              revert: true,
              start: function (evt, ui) {
                this.startPos = ui.helper.position()
              },
              stop: function (event, ui) {
                _this.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
                let $station = $(this).closest(".station")
                if ($station.length > 0) {
                  ui.helper.position({ of: $station, my: "left top", at: "left top" })
                }
              },
            })
          if (firstName.length >= 7) {
            $pax.css("font-size", "8px")
          }

          this.init() // initialize jQuery drag/drop code

          if (visible) {
            this.$root.hide()
          } else {
            this.$root.css("width", "400px")
            this.$root.css("heigh", "600px")
            this.$root.show()
          }
        }
      }
    }
  }
</script>
