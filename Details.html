<script>
  $(() => {
    $("#planeDetailsClose").click(() => {
      $(".planeDetails").hide()
    })
  })
  // ===============================
  // Details Class
  // ===============================
  class Details {
    constructor() {
      this._this = this
      this.bookings = []
      const _this = this
      this._TableCell = ""

      this.$root = $(`<div id="Details" class="detailsDiv">
        <div class="Print">Print</div>
        <div class="Report" />
        <div id="detailsContents" class="detailsContents">
          <div id="content" style="width: 100%; overflow: hidden;">
            <div id="Airplane" class="grid-container Airplane"></div>
            <div id="BaggagePod" class="BaggagePod">POD</div>
            <div id="PassengerList" class="PassengerList"></div>
          </div>
          <div id="CrewList" class="CrewList"></div>
        </div>
      </div>`)
      this.$this = this.$root
      this.PCFSelectorString = `<div class="PCF_Selector" id="PCF_Selector">
          <select class="Plane" name="plane" />
          <select class="Fuel" name="fuel" />
        </div>`
      this.$PCFSelector = $(this.PCFSelectorString)
      this.$root.prepend(this.$PCFSelector)
      this.$root.data("root", this) // Access this object through $([Selector]).data('root')
      // ---------------------------
      // Print Button
      // ---------------------------
      this.$Print = this.$root.find(".Print")
      this.$Print.click(function () {
        console.log("Print Click")
        LOADSHEET.show(_this._TableCell)
      })
      //
      // ---------------------------
      // Airplane layout <div> Click
      // ---------------------------
      this.$Airplane = this.$root.find(".Airplane")
      this.$Airplane.click(() => {
        console.log("AirplaneClick")
        $(".station")
          .children()
          .each(function (i, child) {
            console.log("Child: %o", child)
            console.log("Station: %o", $(this).closest(".station").data("seat"))
            console.log("Pax: %o", $(this))
          })
          _this.update()
      })
      // ====================
      // Details Close Button
      // ====================
      let $pop = $(`<div id="DetailsClose" class="popupCloseButton">X</div>`)
      let _$root = this.$root
      this.$root.append($pop)
      $pop.click(function () {
        _$root.hide()
      })
      return this.$root
    }
    update() {
      this.getWB()
    }
    //
    // .stations are tagged in their data with seat number ... .data("number", i)
    // numbered 1 - 8 (1=pilot)
    //
    init() {
      let _this = this // used to reference this Details object from within the $body element's function
      $(".station").droppable({
        greedy: true,
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
      $(".PassengerList").droppable({
        accept: ".Pax",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $(".CrewList").droppable({
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.removePax,
      })
      $("body").droppable({
        accept: ".Pax",
        drop: function (e, ui) {
          _this.removePax(e, ui)
          _this.update()
        },
      })
      $(".BaggagePod").droppable({
        greedy: true,
        accept: ".Crew",
        hoverClass: "hovered",
        drop: this.handleDrop,
      })
    }
    removePax(event, ui) {
      //
      // Add baggage removal code here ***
      //
      let $source = $(".PassengerList")
      if (ui.draggable.attr("class").includes("Crew")){
        $source = $(".CrewList")
      }
      let $newPax = ui.draggable.detach()
      if (!!$source) {
        $newPax.appendTo($source)
        return
      }
      $newPax.appendTo($(this))
    }
    reset($TableCell) {
      this.$PCFSelector.remove()
      this.$PCFSelector = $(this.PCFSelectorString)
      this.$root.prepend(this.$PCFSelector)
      $("#PassengerList").html("")
      $("#CrewList").html("")
      //
      // -------------------------
      // Setup Airplane
      // -------------------------
      $("#Airplane").empty()
      let airplane = $TableCell.data("_script").getPlane()
      // ------------
      // Pilot's seat
      // ------------
      $("<div></div>")
        .data("number", 1)
        .data("seat", 1)
        .addClass("SeatNumber1")
        .appendTo("#Airplane")
        .addClass("grid-item")
        .addClass("station")
        .addClass("PilotSeat")
        .addClass("Crew")
      // -----
      // Seats
      // -----
      // slice(1) skips the pilot's seat
      let index = 2 // Skipping the Pilot seat and using 1 based counting.
      airplane.stations
        .slice(1)
        .filter((el) => el.type.includes("seat") || el.type.includes("placeholder"))
        .forEach((seat) => {
          if (seat.type.includes("placeholder")) {
            $("<div></div>").appendTo("#Airplane").addClass("grid-placeholder")
            //.text("Placeholder")
          } else {
            $("<div></div>")
              .data("number", index)
              .data("seat", index)
              .appendTo("#Airplane")
              .addClass("SeatNumber" + index)
              .addClass("grid-item")
              .addClass("station")
              .addClass("newPaxSeat")
            index++
          }
        })
      // -----------
      // Baggage Pod
      // -----------
      // Check to see if the plane has a baggage pod. ***
      // in ZEA's case, add the pod to the WB if attached (need a POD/NOPOD button at the top)
      //
      $("#BaggagePod").empty()
    }
    handleDrop(event, ui) {
      const _this = $(this).closest(".detailsDiv").data("root") // This Details Object
      const $root = ui.draggable.closest(".detailsDiv")
      const _root = $root.data("root")
      //
      let $thisPax
      const DroppedStation = ui.draggable.closest(".station") // If dragging from a Station, not the Manifest

      let $newPax = ui.draggable.detach()
      let newPaxFields = $newPax.data("pax") // array of Rezdy fields
      let newPaxSeat = newPaxFields.find((p) => p.label === "seat")

      let thisSeat = {
        label: "seat",
        value: $(this).data("seat"),
      }

      //
      // Capture old seat
      //
      let oldSeat
      if (!newPaxSeat) {
        //
        // In not from a seat, just assign it this one.
        newPaxFields.push(thisSeat)
        //
      } else {
        //
        // Capture it's last seat before assigning it this one.
        oldSeat = JSON.parse(JSON.stringify(newPaxSeat))
        // Could also be done by filtering out any seats before adding the new one ***
        newPaxFields = newPaxFields.filter((x) => JSON.stringify(x) != JSON.stringify(oldSeat))
        newPaxFields.push(thisSeat)
      }
      //
      // Swap with any existing seated pax
      //
      if ($(this).children().length > 0) {
        // Detach pax from seat
        $thisPax = $(this).children(".Pax").detach()
        //
        // == Two pax ==, both seated, swap seats
        //
        if (DroppedStation.length > 0) {
          //
          // Move the existing pax to the old station
          //
          $thisPax.appendTo(DroppedStation)
          $thisPax.position({ of: DroppedStation, my: "left top", at: "left top" })
          //
          // Remove the source seat field and rebrand with the old seat
          //
          let thisPaxFields = $thisPax.data("pax")
          //
          // Filter out the current seat
          // Remove seat field
          //
          thisPaxFields = thisPaxFields.filter((x) => JSON.stringify(x) != JSON.stringify(thisSeat))
          thisPaxFields.push(oldSeat)
          //
          // Save
          //
          $thisPax.data("pax", thisPaxFields)
          //
        } else {
          //
          // Dropping onto a seated pax from the Passenger List, take seated pax out of plane and back into Passenger List
          //
          $thisPax.appendTo($("#PassengerList"))
        }
      }
      $newPax.appendTo($(this))
      $newPax.draggable({ revert: false })
      $newPax.position({ of: $(this), my: "left top", at: "left top" })
      $newPax.data("pax", newPaxFields)
      //
      //
      //
      _this.update()
    }
    getWB() {
      let loadedPlane = this._TableCell.getPlane() // retunrs a loaded airplane object
      let WB = loadedPlane.getWB()
      console.log("{getWB}", WB)

      const report = this.$root.find(".Report")
      const color = WB.cg.balanced ? "blue" : "red"

      report.css("background-color", color)
      report.text(`CG: ${WB.rounded.CG} AUW: ${WB.rounded.AUW}`)

      return loadedPlane
    }
    // =============== Workaround for that stupid position bug ========================
    // revert always reverts from an offset from it's previous anchor... when you reattach it to a different node, it "reverts" graphically every time
    // This lets it revert to something close to the new container
    setRevert($obj) {
      $obj.draggable({ revert: true })
    }
    // --------------------------------------
    // Show
    // --------------------------------------
    show($TableCell) {
      console.log("Details.show()")
      console.log("Cell: %o", $TableCell.prop("id"))
      //
      // Clear the popup
      //
      this.reset($TableCell)
      //
      //
      //
      let visible = this.$root.css("display") !== "none"
      const _this = this
      //
      // Keep the TableCell object cuz drops lose it.
      //
      this.$TableCell = $TableCell
      this._TableCell = $TableCell.data("_script")
      let _TableCell = this._TableCell
      //
      //
      //
      const passengers = this._TableCell.getPassengers()
      let state = this._TableCell.getState() // Returns State {CellData}
      // ====================================
      // -------------- PCF -----------------
      // ====================================
      let $plane = $("> .Plane", this.$PCFSelector)
      let $pilot = $("> .Pilot", this.$PCFSelector)
      let $coPilot = $("> .CoPilot", this.$PCFSelector)
      let $fuel = $("> .Fuel", this.$PCFSelector)

      PlaneManager.planes.data.forEach((plane, i) => {
        if (!!plane.weight) {
          $plane.append(`<option value="${plane.reg}">${plane.reg}</option>`)
        }
      })
      $plane.change(function () {
        _TableCell.setPlaneData("reg", this.value)
        _this.show(_this.$TableCell)
        _this.$this.show()
      })
      $fuel.append(`<option value="0">0</option>`)
      for (let i = 10; i <= 1260; i += 10) {
        $fuel.append(`<option value="${i}">${i}</option>`)
      }
      $fuel.change(function () {
        _TableCell.setPlaneData("fuel", this.value)
        _this.update()
      })
      //      Make Fuel List that's determined by the plane's max fuel ***************

      /*

        Set the values to the data stored in State ***************************

      */
      if (Object.keys(state.PCF).length > 0) {
        if (!!state.PCF.coPilot) {
          $coPilot.val(state.PCF.coPilot)
        } else {
          $coPilot.val("")
        }
        $pilot.val(state.PCF.pilot)
        $fuel.val(state.PCF.fuel)
        $plane.val(state.PCF.reg)
      }

      const _crew = []
      pilots.list.forEach((pilot, i) => {
        _crew.push({
          fields: [
            { label: "Role", value: "PIC" },
            { label: "First Name", value: pilot.first },
            { label: "Last Name", value: pilot.last },
            { label: "Weight", value: pilot["declared weight"].toString() },
          ],
        })
      })

      // const _crew = [
      //   {
      //     fields: [
      //       { label: "Role", value: "PIC" },
      //       { label: "First Name", value: "Zapps" },
      //       { label: "Last Name", value: "Brannigan" },
      //       { label: "Full Name", value: "Zapp Brannigan" },
      //       { label: "Weight", value: "79" },
      //     ],
      //   },
      //   {
      //     fields: [
      //       { label: "Role", value: "SIC" },
      //       { label: "First Name", value: "Kif" },
      //       { label: "Last Name", value: "Kroker" },
      //       { label: "Full Name", value: "Kif Kroker" },
      //       { label: "Weight", value: "42" },
      //     ],
      //   },
      // ]

      // ===========================================
      // -------------- Crew -----------------
      // ===========================================
      //
      //  This can be merged into the Passenger function below
      //
      _crew.forEach((crew, index) => {
        let pax = new Pax(crew)
        const firstName = pax.firstName
        const weight = pax.weight

        let $pax = $(
          `<div>${firstName}<br><span style="font-size:large;">${weight}</span>` //<br>${orderNumber}</div>`
        )
          //"<div>" + firstName + " <BR><span style='font-size: large;'>" + pax.getWeight() + "</span></div>"            .data("number", p)
          .data("seat", index)
          .attr("id", "pax" + index)
          .appendTo("#CrewList") // This places the object... can swap #PassengerList for an assigned seat **********
          .addClass("Pax")
          .addClass("Crew")
          .data("_pax", pax)
          .data("pax", crew.fields)
          .draggable({
            containment: "#detailsDiv",
            stack: "#CrewList div",
            cursor: "move",
            revert: true,
            start: function (evt, ui) {
              this.startPos = ui.helper.position()
            },
            stop: function (event, ui) {
              _this.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
              let $station = $(this).closest(".station")
              if ($station.length > 0) {
                ui.helper.position({ of: $station, my: "left top", at: "left top" })
              }
            },
          })

        let hue = "lightblue"
        $pax.css("background-color", hue)

        if (firstName.length >= 7) {
          $pax.css("font-size", "8px")
        }

        this.init() // initialize jQuery drag/drop code

      })

      // ===========================================
      // -------------- Passengers -----------------
      // ===========================================

      let bgColors = {}
      let colorNumbers = Array.from({ length: 20 }, (_, i) => "hsl(" + (i + 1) + 360 / (i + 1) + ", 50%, 75%)")
      passengers.forEach((p, index) => {
        let pax = new Pax(p)
        const firstName = pax.getValue("First Name") //pax.getFirstName()
        const weight = pax.getValue("weight") //pax.getWeight()
        const orderNumber = pax.getValue("orderNumber") ///pax.getOrderNumber()

        let $pax = $(
          `<div>${firstName}<br><span style="font-size:large;">${weight}</span>` //<br>${orderNumber}</div>`
        )
          //"<div>" + firstName + " <BR><span style='font-size: large;'>" + pax.getWeight() + "</span></div>"            .data("number", p)
          .data("seat", index)
          .data("booking", orderNumber)
          .data("pax", pax.fields)
          .data("_pax", pax)
          .attr("id", "pax" + index)
          .appendTo("#PassengerList") // This places the object... can swap #PassengerList for an assigned seat **********
          .addClass("Pax")
          .draggable({
            containment: "#detailsDiv",
            stack: "#PassengerList div",
            cursor: "move",
            revert: true,
            start: function (evt, ui) {
              this.startPos = ui.helper.position()
            },
            stop: function (event, ui) {
              _this.setRevert($(this)) // =============== hack fix ================ (resets to draggable)
              let $station = $(this).closest(".station")
              if ($station.length > 0) {
                ui.helper.position({ of: $station, my: "left top", at: "left top" })
              }
            },
          })

        let hue
        if (bgColors[orderNumber]) {
          hue = bgColors[orderNumber]
        } else {
          hue = colorNumbers.pop()
          bgColors[orderNumber] = hue
        }
        $pax.css("background-color", hue)

        if (firstName.length >= 7) {
          $pax.css("font-size", "8px")
        }


      })
      if (visible) {
          this.$root.hide()
        } else {
          this.$root.css("width", "800px")
          this.$root.css("heigh", "600px")
          this.$root.show()
        }
    }
  }
</script>
