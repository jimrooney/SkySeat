<script>
  var wb = {
    getKilos: function (string) {
      let factor = 1
      if (!string) {
        return
      }
      let number = string

      if (typeof string == "string") {
        // ** Switch this to grep **
        if (
          string.toUpperCase().indexOf("LBS") > 0 ||
          string.toUpperCase().indexOf("LB") > 0 ||
          string.toUpperCase().indexOf("POUND") > 0
        ) {
          factor = 2.20462
        }
        number = parseInt(string)
      }

      let ret = number / factor
      ret = Math.round(ret)
      return ret
    },
  }
  // ==========================================================================
  // WB Object
  // ==========================================================================
  class WBObject {
    constructor(data) {
      this.aircraft = data.aircraft
      this.data = {
        // SAD: data.SAD,
        // stations: stations,
        // POB: pob,
        // crew: {
        //   stations: CREW,
        //   pic: PIC,
        // },
        // TotalWeight: totalWeight,
        // TotalMoment: totalMoment,
        // CG: CG,
        // cg: {
        //   position: CG,
        //   balanced: isBalanced,
        //   fwdLimit: this.getForwardCGLimit(
        //     totalWeight,
        //     this.limits.CG.bounds[0]
        //   ),
        //   imperial: {
        //     TotalWeight: totalWeight * 2.2,
        //     CG: CG * 39.3701,
        //     fuelWeight: (totalWeight - ZFW_Weight) * 2.2,
        //   },
        // },
        // weights: {
        //   crew: CREW_Weight,
        //   pob: POB_Weight,
        //   pax: PAX_Weight,
        //   zfw: ZFW_Weight,
        //   auw: totalWeight,
        //   fuel: totalWeight - ZFW_Weight,
        // },
        // fuel: {
        //   liters: fuelQuantity,
        //   kg: fuelQuantity * data.fuel.factor,
        //   endurance: this.getFuelEndurance(data.fuel.liters), // fuelQuantity / data.fuel.burnRate,
        // },
        // rounded: {
        //   AUW: roundAUW,
        //   CG: roundCG,
        // },
        // WAM: WAM,
      }
    }

    getWB(data) {
      if (!data.id) {
        // data.id is the Cell ID
        console.log("WB.getWB(): No data passed in")
        return
      }
      this.SAD = data.SAD
      // console.log("WB.getWB(): ", data)
      //
      const stations = this.aircraft.stations // stations
      // Add aircraft station
      const station = new Station({
        type: ["airplane"],
        moment: this.aircraft.moment,
        weight: this.aircraft.weight,
        arm: this.aircraft.arm,
        id: (id = "AC"),
      })
      stations.push(station)

      // == Set Fuel ==
      // If no fuel in {state}, use standard fuel
      let _fuel =
        this.aircraft.state.getFuel(this.aircraft.cell.id) ||
        this.aircraft.standardFuel
      this.aircraft.fuel = _fuel // setter will mod the station

      // == Set Pax ==
      this.setPax(data)

      // ---------------------------
      // Calc all moments
      // ---------------------------
      stations.forEach((station, index) => {
        station.moment = station.weight * station.arm
      })

      // ---------------------------
      // Sum all Weights and Moments
      // ---------------------------
      //

      // POB ... only occupied seats
      this.POB = stations.filter(
        (station) => station.type.includes("seat") && !!station.weight
      )

      // Crew
      this.CREW = this.POB.filter((station) => {
        // gets all CREW
        if (!!station.pax) {
          return station.pax.fields.find((field) => field.label == "Role") // only return pax with Roles (crew)
        }
      })

      // PIC (Find finds Left Seat only (then skips), but could also search by matching seat number) ****
      this.PIC = this.CREW.find((station) =>
        station.pax.fields.find(
          (pax) => pax.label == "Role" && pax.value == "PIC"
        )
      )

      // Filter out Crew
      this.PAX = this.POB.filter((x) => !this.CREW.includes(x))

      // Cargo
      this.CARGO = stations.filter(
        (station) => station.type.includes("cargo") && station.weight > 0
      )

      // Everything but fuel
      this.ZFW = stations.filter((station) => !station.type.includes("fuel"))
      
      // Fuel
      this.FUEL = stations.filter((station) => station.type.includes("fuel"))

      this.FUEL_Weight = this.FUEL.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      this.POB_Weight = this.POB.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      this.CREW_Weight = this.CREW.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      this.PAX_Weight = this.POB_Weight - this.CREW_Weight
      const ZFW_Weight = this.ZFW.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      this.ZFW_Weight = this.ZFW.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      this.totalWeight = stations.reduce(
        (total, station) => total + parseFloat(station.weight),
        0
      )
      this.totalMoment = stations.reduce(
        (total, station) => total + parseFloat(station.moment),
        0
      )

      //
      this.CG = this.totalMoment / this.totalWeight
      this.AUW = this.totalWeight
      this.AUW_Left = Math.round(((this.aircraft.limits.weight.MAUW - this.totalWeight) + Number.EPSILON) * 1000) / 1000
      this.roundCG = Math.round((this.CG + Number.EPSILON) * 1000) / 1000
      this.roundAUW = Math.round((this.totalWeight + Number.EPSILON) * 100) / 100
      this.isBalanced = this.aircraft.isBalanced(this.totalWeight, this.CG)

      this.cg = {
          position: this.CG,
          balanced: this.isBalanced,
          fwdLimit: this.aircraft.getForwardCGLimit(
            this.totalWeight,
            this.aircraft.limits.CG.bounds[0]
          ),
          imperial: {
            TotalWeight: this.totalWeight * 2.2,
            CG: this.CG * 39.3701,
            fuelWeight: (this.totalWeight - ZFW_Weight) * 2.2,
          },
        }
      return this
    }
    //
    // Copy the pax from {state} and put them in this.aircraft (stations) with SAD numbers
    //
    setPax(data) {
      const statePax =
        this.aircraft.state.data[this.aircraft.cell.id]?.passengers
      if (!!statePax) {
        statePax.forEach((pax) => {
          if (pax.seat > 0) {
            const station = this.aircraft.stations.find(
              (station) => station.id == pax.seat
            )
            station.pax = pax
            station.weight = pax.weight[data.SAD]
            station.moment = station.weight * station.arm
          }
        })
      }
    }
  }
</script>
