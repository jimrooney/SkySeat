<script>
  var wb = {
    getKilos: function (string) {
      let factor = 1
      if (!string) {
        return
      }
      let number = string

      if (typeof string == "string") {
        // ** Switch this to grep **
        if (
          string.toUpperCase().indexOf("LBS") > 0 ||
          string.toUpperCase().indexOf("LB") > 0 ||
          string.toUpperCase().indexOf("POUND") > 0
        ) {
          factor = 2.20462
        }
        number = parseInt(string)
      }

      let ret = number / factor
      ret = Math.round(ret)
      return ret
    },
  }
// ==========================================================================
// WB Object
// ==========================================================================
  class WB {
    constructor(data) {

      const wb = {
        SAD: SAD,
        stations: this.stations,
        POB: pob,
        crew: {
          stations: CREW,
          pic: PIC,
        },
        TotalWeight: totalWeight,
        TotalMoment: totalMoment,
        CG: CG,
        cg: {
          position: CG,
          balanced: isBalanced,
          fwdLimit: this.getForwardCGLimit(totalWeight, this.limits.CG.bounds[0]),
          imperial: {
            TotalWeight: totalWeight * 2.2,
            CG: CG * 39.3701,
            fuelWeight: (totalWeight - ZFW_Weight) * 2.2,
          },
        },
        weights: {
          crew: CREW_Weight,
          pob: POB_Weight,
          pax: PAX_Weight,
          zfw: ZFW_Weight,
          auw: totalWeight,
          auwLeft: this.limits.MAUW - totalWeight,
          fuel: totalWeight - ZFW_Weight,
        },
        fuel: {
          liters: fuelQuantity,
          kg: 0,
          endurance: fuelEndurance,
        },
        rounded: {
          AUW: roundAUW,
          CG: roundCG,
        },
      }
      return wb
    }
  }
</script>
