<script>
  // ==========================================================================
  // WB_Calculator Object
  // ==========================================================================
  class WB_Calculator {
    constructor(aircraft) {
      this.aircraft = aircraft
    }
    getWB(data) {
      console.log("WB_Calculator.getWB(data) data:", data)
      // No data check
      if (!data) {
        console.log("WB_Calculator.getWB(): No data passed in")
        return
      }

      // Stations
      console.log("Stations: ", this.aircraft.stations)
      const stations = Array.from(this.aircraft.stations) // copy so we don't change the original data

      // Fuel
      data.fuel = this.aircraft.fuel
      data.fuel = {
        ...{ liters: data.PCF?.fuel || data.liters || 0 },
        ...data.fuel,
      }
      data.fuel.weight = data.fuel.liters * data.fuel.factor
      console.log("WB_Calculator Data:", data)

      // Aircraft Moment fix
      //
      // Since our airplane data moments inexplicably don't equal weight*arm, we need a seperate Station object for them.
      //
      let station = new Station({
        type: ["airplane"],
        weight: this.aircraft.weight,
        moment: this.aircraft.moment
      })
      stations.push(station)

      console.log("Stations: ", stations)
    }
  }
</script>
