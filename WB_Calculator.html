<script>

  class WB_Calculator {
    constructor(aircraft) {
      this.aircraft = aircraft
      let station = new Station({
        type: ["airplane"],
        weight: this.aircraft.weight,
        moment: this.aircraft.moment
      })
      this.aircraft.stations = [station]
    }
    getWB(data) {
      // No data check
      if (!data.PCF) {
        console.log("WB_Calculator.getWB(): No data passed in")
        return
      }
      // data.CellData
      // Stations
      console.log("Aircraft: ", this.aircraft)
      const stations = JSON.parse(JSON.stringify(Array.from(this.aircraft.stations))) // Shallow Copy

      const ff = this.aircraft.fuel.factor

      const fuelWeight = data.PCF.fuel * this.aircraft.fuel.factor
      this.aircraft.fuelWeight = fuelWeight 
      this.aircraft.fuel = data.PCF.fuel // setter should mod the station
      //

      console.log("WB_Calculator Data:", data)
      const pxStations = stations.filter((item) => item.type.includes("seat"))

      console.log("Seats: ", pxStations)
      // Calc all moments
      stations.forEach((station,index) => {
        if (!!station.px){
          const SAD = data.SAD.toLowerCase()

          stations[index].weight = station.weight[SAD]
          console.log("Station update: " , station.weight)
        }
        station.moment = station.weight * station.arm
        console.log(station.moment)
      })

numArray.forEach((element, index) => {

console.log(numArray);
*/

  }
</script>
