<script>
  // Object for TableCells
  class TableCell {
    constructor(board, r, c) {
      let _this = this // reference for inside the click function scope
      this._this = this // keep a reference to this JS object (self reference)
      this.board = board // reference to the instantiating board
      this.id = r + "_" + c
      this.row = r
      this.column = c
      this.hour // Placeholder
      this.leg
      // -------------------------------------------
      // jQuery object
      // -------------------------------------------
      let $this = $("<td />", {
        class: "TableCell Row_" + r + " Col_" + c,
        id: this.id,
        text: this.id,
      })
      // -------------------------------------------
      // Backreference
      // -------------------------------------------
      $this.prop("_this", this._this) // Backreference to JS from jQuery object
      this.$this = $this // keep a reference to the jQuery object
      // -------------------------------------------
      // Droppable
      // -------------------------------------------
      $this.droppable({
        accept: ".BookingSprite, .TableCell",
        drop: this.handleDrop,
        delay: 100, // Might not need this now *******************
      })
      // -------------------------------------------
      // Click
      // -------------------------------------------
      $this.click(function () {
        console.log("TableCell Click")
        console.log("Classes: %o", $(this).attr("class"))
        console.log("TableCell.hour: %o", _this.hour)
        //
        // ******************************************************************************
        // Remove the inMarker class (just to see class removal function visually)
        $this.removeClass("inMarker") // ******* Testing. This can be removed *************
        // ******************************************************************************
        //
        let data = _this.getCellDataObject()
        if (!!data) {
          console.log("TableCell data: %o", data)

          let bookings = _this.getOrders(data)
          console.log("TableCell bookings: %o", bookings)
        }
      })
    }
    // -------------------------------------------
    // Drop
    // -------------------------------------------
    handleDrop(event, ui) {
      //
      // Since this is getting called externally, "this" isn't this obj
      // So we'll use the jQuery $(this) to get a pointer to this object
      //
      let $dropped = ui.draggable // ui.draggable : The Manifest Sprite or $dropped TableCell
      let _dropped = $dropped.prop("_this") // ({TableCell} or {Booking}) JS object attached to the Selector
      //_dropped.constructor.name // {TableCell} or {Booking}
      let _this = $(this).prop("_this") // This JS Object
      let cellData = _this.getCellDataObject()

      let leg = _this.getLeg()
      let droppedIsOut = _dropped.isOut()

      if (_this.isLegalDrop(leg, droppedIsOut)) {
        // ====================================================================
        // Drop accepted, record and update.
        _this.recordDrop($(this), $dropped) // recordDrop({TableCell},{Booking})
        // ====================================================================
      } else {
        let msg = "Wrong Type: DroppedIsOut" + droppedIsOut + " CellLeg: " + leg
        utility.error(msg)
      }
    }
    // -------------------------------------------------------------------
    // Record Drop
    // -------------------------------------------------------------------
    recordDrop($this, $dropped) {
      //
      // // This is the magic //
      //
      let $Board = $this.closest(".root") // jQuery root
      let _board_ = $Board.data("root") // JavaScript root
      _board_.state.add($this, $dropped) // This adds the data to the State object (two dimensional array that mirrors the Board)
      _board_.update() // board.update() calls update() on each TableCell.
      $dropped.css("background-color", "var(--main-bg-color)") // Color the manifest object
    }
    // -------------------------------------------------------------------
    // isLegalDrop
    // -------------------------------------------------------------------
    isLegalDrop(cellLeg, droppedIsOut) {
      let cellIsOut = cellLeg == "B"
      /*
      Cell hasn't been branded = legal // can be either
      Cell matches drop = legal

      ***************************************************************************
      Probably need to add further looking tests for return flight cell checks...
      Or, those checks can call this function
      ***************************************************************************
      */
      console.log("isLegalDrop(cellIsOut, droppedIsOut) %o %o", cellIsOut, droppedIsOut)
      let legal
      cellLeg == null ? (legal = true) : cellIsOut == droppedIsOut ? (legal = true) : (legal = false)
      return legal
    }
    // ------------------------------
    // getBookingObjects
    // ------------------------------
    //
    // Check the State and get the CellData objects
    // pass them to the Manifest and get back the actual booking order objects
    //
    getOrders() {
      //
      // Returns an array of booking objects objects (from State)
      //
      let retArray = []
      let data = this.getCellDataObject()
      if (!!data) {
        for (let o in data.bookingOrders) {
          // data will have let key = orderNumber + "_" + productNumber
          let s = data.bookingOrders[o].split("_")
          let orderNumber = s[0]
          let productCode = s[1]
          let order = this.board.manifest.getBooking(orderNumber, productCode)


console.log("Order: %o",order)
console.log("productCode: %o",productCode)






          let item = order.items.find((x) => x.productCode === productCode)
          let booking = new Booking(item, orderNumber, order) // [booking] expects a product object, we're giving it a product Number (which [booking] just looks up anyway)
          retArray.push(booking)
        }
      }
      return retArray
    }
    getCellDataObject() {
      //
      // get the CellData Object from the state object
      //
      return this.board.state.getCellDataObject(this.$this) // get the CellData Object from the state object
    }

    getLeg() {
      if (!!this.getCellDataObject()) {
        return this.getCellDataObject().leg
      }
      return null
    }
    // Perhaps "hasOuts()" ************************************
    // This only tells you if the cell contains outs, not the direction of the leg
    isOut() {
      return this.getOrders().some((x) => x.isOut() == true)
    }
    getTime() {
      // Maybe make the row's time a class? **************************************
    }
    getHour() {}
    update() {
      let cellData = this.getCellDataObject() // Get the data from the state object
      let $this = this.$this // simplify the reference to the jQuery object
      // --------------
      // Make Draggable
      // --------------
      // Turn draggable on by default, then off if not needed... otherwise you have to test for it's existence before truning it off.
      /*
        (Example)
        Uncaught Error: cannot call methods on draggable prior to initialization;
        attempted to call method 'disable'
      */
      $this.draggable({
        revert: true,
        helper: "clone",
      })
      // --------------
      // Blank the cell
      // --------------
      $this.text("")
      $this.css("background-image", "")
      // --------
      // If Data
      // --------
      if (!!cellData) {
        debug.log("{TableCell}.update()", cellData)
        //
        // In/Out Chevrons
        //
        switch (this.getLeg()) {
          case "A":
          case null:
            let name = "--in"
            let val = "pink"
            CSS.setVal(name, val)
            //
            // In
            //
            $this.css("background-image", "var(--gradient-in)")
            break
          case "B":
            //
            // Out
            //
            $this.css("background-image", "var(--gradient-out)")
            break
        }
        // *****************************************************
        // Get the number of pax and which product they're doing
        // *****************************************************
        // We have the orderNumber and item
        // reach into the manifest and get the Booking Object
        //

        debug.log("cellData", cellData)
        let bookings = this.getOrders() // returns an array of Booking Objects [{Booking},{Booking}]
        debug.log("bookings", bookings)

        let pax = bookings.reduce((acc, booking) => {
          // Find the item that matches the booking's .item variable
          let item = booking.order.items.find((item) => item.productCode == booking.item)
          let paxNum
          if (!!item) {
            paxNum = item.participants.length
          }
          return acc + paxNum
        }, 0)

        // Use map to extract the GYACode into an array
        // Use [...new Set()] to eliminate duplicates
        // (Without the [...] you get objects)
        let codes = [...new Set(bookings.map((b) => b.product.GYACode))].join("<BR>")
        $this.html(`(${pax})  ${codes}`)
      } else {
        $this.draggable("disable")
      }
    }
  }
</script>
