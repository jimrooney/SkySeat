<script>
  // Object for TableCells
  class TableCell {
    constructor(board, r, c) {
      let _this = this // reference for inside the click function scope
      this._this = this // keep a reference to this JS object (self reference)
      this.board = board // reference to the instantiating board
      this.id = r + "_" + c
      this.row = r
      this.column = c
      this.hour // Placeholder
      // -------------------------------------------
      // jQuery object
      // -------------------------------------------
      let $this = $("<td />", {
        class: "TableCell Row_" + r + " Col_" + c,
        id: this.id,
        text: this.id,
      })
      // -------------------------------------------
      // Backreference
      // -------------------------------------------
      $this.prop("_this", this._this) // Backreference to JS from jQuery object
      this.$this = $this // keep a reference to the jQuery object
      // -------------------------------------------
      // Droppable
      // -------------------------------------------
      $this.droppable({
        accept: ".BookingSprite, .TableCell",
        drop: this.handleDrop,
        delay: 100, // Might not need this now *******************
      })
      // -------------------------------------------
      // Click
      // -------------------------------------------
      $this.click(function () {
        console.log("TableCell Click")
        console.log("Classes: %o", $(this).attr("class"))
        console.log("TableCell.hour: %o", _this.hour)
        //
        // ******************************************************************************
        // Remove the inMarker class (just to see class removal function visually)
        $this.removeClass("inMarker") // ******* Testing. This can be removed *************
        // ******************************************************************************
        //
        let data = _this.getDataObject()
        if (!!data) {
          let bookings = _this.getBookingObjects(data)
          //
          console.log("TableCell bookings: %o", bookings)
          console.log("TableCell data: %o", data)
        }
      })
    }
    // -------------------------------------------
    // Drop
    // -------------------------------------------
    handleDrop(event, ui) {
      // $(this) is the TD
      let _thisObject = Events // Necessary _thisObject hardcoded link for Object Literal sytax
      // ***********************************************************************************
      // We'll need to handle drops from other boards here
      // ***********************************************************************************
      //
      // First thing's first: is it a legal drop (in/out)
      // Other than that, I don't know that there's much that needs to happen on a drop... probably check the outcell too maybe? *******************
      //
      console.log("TableCell Drop")
      let $Board = $(this).closest(".root") // jQuery root
      let _board = $Board.data("root") // JavaScript root
      let dragged = ui.draggable // ui.draggable : The dropped sprite
      let manifest = _board.manifest
      //
      // Color the manifest object
      //
      dragged.css("background-color", "var(--main-bg-color)")
      // -------------------------------------------------------------------
      // Record Drop
      // -------------------------------------------------------------------
      _board.state.add($(this), dragged) // This is the magic // This adds the data to the State object (two dimensional array that mirrors the Board)
      _board.update() // board.update() calls update() on each TableCell.
    }
    // ------------------------------
    // getBookingObjects
    // ------------------------------
    //
    // Check the State and get the CellData objects
    // pass them to the Manifest and get back the actual booking objects
    //
    getBookingObjects() {
      let ret
      let data = this.board.state.getCellData(this.$this) // get the CellData Object from the state object
      if (!!data) {
        ret = this.board.manifest.getBookingObjects(data)
      }
      return ret
    }
    getDirection() {
      let direction = ""
    }
    getTime() {
      // Maybe make the row's time a class? **************************************
    }
    getHour() {}
    getDataObject() {
      //
      // get the CellData Object from the state object
      //
      let data = this.board.state.getCellData(this.$this)
      return data
    }
    update() {
      let data = this.getDataObject()
      let $this = this.$this // simplify the reference to the jQuery object
      // set draggable so can be removed without testing or just left active
      $this.draggable({
        revert: true,
        helper: "clone",
      })
      /*
      

      Next up... need to discern all of the cell information for display based on the orderNumbers in the state object.


      */
      $this.text("")
      if (!!data) {
        console.log("CellID: %o",data.cellID)
        console.log("TableCell Update Data: %o", data)
        // let bookings = this.board.manifest.getBookingObjects(data)
        // console.log("TableCell.update()... bookings: %o", bookings)
        
        let color = {
          main: "blue",
          highlight: "yellow",
        }
        // In or Out? ***************************************************
        //$this.addClass("inMarker") // WTF? This breaks things? ***************
        $this.css("background-image", "var(--gradient-in)")
        $this.text(data.cellID) // just show the cellID for now ********
      } else {
        // $this.draggable("disable")

      }
    }
  }
</script>
