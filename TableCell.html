<script>
  // Object for TableCells
  class TableCell {
    constructor(board, r, c) {
      let _this = this // reference for inside the click function scope
      this._this = this // keep a reference to this JS object (self reference)
      this.board = board // reference to the instantiating board
      this.id = r + "_" + c
      this.planeCellID = "0_" + c
      this.$PlaneCell = $("#0_" + c)
      this.row = r
      this.column = c
      this.hour // Placeholder
      this.leg
      //
      // _this.getData() holds all the Cell's data
      //
      // -------------------------------------------
      // jQuery object
      // -------------------------------------------
      let $this = $("<td />", {
        class: "TableCell Row_" + r + " Col_" + c,
        id: this.id,
      })
      // -------------------------------------------
      // Backreference
      // -------------------------------------------
      $this.data("_script", this._this) // Backreference to JS from jQuery object
      this.$this = $this // keep a reference to the jQuery object
      // -------------------------------------------
      // Droppable
      // -------------------------------------------
      $this.droppable({
        accept: ".BookingSprite, .TableCell",
        drop: this.handleDrop,
        delay: 100, // Might not need this now *******************
      })
      // -------------------------------------------
      // Click
      // -------------------------------------------
      $this.click(function () {
        console.log("TableCell Click")
        console.log("ID: %o", $(this).prop("id"))
        console.log("Hour: %o", _this.hour)
        //
        let data = _this.getData()
        if (!!data) {
          $("#Details").data("root").show($(this))
          $("#Details").show()
        }
      })
    }
    // -------------------------------------------
    // Drop
    // -------------------------------------------
    handleDrop(event, ui) {
      //
      // Since this is getting called externally, "this" isn't this obj
      // So we'll use the jQuery $(this) to get a pointer to this object
      //
      let $dropped = ui.draggable // ui.draggable : The Manifest Sprite or $dropped TableCell
      let _dropped = $dropped.data("_script") // ({TableCell} or {Booking}) JS object attached to the Selector
      //_dropped.constructor.name // {TableCell} or {Booking}
      let _this = $(this).data("_script") // This JS Object
      let cellData = _this.getData()

      let leg = _this.getLeg()
      let droppedIsOut = _dropped.isOut()

      if (_this.isLegalDrop(leg, droppedIsOut)) {
        // ====================================================================
        // Drop accepted, record and update.
        _this.recordDrop($(this), $dropped) // recordDrop({TableCell},{Booking})

        // Perhaps causing the error? **************************************************************************
        // $(this).draggable("enable")
        // // Centers the cursor
        // $(this).draggable("option", "cursorAt", {
        //   left: Math.floor(ui.helper.width() / 2),
        //   top: Math.floor(ui.helper.height() / 2),
        // })

        _this.removeBookings(ui, _this)
        // ====================================================================
      } else {
        let msg = "Wrong Type: DroppedIsOut" + droppedIsOut + " CellLeg: " + leg
        utility.error(msg)
      }
    }
    removeBookings(ui, _this) {
      $(ui.helper).remove()
      let $dropped = ui.draggable // ui.draggable : The Manifest Sprite or $dropped TableCell
      let _dropped = $dropped.data("_script")
      if (!!_dropped.board) {
        _dropped.board.state.removeOrder($dropped) // List of bookings instead?**************
      }
    }
    clear() {
      this.$this.removeClass("inCell")
      this.$this.removeClass("outCell")
      this.update()
    }
    // -------------------------------------------------------------------
    // Record Drop
    // -------------------------------------------------------------------
    recordDrop($this, $dropped) {
      //
      // Drop is legal, record it.
      //
      // Since this is getting called externally, "this" isn't this obj
      // So we pass in $this and use the jQuery $(this) to get a pointer to this object
      //
      // // This is the magic //
      //

      // This is the call we're pulling up in to this function ************************
      //this.board.state.add($this, $dropped) // This adds the data to the State object (two dimensional array that mirrors the Board)

      // === Update ===
      // this.board.update() // board.update() calls update() on each TableCell.

      let _dropped = $dropped.data("_script") // {Booking}
      let cellData = this.board.state.getData(this.id) // {CellData} // will return a blank object by default

      // console.log("\n\n== Drop ==")
      // console.log("This: %o", this) // {TableCell}
      // console.log("CellData %o", cellData) // {CellData}
      // console.log("Bookings: %o", _dropped) // {Booking}

      cellData.addOrder(_dropped)

      // console.log("New CellData: %o", cellData)

      // Add to {state}
      if (cellData.bookingOrders.length > 0) {
        this.board.state.data[this.id] = cellData
      }

      // === Update ===
      this.board.update() // board.update() calls update() on each TableCell.
      // *** possibly only update effected cells ************************************
      $dropped.css("background-color", "var(--main-bg-color)") // Color the manifest object
    }
    // -------------------------------------------------------------------
    // isLegalDrop
    // -------------------------------------------------------------------
    isLegalDrop(cellLeg, droppedIsOut) {
      let cellIsOut = cellLeg == "B"
      /*
      Cell hasn't been branded = legal // can be either
      Cell matches drop = legal

      ***************************************************************************
      Probably need to add further looking tests for return flight cell checks...
      Or, those checks can call this function
      ***************************************************************************
      */
      console.log("isLegalDrop(cellIsOut, droppedIsOut) %o %o", cellIsOut, droppedIsOut)
      let legal
      cellLeg == null ? (legal = true) : cellIsOut == droppedIsOut ? (legal = true) : (legal = false)
      return legal
    }
    // ------------------------------
    // getBookingObjects
    // ------------------------------
    //
    // Check the State and get the CellData objects
    // pass them to the Manifest and get back the actual booking order objects
    //
    getOrders() {
      //
      // Returns an array of booking objects objects (from State)
      //
      let manifest = this.board.manifest
      let retArray = []
      let data = this.getData()
      if (!!data) {
        data.bookingOrders.forEach((o) => {
          let s = o.split("_") // orderNumber + "_" + itemNumber
          let orderNumber = s[0]
          let itemNumber = parseInt(s[1])
          let order = manifest.orders.find((x) => x.orderNumber === orderNumber)
          let item = order.items[itemNumber]
          let booking = new Booking(manifest, order, item)
          retArray.push(booking)
        })
      }
      return retArray
    }
    getData() {
      //
      // get the CellData Object from the state object
      //
      return this.board.state.getData(this.$this) // get the CellData Object from the state object
    }
    setPlaneData(key, val) {
      console.log("Set Plane Data, Key: %o Val: %o", key, val)
      let s = this.getState() // get copy of current State
      let state = JSON.parse(JSON.stringify(s))
      state.planeData[key] = val
      console.log("Set State: %o", state)
      this.setState(state)
    }
    setState(state) {
      this.board.state.data[state.cellID] = state
    }
    getState() {
      let state = this.board.state.getData(this.$this) // get the CellData Object from the state object
      // Check for an assigned plane. If none, get from the PlaneCell
      if (!!state.planeData && !!state.planeData.reg) {
        return state
      }
      let PCState = this.$PlaneCell.data("_script").getData()
      let data = {
        planeData: PCState.planeData,
      }
      state = { ...state, ...data }
      return state
    }
    getLeg() {
      if (!!this.getData()) {
        return this.getData().leg
      }
      return null
    }
    getPlane() {
      let state = this.getState()
      //
      // Get the airplane raw data
      //
      let planeData = PlaneManager.planes.data.find(function (el) {
        return el.reg == state.planeData.reg
      })
      console.log("PlaneData: %o", planeData)
      //
      // convert to Airplane Object
      //
      let airplane
      if (!!planeData.type) {
        let dynamic_class = eval(planeData.type)
        airplane = new dynamic_class(planeData)
      }

      let fuelStation = airplane.stations.find((station) => station.type.includes("fuel"))
      fuelStation.weight = parseInt(state.planeData.fuel) * 0.72 // Adjust for Jet A ********** (.8) ****

      console.log("\n\nAirplane: %o", airplane)
      return airplane
    }
    getWB() {
      // Reg
      // Fuel
      // Pilot
      // CoPilot

      // Pax
      // Luggage
      // Modifications (seats/controls/pods)
      // Baggage
      let airplane = this.getPlane()
      /*
        airplane
        .station ... stations will include the pilot and copilot... we'll hardcode them for now *****
*/

      airplane.stations[0].weight = 83 // hardcoding pilot weight for now *******************

      $(".station")
        .children()
        .each(function (i, $div) {
          let seat
          let weight
          let pax // array of Rezdy labels [{},{}]

          seat = parseInt($(this).closest(".station").data("seat")) - 1 // 0 based counting
          pax = $(this).data("pax")
          weight = $(this).data("_pax").getWeight()

          console.log("Seat: %o", seat)
          console.log("Pax: %o", pax)
          console.log("Pax Weight: %o", weight)

          if (seat >= 0) {
            airplane.stations[seat].weight = weight
          }
        })

      console.log("Airplane: %o", airplane)
      let wb = airplane.getWB()
      console.log("WB: %o", wb)
      console.log("\n\n")
      //
      //
      //
      return wb
    }
    // Perhaps "hasOuts()" ************************************
    // This only tells you if the cell contains outs, not the direction of the leg
    isOut() {
      return this.getOrders().some((x) => x.isOut() == true)
    }
    getTime() {
      // Maybe make the row's time a class? **************************************
    }
    //
    // get Plane Crew Fuel
    //
    getPCF() {
      let state = this.getState()
      console.log("PCF: %o", state)
    }
    getHour() {}
    update() {
      let cellData = this.getState() // Get the data from the state object
      let $this = this.$this // simplify the reference to the jQuery object
      // --------------
      // Make Draggable
      // --------------
      // Turn draggable on by default, then off if not needed... otherwise you have to test for it's existence before truning it off.
      /*
        (Example)
        Uncaught Error: cannot call methods on draggable prior to initialization;
        attempted to call method 'disable'
      */
      $this.draggable({
        revert: true,
        helper: "clone",
      })
      // --------------
      // Blank the cell
      // --------------
      $this.text("")
      $this.css("background-image", "")
      $this.removeClass("outCell")
      $this.removeClass("inCell")
      // --------
      // If Data
      // --------
      if (!!cellData && cellData.bookingOrders.length > 0) {
        debug.log("{TableCell}.update()", cellData)
        //
        // In/Out Chevrons
        //
        switch (this.getLeg()) {
          case "A":
          case null:
            let name = "--in"
            let val = "pink"
            CSS.setVal(name, val)
            //
            // In
            //
            $this.removeClass("outCell")
            $this.addClass("inCell")
            break
          case "B":
            //
            // Out
            //
            $this.removeClass("inCell")
            $this.addClass("outCell")
            break
        }
        // **********************************************************************************************************
        // Get the number of pax and which product they're doing
        // **********************************************************************************************************
        // We have the orderNumber and item
        // reach into the manifest and get the Booking Object
        //
        let bookings = this.getOrders() // returns an array of Booking Objects [{Booking},{Booking}]
        let numPax = bookings.reduce((acc, booking) => {
          return acc + booking.item.participants.length
        }, 0)
        // Use map to extract the GYACode into an array
        // Use [...new Set()] to eliminate duplicates
        // (Without the [...] you get objects)
        let codes = [...new Set(bookings.map((b) => b.product.GYACode))].join("<BR>")
        $this.html(`(${numPax})  ${codes}`)
        $this.draggable({
          //revert: true,
          helper: "clone",
          cursorAt: { left: 5, top: 5 },
        })
      } else {
        $this.draggable("disable")
      }
    }
  }
</script>
