<script>
  // Object for TableCells
  class TableCell {
    constructor(parent, r, c) {

      this._this = this // keep a reference to this JS object
      this.parent = parent // reference to the instantiating board
      this.id = r + "_" + c

      this.row = r
      this.column = c
      let TD = $("<td />", {
        class: "TableCell Row_" + r + " Col_" + c,
        id: this.id,
        text: this.id,
      })
      TD.prop("_this", this._this)
      this.$this = TD
      
    }
    update() {
      let data = this.parent.state.data[this.id]
      if(!!data){
        let bookings = this.parent.manifest.getTripData(data)
        console.log("Bookings: %o",bookings)
        this.$this.text(data)
        let color = {
          main: "blue",
          highlight: "yellow"
        }
        this.$this.css("background-image","var(--gradient-in)")
      }
      //console.log("Update() %o",this.$this.prop("id"))
    }

  }
</script>
