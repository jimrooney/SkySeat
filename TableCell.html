<script>
  // Object for TableCells
  class TableCell {
    constructor(parent, r, c) {
      this._this = this // keep a reference to this JS object
      this.parent = parent // reference to the instantiating board
      this.id = r + "_" + c

      this.row = r
      this.column = c
      let $TC = $("<td />", {
        class: "TableCell Row_" + r + " Col_" + c,
        id: this.id,
        text: this.id,
      })
      $TC.prop("_this", this._this) // Backreference to JS from jQuery object
      this.$this = $TC
      this.$this.click(function () {
        console.log("Click")
        $TC.removeClass("inTest") // ******* Testing. This can be removed *************
      })
    }
    update() {
      let data = this.parent.state.data[this.id] // get the cell data from the state object
      let $this = this.$this // simplify the reference to the jQuery object
      // set draggable so can be removed without testing or just left active
      $this.draggable({
        revert: true,
        helper: "clone",
      })
      /*
      

      Next up... need to discern all of the cell information for display based on the orderNumbers in the state object.


      */
      if (!!data) {
        let bookings = this.parent.manifest.getTripData(data)
        console.log("Bookings: %o", bookings)
        $this.text(data)
        let color = {
          main: "blue",
          highlight: "yellow",
        }
        $this.addClass("inTest")
        $this.css("background-image", "var(--gradient-in)")
      } else {
        $this.draggable("disable")
        $this.text("")
      }
      //console.log("Update() %o",this.$this.prop("id"))
    }
  }
</script>
