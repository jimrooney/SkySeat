<script>
  // Object for TableCells
  class TableCell {
    constructor(r, c) {
      this._this = this
      this.row = r
      this.column = c
      let TD = $("<td />", {
        class: "TableCell Row_" + r + " Col_" + c,
        id: r + "_" + c,
        text: r + "_" + c,
      })
      TD.prop("_this", this._this)
      this.$this = TD
    }
    update() {
      console.log("Update() %o",this.$this)
    }
  }
</script>
