<script>
  // Object for TableCells
  class TableCell {
    constructor(board, r, c) {
      let _this = this // reference for inside the click function scope
      this._this = this // keep a reference to this JS object (self reference)
      this.board = board // reference to the instantiating board
      this.id = r + "_" + c
      this.row = r
      this.column = c
      let $this = $("<td />", {
        class: "TableCell Row_" + r + " Col_" + c,
        id: this.id,
        text: this.id,
      })
      $this.prop("_this", this._this) // Backreference to JS from jQuery object
      this.$this = $this // keep a reference to the jQuery object
      //
      // -------------------------------------------
      // Click
      // -------------------------------------------
      $this.click(function () {
        console.log("TableCell Click")
        //
        // ******************************************************************************
        // Remove the inMarker class (just to see class removal function visually)
        $this.removeClass("inMarker") // ******* Testing. This can be removed *************
        // ******************************************************************************
        //
        let data = _this.board.state.getCellData($this) // get the CellData Object from the state object
        if (!!data) {
          let bookings = _this.getBookingObjects(data)
          //
          console.log("TableCell bookings: %o", bookings)
          console.log("TableCell data: %o", data)
        }
      })
    }
    getBookingObjects(){
      let ret
      let data = this.board.state.getCellData(this.$this) // get the CellData Object from the state object
      if (!!data){
        ret = this.board.manifest.getBookingObjects(data)
      }
      return ret
    }
    getDirection() {
      let direction = ""
    }
    getData() {}
    update() {
      let data = this.board.state.getCellData(this.$this) // get the cell data from the state object
      let $this = this.$this // simplify the reference to the jQuery object
      // set draggable so can be removed without testing or just left active
      $this.draggable({
        revert: true,
        helper: "clone",
      })
      /*
      

      Next up... need to discern all of the cell information for display based on the orderNumbers in the state object.


      */
      if (!!data) {
        console.log("TableCell Update Data: %o", data)
        let bookings = this.board.manifest.getBookingObjects(data)
        console.log("TableCell.update()... bookings: %o", bookings)
        $this.text(data)
        let color = {
          main: "blue",
          highlight: "yellow",
        }
        // In or Out? ***************************************************
        $this.addClass("inMarker")
        $this.css("background-image", "var(--gradient-in)")
      } else {
        $this.draggable("disable")
        $this.text("")
      }
    }
  }
</script>
