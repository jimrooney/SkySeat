<script>
  // Object for TableCells
  class TableCell extends Plottable {
    constructor(board, r, c) {
      super()
      let _this = this // reference for inside the click function scope
      this._this = this // keep a reference to this JS object (self reference)
      this.board = board // reference to the instantiating board
      this.id = r + "_" + c
      this.planeCellID = "0_" + c
      this.$PlaneCell = $("#0_" + c)
      this.row = r
      this.column = c
      this.hour // Placeholder
      //this.leg
      //
      // _this.getData() holds all the Cell's data
      //
      // -------------------------------------------
      // jQuery object
      // -------------------------------------------
      let $this = $("<td />", {
        class: `TableCell Row_${r} Col_${c} MobileButton ${this.id}`, //"TableCell Row_" + r + " Col_" + c,
        id: this.id,
      }).hover(
        function () {
          const $FBox = $("<div />", {
            class: "FloatingBox",
          })
          const paxList = _this.getPax()
          if (!!paxList) {
            const _acc = []
            paxList.forEach((pax) => {
              _acc.push(`${pax.fullName} (${pax.weight.declared})`)
              $("." + pax.orderNumber).addClass("highlight")
            })
            $FBox.html(_acc.join("<br>"))
            _this.board.manifest.$this.append($FBox)
          }
        },
        function () {
          const paxList = _this.getPax()
          if (!!paxList) {
            paxList.forEach((pax) => {
              $("." + pax.orderNumber).removeClass("highlight")
            })
          }
          $(".FloatingBox").empty()
        }
      )
      // -------------------------------------------
      // Backreference
      // -------------------------------------------
      $this.data("_script", this._this) // Backreference to JS from jQuery object
      this.$this = $this // keep a reference to the jQuery object
      // -------------------------------------------
      // Droppable
      // -------------------------------------------
      $this.droppable({
        accept: ".BookingSprite, .TableCell",
        drop: this.handleDrop,
        delay: 100, // Might not need this now *******************
      })
      // -------------------------------------------
      // Click
      // -------------------------------------------
      $this.click(function () {
        const data = _this.getData() // gets the data from {State}
        if (!!data?.passengers.length > 0) {
          // Unless there's pax, don't bother doing anything
          const plane = _this.getPlane() // Gets the plane based on {State}
          //
          if (!!plane) {
            /* ***************************************************************************
            Rewire all this (below) so that we pass the data into Details.show()
            Right now, we're passing in the jQuery for it to extract the data from.
            pass this cell's id... Details can then pull this cell plus all it's sister cells based on matrix
            */
            $("#Details").data("root").show($(this))
            $("#Details").show()
          }
        }
        //_this.show()
      })
      /*


      We'll use hover to test things.....

      Get the plane _this.getPlane()
      Get the passengers _this.getData().passengers

      ---- Load the plane ----
      Assign the pilot and then the pax
      Have different ways to load the plane to see if things work... possibly have different colours based on the results?
      So a loading that works easily, green... but something that's contingent on seating or something could be yellow?
      Red for "will not work, don't bother"
      Maybe magenta for "Will not work the way you want it (based on seats), but it could be done if you shift thing around"

      highlighting / colouring could be accomplished by adding and removing classes.

*/
      // $this.hover(
      //   function () {

      //   },
      //   function (){} // placeholder for the hover out function
      // )
    }
    getDate() {
      return this.board.manifest.getDate()
    }
    getTime() {
      return $(".TimeCell.Row_" + this.row).data("hour")
    }
    // -------------------------------------------
    // Drop
    // -------------------------------------------
    handleDrop(event, ui) {
      console.log("{TableCell}.handleDrop()")
      if (!ui.draggable.data("_script").getPassengers()) {
        // Plottable
        // ignore blank drops
        return
      }

      // -----------------------------------------
      // $dropped [jQuery dropped Sprite]
      // _dropped [JS dropped Sprite]
      // _this    [JS TableCell]
      // -----------------------------------------
      //
      //_dropped.constructor.name // {TableCell} or {Booking}
      //
      const $dropped = ui.draggable // ui.draggable : The Manifest Sprite or $dropped TableCell
      const _dropped = $dropped.data("_script") // ({TableCell} or {Booking}) JS object attached to the Selector
      //
      // -------[[ This ]]--------
      // Since this is getting called externally, "this" isn't this obj
      // So we'll use the jQuery $(this) to get a pointer to this object
      //
      const _this = $(this).data("_script") // This JS Object
      const list = ui.draggable.data("_script").getPax() // From Manifest
      const droppedPaxList = list.filter((px) => _dropped.board.manifest.getBooking(px)) // [{Pax}{Pax}]
      // ------------
      // Record Drop (if Legal)
      // ------------
      if (_this.isLegalDrop(_this.leg, _dropped.leg)) {
        // ---------------
        // Remove old plots (if Manifest drop)
        // ---------------
        _dropped.name
        if (_dropped instanceof Booking) {
          _this.board.clearPax(droppedPaxList)
        }
        // ---------------
        // Add Passengers
        // ---------------
        _this.addPax(droppedPaxList, _dropped)
        //
        // === Update ===
        //
        _this.removeBookings(ui, _this) // cleanup
        $dropped.css("background-color", "var(--main-bg-color)") // Color the manifest object
      } else {
        let msg = "Wrong Type: DroppedIsOut" + _dropped.leg + " CellLeg: " + _this.leg
        utility.error(msg)
        console.log("Error: %o", msg)
      }
      _this.board.state.clearEmpties()
      _this.board.update() // board.update() calls update() on each TableCell.
    }
    addPax(pax, droppedCell) {
      console.log("{TableCell}.addPax")
      console.log("this.cellData: ", this.cellData)
      console.log("droppedCell id: ", droppedCell.id)
      pax.forEach((p) => this.board.state.movePax(p, droppedCell.id, this.cellData))
    }
    removePax(pax) {
      this.board.state.clearoutPax(pax)
    }
    removeBookings(ui, _this) {
      $(ui.helper).remove()
      let $dropped = ui.draggable // ui.draggable : The Manifest Sprite or $dropped TableCell
      let _dropped = $dropped.data("_script")
      if (!!_dropped.board) {
        _dropped.board.state.removeOrder($dropped) // List of bookings instead?**************
        _dropped.update()
      }
    }
    clear() {
      this.$this.removeClass("inCell")
      this.$this.removeClass("outCell")
      this.update()
    }

    // -------------------------------------------------------------------
    // isLegalDrop
    // -------------------------------------------------------------------
    isLegalDrop(cellLeg, droppedLeg) {
      /*
      Cell hasn't been branded = legal // can be either
      Cell matches drop = legal

      ***************************************************************************
      Probably need to add further looking tests for return flight cell checks...
      Or, those checks can call this function
      ***************************************************************************
      */
      let legal
      cellLeg == null ? (legal = true) : cellLeg == droppedLeg ? (legal = true) : (legal = false)
      return legal
    }
    // ------------------------------
    // getBookingObjects
    // ------------------------------
    //
    // Check the State and get the CellData objects
    // pass them to the Manifest and get back the actual booking order objects
    //
    getOrders() {
      //
      // Returns an array of booking objects objects (from State)
      //
      let manifest = this.board.manifest
      let data = this.getData()
      let retArray = data.bookingOrders.map((o) => {
        if (!o) {
          return
        }
        let s = o.split("_") // orderNumber + "_" + productCode + "_" + itemNumber
        let orderNumber = s[0]
        let itemNumber = parseInt(s[2])
        let order = manifest.orders.find((x) => x.orderNumber === orderNumber)
        if (!!order) {
          let item = order.items[itemNumber]
          if (!!item) {
            let booking = new Booking(manifest, order, item, itemNumber)
            return booking
          }
        }
      })
      if (!retArray[0]) {
        retArray.shift()
      }
      return retArray
    }
    get cellData() {
      return this.board.state.getData(this.$this) // get the CellData Object from the state object
    }
    set cellData(cellData) {
      this.board.state.data[this.id] = cellData
    }
    getData() {
      //
      // get the CellData Object from the state object
      //
      return this.board.state.getData(this.$this) // get the CellData Object from the state object
    }
    setPlaneData(key, val) {
      let s = this.getStateCellData() // get copy of current State
      let state = JSON.parse(JSON.stringify(s))
      state.PCF[key] = val
      this.setState(state)
    }
    setStateCellData(cellData) {
      this.board.state.data[cellData.cellID] = cellData
    }
    getStateCellData() {
      let state = this.board.state.getData(this.$this) // get the CellData Object from the state object
      // Check for an assigned plane. If none, get from the PlaneCell
      if (state?.PCF?.reg) {
        return state
      }
      const PlaneCellState = this.$PlaneCell.data("_script").getData()
      const data = {
        PCF: PlaneCellState.PCF,
      }
      state = { ...state, ...data }
      return state
    }
    get leg() {
      if (!!this.getData()) {
        return this.getData().leg
      }
      return null
    }
    set leg(leg){
      this.setData(leg)
    }
    getPlane() {
      let state = this.getStateCellData()
      //
      // Get the airplane raw data
      //
      let PCF = PlaneManager.planes.data.find(function (element) {
        return element.reg == state.PCF.reg
      })
      //
      // convert to Airplane Object
      //
      let airplane
      if (!!PCF.type) {
        let dynamic_class = eval(PCF.type)
        airplane = new dynamic_class(PCF, state) // pass in the cell data from {state}
      }
      return airplane
    }
    getSeats() {
      return this.getPlane()
        .getSeats()
        .filter((station) => {
          return station.type.includes("seat") && parseInt(station.weight) > 0
        })
    }
    // Perhaps "hasOuts()" ************************************
    // This only tells you if the cell contains outs, not the direction of the leg
    isOut() {
      return this.getOrders().some((x) => x.isOut() == true) // returns {Booking} Objects
    }
    //
    // get Plane Crew Fuel
    //
    getPCF() {
      return this.getStateCellData()
    }
    getHour() {}
    // ----------------------------------------------------------------------------
    // Update
    // ----------------------------------------------------------------------------
    update() {
      let cellData = this.getStateCellData() // Get the data from the state object
      let $this = this.$this // simplify the reference to the jQuery object
      // --------------
      // Make Draggable
      // --------------
      // Turn draggable on by default, then off if not needed... otherwise you have to test for it's existence before truning it off.
      /*
        (Example)
        Uncaught Error: cannot call methods on draggable prior to initialization;
        attempted to call method 'disable'
      */
      $this.draggable({
        revert: true,
        helper: "clone",
      })
      // --------------
      // Blank the cell
      // --------------
      $this.text("")
      $this.css("background-image", "")
      $this.removeClass("outCell")
      $this.removeClass("inCell")
      // --------
      // If Data
      // --------
      if (!!cellData?.passengers.length > 0) {
        //
        // In/Out Chevrons
        //
        switch (this.leg) {
          case "A":
          case null:
            let name = "--in"
            let val = "pink"
            CSS.setVal(name, val)
            //
            // In
            //
            $this.removeClass("outCell")
            $this.addClass("inCell")
            break
          case "B":
            //
            // Out
            //
            $this.removeClass("inCell")
            $this.addClass("outCell")
            break
        }

        let codes = []
        let numPax = 0

        //const crew = cellData.passengers.filter((px) => px.fields.find((f) => f.label == "Role"))

        // Parse code list (4FCF) from cell's passenger list (excluding crew) ** might need to be excluding just PIC **
        const passengers = cellData.passengers.filter((px) => !px.fields.some((f) => f.label == "Role"))
        passengers.forEach((data) => {
          const pax = data.fields
          const pc = pax.find((item) => item.label === "productCode").value
          codes = [...new Set([...codes, ...[pc]])]
          numPax++
        })

        // for (const a in cellData.passengers) {
        //   const pax = cellData.passengers[a].fields
        //   const pc = pax.find((item) => item.label === "productCode").value
        //   codes = [...new Set([...codes, ...[pc]])]
        //   numPax++
        // }
        const GYACodes = codes.map((c) => gya.getProduct(c).GYACode)
        $this.html(`(${numPax})  ${GYACodes.join("<BR>")}`)
        $this.draggable({
          //revert: true,
          helper: "clone",
          cursorAt: { left: 5, top: 5 },
        })
      } else {
        $this.draggable("disable")
      }
    }
  }
</script>
