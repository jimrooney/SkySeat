<script>
  class Board {
    constructor($board) {
      this.$board = $board // save a reference to the jQuery objects
      this.$this = $board
      // Access this object through $([Board Selector]).data('root')
      //
      this.date = ""
      this.numCols = 5
      this.numRows = 12
      this.manifest = new Manifest(this)
    }
    //
    // Init... because some things don't exist yet, so we delay creating downstream objects.
    // Fix for jQuery timing issues (elements that get created downstream of the Classes)
    //
    init() {
      this.state = new State(this)
      this.state.load()
    }
    handleDatePickerSelect($picker) {
      this.load()
      this.manifest.showTitle()
    }
    load() {
      this.state.clear()
      this.manifest.load()
    }
    //
    // Get the date for this board (from the datepicker)
    //
    getDate() {
      return this.manifest.getDate()
    }
    setDate(date) {
      this.manifest.setDate(date)
    }
    //
    // Remove all pax from the board
    //
    clearPax(paxList) {
      this.state.clearoutPax(paxList)
    }
    //
    // Remove Previous plots that have rebooked/cancelled
    //
    removeOldBookings() {
      const state = this.state
      const manifest = this.manifest.getManifest()
      console.log("Manifest: ", manifest)
      // Loop over list of plotted pax ({state}) and compare to manifest.
      // If they're not in the manifest, remove them from the plot.

      const plottedPax = state.data
      const miaPax = []
      // this.state.data is an object, so need to use entries() to iterate over it
      for (let [key, value] of Object.entries(plottedPax)) {
        value.passengers.forEach((pax) => {
          const barcode = pax.fields.find((f) => f.label == "Barcode")
          // see if the barcode is in the manifest
          let ret
          manifest.forEach((order) => {
            order.items.find((item) => {
              let found = item.participants.find((part) => {
                const px = new Pax(part.fields)
                if (px.barcode == barcode.value) {
                  return true
                }
              })
              if (!!found) {
                ret = found
              }
            })
          })
          if (!ret) {
            miaPax.push(new Pax(pax))
          }
        })
      }
      //console.log("miaPax: %o", miaPax)
      miaPax.forEach(pax=>{
        this.state.removeAllBarcode(pax)
        this.update()
      })

      // Needs to be the other way around as we're removing what's not in the manifest... ***
      // this.manifest.orders.forEach((order) => {
      //   const booking = state.getBookings(order.orderNumber)

      //   if (!!booking) {
      //     console.log("Booking: ", booking)
      //   }
      // })
    }
    // --------------------------------
    // Update
    // --------------------------------
    // Calls update() on each TableCell
    //
    update() {
      this.manifest.showTitle()
      //
      // Pickups
      // pull pickup data down into the pax.fields
      //

      // here is where we need to now make 2 divs, one for pickup, one for dropoff
      this.$board.find(".PickupCell").each(function (i) {
        const row = $(this).data("row")
        let paxNum = $(this)
          .data("this")
          .manifest.getPickupList({ row: row })?.totalPax
        if (paxNum == 0) {
          paxNum = ""
        }
        $(this).text(paxNum)

        // Staggar here ***
        // need to know if it's an in or an out... then push it the appropriate offset
        // $(this).parent().css({ position: "relative" })
        // $(this).css({ top: -5, position: "absolute" })
      })
      //
      // Make things Draggable
      //
      initializeDraggables()
      //
      // Updata TableCells and reinit draggable code
      //
      this.$board.find(".TableCell").each(function (index) {
        if (!!$(this).data("_script")) {
          $(this).data("_script").update()
          //
          // Enable Dragging (only for cells with passengers)
          //
          $(this).draggable("disable") // Disable by default
          //
          // ReColor plotted bookings // this could encompass all of this code ***
          //
          if (!!$(this).data("_script").getPassengers()) {
            $(this)
              .data("_script")
              .getPassengers()
              .forEach((pax) => {
                const orderNumber = pax.fields.reduce((acc, field) => {
                  return field.label == "orderNumber" ? field.value : acc
                }, "")
                if (!!orderNumber) {
                  $(`.${orderNumber}`).addClass("Plotted")
                }
              })
            $(this)
              .draggable({
                revert: true,
                helper: "clone",
                cursor: "pointer",
              })
              //
              // Centers the cursor
              //
              .draggable({
                start: function (event, ui) {
                  $(this).draggable("instance").offset.click = {
                    left: Math.floor(ui.helper.width() / 2),
                    top: Math.floor(ui.helper.height() / 2),
                  }
                },
              })
              .draggable("enable")
          }
        }
      })
      //
      // Updata PlaneCells (set defaults)
      //
      const planeList = planes.data.slice(0) // this clones the planes.data array
      $(".PlaneCell").each(function () {
        const _this = $(this).data("_script")
        const data = _this.board.state.getData($(this))

        if (!data.PCF) {
          const plane = planeList.shift()
          data.PCF = {
            type: plane.type,
            reg: plane.reg,
            pilot: "Standard",
            fuel: "150",
          }
          _this.saveData(data)
        }
        //$("> #hours", this).remove() // removes all "hours" children ***********************
        _this.update() // call update against all PlaneCells (maybe use above code to refine that to just this board?)
      })

      //
      // Pickup Cells
      //

      $(".MobileButton").mouseenter(_mouseOverEvent).mouseleave(_mouseOutEvent)
    }
    /*

    Will need to update the origin board if moving between days.

    */

    //
    // Autogen boards
    //
    newRow($table, cols) {
      let $row = $("<tr/>")
      for (let i = 0; i < cols.length; i++) {
        //let $col = $("<td/>").append(cols[i])
        $row.append(cols[i])
      }
      $table.append($row)
    }
    close() {
      root.removeBoard(this)
      this.$board.remove()
    }
    writeBoard() {
      console.log("Write Board")
      // ----------------------
      // The Board Table
      // ----------------------
      this.$board.append(
        '<div class="Top"></div><div style="float:left; display: inline-block;" class="Header"><table class="BoardTable" /></div>'
      )
      const _this = this
      // const $closer = $(
      //   '<div class="popupCloseButton MobileButton">X</div>'
      // ).click(() => {
      //   _this.close()
      // })
      // this.$board.find(".Top").append($closer)
      // ----------------------
      // Root
      // ----------------------
      let $table = this.$board.find(".BoardTable")
      // ----------------------
      // Header Row
      // ----------------------
      let $row = $("<TR />")
        .append($('<td class="PickupAllCell" id="PH">&#9951;</td>'))
        .append($('<td class="Label Row_0 Col_0" id="0_0">Time</td>'))

      for (let i = 1; i <= this.numCols; i++) {
        let planeCell = new PlaneCell(this, 0, i)
        $row.append(planeCell.$this)
      }
      $table.append($row)
      //
      // Plotting Board
      //
      for (let r = 1; r <= this.numRows; r++) {
        // After the header row, we'll loop over the row maker function
        let thisRow = r
        let thisHour = time.getHourByRow(thisRow, 2)
        let myRow = []
        //
        // Pickup Column
        //
        myRow.push(
          $('<td class="PickupCell Row_' + thisRow + '"></td>')
            .data("row", thisRow)
            .data("this", this)
            // .hover(
            //   () => {
            //     this.$board
            //       .find(".Manifest_Container")
            //       .find("#Totals")
            //       .text(JSON.stringify(this.manifest.getPickupList({ row: thisRow }).locations))
            //   },
            //   () => {
            //     this.$board.find(".Manifest_Container").find("#Totals").text("")
            //   }
            // )
            .click(() => {
              $("#PickupList")
                .data("object")
                .show({
                  pickupList: this.manifest.getPickupList({ row: thisRow }),
                })
              $("#PickupList").show()
            })
        )
        //
        // Time column
        //
        let $timeTD = $("<TD/>")
        $timeTD.addClass("TimeCell Row_" + thisRow + " Col_0")
        $timeTD.attr("id", thisRow + "_0")
        $timeTD.data("hour", thisHour)
        $timeTD.data("row", thisRow)

        let $HS = $("<span />")
          .text(thisHour + ":00")
          .addClass("HourSchedule")

        let $hHS = $("<span />")
          .text(thisHour + ":30")
          .addClass("HalfHourSchedule")
        //.hide()

        $timeTD.append($HS)
        $timeTD.append($hHS)

        myRow.push($timeTD)
        //
        // TableCells
        //
        for (let c = 1; c <= this.numCols; c++) {
          let TC = new TableCell(this, r, c)
          TC.$board = this.$board
          TC.hour = thisHour
          let $TC = TC.$this // The class contructor makes a jQuery object and stores it in $this
          myRow.push($TC)
        }
        this.newRow($table, myRow)
      }
      // ----------
      // Manifest
      // ----------
      this.manifest.write()
      // ----------
      // DatePicker
      // ----------
      this.$board
        .find(".DatePicker")
        .prepend(
          `<div style="float:none; display: inline-block;"><input class="Nav datepicker" type="text" size="8"/></div>`
        )
      this.$datepicker = this.$board.find(".datepicker") // $("#" + this.$board.prop("id") + " .datepicker")
      Dates.initPicker(this.$datepicker, this)
      // ******************************************************************************
      // Autoload rezdy?
      //let date = this.$datepicker.datepicker("getDate")
      this.manifest.load()
      // -----------------------------------------
      // Set Winter/Summer **********************************************
      // -----------------------------------------
      $(".HalfHourSchedule").hide()

      this.init() // Initalize the board
    }
  }
</script>
