<script>
  class Board {
    constructor($root) {
      this.date = ""
      this.data = {}
      this.root = $root
      this.numCols = 5
      this.numRows = 12
      this.manifest = new Manifest($root)
      this.manifest.parent = this
    }
    //
    // Autogen boards
    //
    newRow($table, cols) {
      let $row = $("<tr/>")
      for (let i = 0; i < cols.length; i++) {
        let $col = $("<td/>").append(cols[i])
        $row.append($col)
      }
      $table.append($row)
    }
    writeBoard() {
      console.log("Write Board")
      //
      // DatePicker
      //
      this.root.append('<div><input class="Nav datepicker" type="text" size="8" id="MyDatePicker" />DatePicker</div>')
      // This sets the picker to NZ format (dd/mm/yyy) and to today's date
      Dates.initPicker($("#" + this.root.prop("id") + " .datepicker"))

      //
      // Manifest div
      //
 //     this.manifest.HTML()
//      this.root.append() // need to float or otherwise position it *********
      this.manifest.load()
      // ----------------------
      // The Board Table
      // ----------------------
      let table = this.root.append("<table class='BoardTable' id='MYTable' />")
      // ----------------------
      // Header Row
      // ----------------------
      let headerRow = []
      headerRow.push($('<td class="PickupAllCell" id="PH">&#9951;</td>'))
      headerRow.push($('<td class="Label Row_0 Col_0" id="0_0">Time</td>'))
      //
      for (let i = 1; i <= this.numCols; i++) {
        let id = "0" + "_" + i
        let col = $("<td />", {
          class: "PlaneCell Row_0 Col_" + i,
          id: id,
          text: id,
        })
        headerRow.push(col)
      }
      this.newRow(table, headerRow)
      //
      // Plotting Board
      //
      for (let r = 1; r <= this.numRows; r++) {
        // After the header row, we'll loop over the row maker function
        let thisRow = r
        let thisHour = time.getHourByRow(thisRow, 2)
        let myRow = []
        //
        // Pickup Column
        //
        myRow.push($('<td class="PickupCell" id="Row_' + thisRow + '"><span style="color: white;">00</span></td>'))
        //
        // Time column
        //
        let timeTD =
          '<td class="TimeCell Row_' +
          thisRow +
          ' Col_0" id="' +
          thisRow +
          '_0">' +
          '<span class="HourSchedule"><span class="hour">' +
          thisHour +
          '</span>:<span class="minute">00</span></span>' +
          '<div class="HalfHourSchedule">(' +
          thisHour +
          ":30)</div></td>"
        myRow.push($(timeTD))
        //
        // TableCells
        //
        for (let c = 1; c <= this.numCols; c++) {
          let TD = $("<td />", {
            class: "TableCell Row_" + r + " Col_" + c,
            id: r + "_" + c,
            text: r + "_" + c,
          })
          myRow.push(TD)
        }
        this.newRow(table, myRow)
      }
    }
  }
</script>
