<script>
  class Board {
    constructor($root) {
      this.$root = $root // save a reference to the jQuery object
      // Access this object through $([Board Selector]).data('root')
      //
      this.date = ""
      this.numCols = 5
      this.numRows = 12

      this.manifest = new Manifest($root)
      this.manifest.parent = this

      // 2 Dimensional array to hold the Board's State. (wrapped in an object to hold meta-data)
      this.data = {}
      this.data.state = new Array(this.numRows)
      for (let i = 0; i < this.data.state.length; i++) {
        this.data.state[i] = new Array(this.numCols)
      }
      //
      this.data.add = function (cell, dragged) {
        // console.log("This: %o", this) // This board object

        let data = dragged.prop("id")
        let row = cell.prop("id").split("_")[0]
        let col = cell.prop("id").split("_")[1]

        console.log("Row: %o", row)
        console.log("Col %o", col)
        console.log("Data: %o", data)
        // Maybe make this an array and push/pull data from it... *******************
        this.state[row][col] = data
      }
      this.data.get = function (cell) {
        let row = cell.prop("id").split("_")[0]
        let col = cell.prop("id").split("_")[1]
        return this.state[row][col]
      }
    }

    load() {
      this.manifest.load()
    }
    //
    // Autogen boards
    //
    newRow($table, cols) {
      let $row = $("<tr/>")
      for (let i = 0; i < cols.length; i++) {
        let $col = $("<td/>").append(cols[i])
        $row.append($col)
      }
      $table.append($row)
    }
    writeBoard() {
      console.log("Write Board")
      // ----------------------
      // The Board Table
      // ----------------------
      this.$root.append(
        '<div style="float:left; display: inline-block;"><table class="BoardTable" id="MYTable"/></div>'
      )
      let table = this.$root.find(".BoardTable")
      // ----------------------
      // Header Row
      // ----------------------
      let headerRow = []
      headerRow.push($('<td class="PickupAllCell" id="PH">&#9951;</td>'))
      headerRow.push($('<td class="Label Row_0 Col_0" id="0_0">Time</td>'))
      //
      for (let i = 1; i <= this.numCols; i++) {
        let id = "0" + "_" + i
        let col = $("<td />", {
          class: "PlaneCell Row_0 Col_" + i,
          id: id,
          text: id,
        })
        headerRow.push(col)
      }
      this.newRow(table, headerRow)
      //
      // Plotting Board
      //
      for (let r = 1; r <= this.numRows; r++) {
        // After the header row, we'll loop over the row maker function
        let thisRow = r
        let thisHour = time.getHourByRow(thisRow, 2)
        let myRow = []
        //
        // Pickup Column
        //
        myRow.push($('<td class="PickupCell" id="Row_' + thisRow + '"><span style="color: white;">00</span></td>'))
        //
        // Time column
        //
        let timeTD =
          '<td class="TimeCell Row_' +
          thisRow +
          ' Col_0" id="' +
          thisRow +
          '_0">' +
          '<span class="HourSchedule"><span class="hour">' +
          thisHour +
          '</span>:<span class="minute">00</span></span>' +
          '<div class="HalfHourSchedule">(' +
          thisHour +
          ":30)</div></td>"
        myRow.push($(timeTD))
        //
        // TableCells
        //
        for (let c = 1; c <= this.numCols; c++) {
          let TD = $("<td />", {
            class: "TableCell Row_" + r + " Col_" + c,
            id: r + "_" + c,
            text: r + "_" + c,
          })
          myRow.push(TD)
        }
        this.newRow(table, myRow)
      }
      // ----------
      // Manifest
      // ----------
      this.manifest.write()
      // ----------
      // DatePicker
      // ----------
      this.$root.find(".Manifest_Container").prepend(
        '<div style="float:none; display: inline-block;"><input class="Nav datepicker" type="text" size="8" id="MyDatePicker"/></div>'
      )
      this.$datepicker = $("#" + this.$root.prop("id") + " .datepicker")
      Dates.initPicker(this.$datepicker, this)
      // ******************************************************************************
      // Autoload rezdy?
      //let date = this.$datepicker.datepicker("getDate")
      this.manifest.load()


      // ----------
      // Set onClick
      // ----------
      $("#" + this.$root.prop("id") + " .TableCell").click(function () {
        // $("#" + this.$root.prop("id") + ...
        // Targeted at this board's .TableCells only so that further instantiation doesn't double fire the click
        // (This might not be necessary)

        //Stop click propagation. (works without this, but could stop problems down the track)
        event.stopPropagation()
        event.stopImmediatePropagation()

        let $root = $(this).closest(".root") // jQuery root
        let root = $root.data("root") // JavaScript root
        let bookingData = root.data.get($(this))
        console.log("TableCell Data: ", bookingData)
      })
    }
  }
</script>
