<script>
  class Board {
    constructor($root) {
      this.$this = $root
      this.$root = $root // save a reference to the jQuery object
      // Access this object through $([Board Selector]).data('root')
      //
      this.date = ""
      this.numCols = 5
      this.numRows = 12

      this.manifest = new Manifest($root)
      this.manifest.parent = this
    }
    //
    // Init... because some things don't exist yet, so we delay creating downstream objects.
    // Fix for jQuery timing issues (elements that get created downstream of the Classes)
    //
    init() {
      this.state = new State(this)
      // this.$datepicker ... created in writeBoard()
    }
    load() {
      this.state.clear()
      this.manifest.load()
    }
    // --------------------------------
    // Update
    // --------------------------------
    // Calls update() on each TableCell
    //
    update() {
      console.log("Board.update()")
      let $tableCells = this.$root.find(".TableCell")
      $tableCells.each(function (index) {
        if (!!$(this).data("_script")) {
          $(this).data("_script").update()
        }
      })
    }

    /*

    Will need to update the origin board if moving between days.

    */

    //
    // Autogen boards
    //
    newRow($table, cols) {
      let $row = $("<tr/>")
      for (let i = 0; i < cols.length; i++) {
        //let $col = $("<td/>").append(cols[i])
        $row.append(cols[i])
      }
      $table.append($row)
    }
    writeBoard() {
      console.log("Write Board")
      // ----------------------
      // The Board Table
      // ----------------------
      this.$root.append(
        '<div style="float:left; display: inline-block;"><table class="BoardTable" id="MYTable"/></div>'
      )
      let table = this.$root.find(".BoardTable")
      // ----------------------
      // Header Row
      // ----------------------
      let headerRow = []
      headerRow.push($('<td class="PickupAllCell" id="PH">&#9951;</td>'))
      headerRow.push($('<td class="Label Row_0 Col_0" id="0_0">Time</td>'))
      //
      for (let i = 1; i <= this.numCols; i++) {
        let id = "0" + "_" + i
        let col = $("<td />", {
          class: "BoardTable PlaneCell Row_0 Col_" + i,
          id: id,
          text: id,
        })
        headerRow.push(col)
      }
      this.newRow(table, headerRow)
      //
      // Plotting Board
      //
      for (let r = 1; r <= this.numRows; r++) {
        // After the header row, we'll loop over the row maker function
        let thisRow = r
        let thisHour = time.getHourByRow(thisRow, 2)
        let myRow = []
        //
        // Pickup Column
        //
        myRow.push($('<td class="PickupCell" id="Row_' + thisRow + '"><span style="color: white;">00</span></td>'))
        //
        // Time column
        //
        let $timeTD = $("<TD/>")
        $timeTD.addClass("TimeCell Row_" + thisRow + " Col_0")
        $timeTD.attr("id", thisRow + "_0")

        let $HS = $("<span />")
          .text(thisHour + ":00")
          .addClass("HourSchedule")

        let $hHS = $("<span />")
          .text(thisHour + ":30")
          .addClass("HalfHourSchedule")
        //.hide()

        $timeTD.append($HS)
        $timeTD.append($hHS)

        myRow.push($timeTD)
        //
        // TableCells
        //
        for (let c = 1; c <= this.numCols; c++) {
          let TC = new TableCell(this, r, c)
          TC.$board = this.$root
          TC.hour = thisHour
          let $TC = TC.$this // The class contructor makes a jQuery object and stores it in $this
          myRow.push($TC)
        }
        this.newRow(table, myRow)
      }
      // ----------
      // Manifest
      // ----------
      this.manifest.write()
      // ----------
      // DatePicker
      // ----------
      this.$root
        .find(".Manifest_Container")
        .prepend(
          '<div style="float:none; display: inline-block;"><input class="Nav datepicker" type="text" size="8" id="MyDatePicker"/></div>'
        )
      this.$datepicker = $("#" + this.$root.prop("id") + " .datepicker")
      Dates.initPicker(this.$datepicker, this)
      // ******************************************************************************
      // Autoload rezdy?
      //let date = this.$datepicker.datepicker("getDate")
      this.manifest.load()

      // -----------------------------------------
      // Set Winter/Summer **********************************************
      // -----------------------------------------
      $(".HourSchedule").hide()

      this.init() // Initalize the board

      //
      // Show State Button
      //
      let _this = this
      let $_s = $("<button class='Dark Debug'>").append("<BR>").text("State")
      this.$root.prepend($_s)
      $_s.on("click", function () {
        console.log("State.data: %o", _this.state.getState())
      })
    }
  }
</script>
